<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chat Phone｜社區系統</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=4" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />
    <link rel="stylesheet" href="css/pwa.css" />
    <style>
      :root {
        color-scheme: light;
        --cp-bg: #f5f7fb;
        --cp-card: #ffffff;
        --cp-border: rgba(15, 23, 42, 0.08);
        --cp-text: #0f172a;
        --cp-sub: #64748b;
        --cp-brand: #d32f2f;
        --cp-brand-soft: rgba(211, 47, 47, 0.08);
        --cp-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--cp-bg);
        color: var(--cp-text);
        font-family: "Segoe UI", "Noto Sans TC", Arial, sans-serif;
      }

      body {
        min-height: 100vh;
      }

      .chatphone-layout {
        height: 100dvh;
        display: grid;
        grid-template-rows: 6% 84% 10%;
      }

      .chatphone-hd {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        background: #fff;
        color: var(--cp-text);
        border-bottom: 1px solid var(--cp-border);
        padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
      }

      .chatphone-title {
        margin: 0;
        text-align: left;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.2px;
        color: var(--cp-text);
      }

      .chatphone-mid {
        overflow: auto;
        padding: 14px 18px;
      }

      .chatphone-status {
        min-height: 160px;
        border: 1px dashed rgba(100, 116, 139, 0.3);
        border-radius: 22px;
        display: grid;
        place-items: center;
        color: var(--cp-sub);
        background: rgba(255, 255, 255, 0.66);
        text-align: center;
        padding: 24px;
      }

      .chatphone-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
        gap: 10px;
      }

      .account-card {
        position: relative;
        aspect-ratio: 1 / 1;
        border-radius: 18px;
        border: 1px solid var(--cp-border);
        background: var(--cp-card);
        box-shadow: var(--cp-shadow);
        padding: 10px 8px;
        display: grid;
        grid-template-rows: auto auto auto;
        justify-items: center;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      .account-card > :not(.account-calllog-btn) {
        pointer-events: none;
      }

      .account-missed-badge {
        position: absolute;
        top: -6px;
        left: -6px;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 10px;
        background: #d32f2f;
        color: #fff;
        font-size: 11px;
        font-weight: 900;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #fff;
        box-shadow: 0 10px 20px rgba(17, 24, 39, 0.12);
        pointer-events: none;
      }

      .account-missed-badge[hidden] { display: none !important; }

      .account-calllog-btn {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        border: 1px solid rgba(17, 24, 39, 0.12);
        background: rgba(255, 255, 255, 0.92);
        color: rgba(17, 24, 39, 0.78);
        box-shadow: 0 10px 20px rgba(17, 24, 39, 0.12);
        touch-action: manipulation;
      }

      .account-calllog-btn:active {
        transform: scale(0.98);
      }

      .account-calllog-btn svg {
        width: 16px;
        height: 16px;
      }

      .account-card:hover,
      .account-card:focus-visible {
        transform: translateY(-1px);
        border-color: rgba(211, 47, 47, 0.24);
        box-shadow: 0 14px 30px rgba(211, 47, 47, 0.14);
        outline: none;
      }

      .account-avatar {
        width: min(30vw, 60px);
        height: min(30vw, 60px);
        border-radius: 999px;
        overflow: hidden;
        background: linear-gradient(135deg, #fde68a, #fca5a5 55%, #c4b5fd);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 900;
        box-shadow: 0 10px 24px rgba(211, 47, 47, 0.18);
      }

      .account-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
      }

      .account-house,
      .account-sub,
      .account-address {
        width: 100%;
        text-align: center;
        word-break: break-word;
      }

      .account-unit-row {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        align-items: start;
      }

      .account-label {
        font-size: 10px;
        color: var(--cp-sub);
        margin-bottom: 2px;
      }

      .account-value {
        font-size: 14px;
        font-weight: 800;
        line-height: 1.25;
      }

      .account-address .account-value {
        font-size: 11px;
        font-weight: 700;
        line-height: 1.2;
        display: -webkit-box;
        line-clamp: 2;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .chatphone-ft {
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(14px);
        border-top: 1px solid var(--cp-border);
        padding:
          12px
          14px
          calc(12px + env(safe-area-inset-bottom));
      }

      .filter-row {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 10px;
        justify-content: flex-start;
      }

      .filter-btn {
        min-height: 42px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid rgba(211, 47, 47, 0.18);
        background: #fff;
        color: var(--cp-text);
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }

      .filter-btn.active {
        background: var(--cp-brand);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 10px 24px rgba(211, 47, 47, 0.24);
      }

      #chatCallModal {
        z-index: 1200;
      }

      #chatCallModal .modal-ft {
        justify-content: center;
      }

      #chatHistoryModal {
        z-index: 1210;
      }

      @media (max-width: 420px) {
        .chatphone-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="chatphone-layout">
      <header class="chatphone-hd">
        <h1 class="chatphone-title" id="communityName">社區名稱</h1>
      </header>

      <main class="chatphone-mid">
        <div class="chatphone-grid" id="accountGrid"></div>
      </main>

      <footer class="chatphone-ft">
        <section aria-label="棟別篩選">
          <div class="filter-row" id="buildingFilters">
            <button class="filter-btn active" type="button" data-building="all">全部</button>
          </div>
        </section>
      </footer>
    </div>

    <div class="modal" id="chatCallModal" hidden>
      <div class="modal-backdrop"></div>
      <div class="modal-dialog trae-browser-inspect-draggable" role="dialog" aria-modal="true" aria-labelledby="chatCallModalTitle" style="width:min(1200px,90vw);max-width:90vw;height:90vh;display:flex;flex-direction:column;">
        <div class="modal-hd">
          <h3 class="modal-title" id="chatCallModalTitle">通話</h3>
          <button class="modal-close" type="button" id="btnChatCallClose" aria-label="關閉">×</button>
        </div>
        <div class="modal-body chatcall-body">
          <div class="chatcall-avatar">
            <img id="chatCallAvatarImg" alt="" hidden>
            <span id="chatCallAvatarText" class="intercom-avatar-text">U</span>
          </div>
          <h2 class="chatcall-name" id="chatCallName">聯絡人</h2>
          <div class="chatcall-sub" id="chatCallSub">語音通話</div>
          <div class="chatcall-status" id="chatCallStatus">正在呼叫…</div>
          <div class="chatcall-timer" id="chatCallTimer">00:00</div>
          <div class="chatcall-help" id="chatCallHelp" hidden></div>
        </div>
        <div class="modal-ft">
          <button class="chatcall-btn" type="button" id="btnChatCallHangup">掛斷</button>
        </div>
      </div>
      <audio id="chatCallRemoteAudio" autoplay playsinline></audio>
    </div>

    <div class="modal" id="chatHistoryModal" hidden>
      <div class="modal-backdrop" id="chatHistoryBackdrop"></div>
      <div class="modal-dialog trae-browser-inspect-draggable" role="dialog" aria-modal="true" aria-labelledby="chatHistoryTitle" style="width:min(1200px,90vw);max-width:90vw;height:90vh;display:flex;flex-direction:column;">
        <div class="modal-hd">
          <h3 class="modal-title" id="chatHistoryTitle">通話紀錄</h3>
          <button class="modal-close" type="button" id="btnChatHistoryClose" aria-label="關閉">×</button>
        </div>
        <div class="modal-body" style="padding:0;min-height:0;flex:1 1 auto;">
          <iframe id="chatHistoryIframe" src="" frameborder="0" allow="autoplay; clipboard-write; encrypted-media" style="width:100%;height:100%;display:block;"></iframe>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/pwa.js?v=6"></script>
    <script>
      (function () {
        "use strict";

        const firebaseConfig = window.FIREBASE_CONFIG;
        if (!firebaseConfig) throw new Error("Missing FIREBASE_CONFIG");

        try {
          firebase.initializeApp(firebaseConfig);
        } catch {}

        const auth = firebase.auth();
        const db = firebase.firestore();
        const FieldValue = firebase.firestore.FieldValue;
        try {
          db.settings({
            experimentalAutoDetectLongPolling: true,
            experimentalForceLongPolling: true,
            useFetchStreams: false,
            ignoreUndefinedProperties: true,
          });
        } catch {}

        const communityNameEl = document.getElementById("communityName");
        const gridEl = document.getElementById("accountGrid");
        const filtersEl = document.getElementById("buildingFilters");
        const callModalEl = document.getElementById("chatCallModal");
        const historyModalEl = document.getElementById("chatHistoryModal");
        const historyIframeEl = document.getElementById("chatHistoryIframe");
        const historyTitleEl = document.getElementById("chatHistoryTitle");
        const historyCloseBtn = document.getElementById("btnChatHistoryClose");
        const historyBackdropEl = document.getElementById("chatHistoryBackdrop");
        const callAvatarImgEl = document.getElementById("chatCallAvatarImg");
        const callAvatarTextEl = document.getElementById("chatCallAvatarText");
        const callNameEl = document.getElementById("chatCallName");
        const callSubEl = document.getElementById("chatCallSub");
        const callStatusEl = document.getElementById("chatCallStatus");
        const callTimerEl = document.getElementById("chatCallTimer");
        const callHelpEl = document.getElementById("chatCallHelp");
        const callHangupBtn = document.getElementById("btnChatCallHangup");
        const callCloseBtn = document.getElementById("btnChatCallClose");

        let allAccounts = [];
        let buildingOptions = [];
        let activeBuilding = "all";
        let currentUserData = null;
        let currentCommunityKey = "";
        let viewerIsAdminLike = false;
        let chatCallState = null;
        let _unsubResidentMissedCounts = null;
        let _residentMissedCountsCid = "";
        let _residentMissedCountsByUid = new Map();
        let _residentMissedCountsByUnitKey = new Map();
        let _hiddenCallIdsUid = "";
        let _hiddenCallIdsUnsub = null;
        let _hiddenCallIdSet = new Set();

        function readCommunityKey() {
          try {
            const url = new URL(String(location.href));
            const q = String(url.searchParams.get("c") || "").trim();
            if (q) return q;
          } catch {}
          try {
            const s = String(sessionStorage.getItem("csp_last_cid") || "").trim();
            if (s) return s;
          } catch {}
          try {
            const l = String(localStorage.getItem("csp_active_community_v1") || "").trim();
            if (l) return l;
          } catch {}
          return "";
        }

        function escapeHtml(str) {
          return String(str || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function pickInitial(name, houseNo) {
          const source = String(name || "").trim() || String(houseNo || "").trim() || "U";
          return source.slice(0, 1).toUpperCase();
        }

        function normalizeRoleText(role) {
          const value = String(role || "").trim().toLowerCase();
          if (value === "admin" || value === "系統管理員" || value === "系統管理者" || value === "system") return "admin";
          return "resident";
        }

        function normalizeSessionRoleText(role) {
          const value = String(role || "").trim().toLowerCase();
          if (value === "admin" || value === "系統管理員" || value === "系統管理者" || value === "系統") return "admin";
          if (value === "community" || value === "社區") return "community";
          if (value === "resident" || value === "住戶") return "resident";
          return "";
        }

        function resolveViewerIsAdminLike() {
          let sessionRole = "";
          try { sessionRole = normalizeSessionRoleText(sessionStorage.getItem("csp_role") || ""); } catch {}
          if (sessionRole === "admin" || sessionRole === "community") return true;
          const docRole = normalizeSessionRoleText(currentUserData && currentUserData.role);
          if (docRole === "admin" || docRole === "community") return true;
          return false;
        }

        function normalizeUnit(v) {
          return String(v || "").trim();
        }

        function compareUnit(a, b) {
          return String(a || "").localeCompare(String(b || ""), "zh-Hant", { numeric: true, sensitivity: "base" });
        }

        function extractBuilding(unit) {
          const value = normalizeUnit(unit);
          if (!value) return "未設定";
          const matchWithBuilding = value.match(/^(.+?棟)/);
          if (matchWithBuilding && matchWithBuilding[1]) return matchWithBuilding[1];
          const firstPart = value.split(/[-\s]/).filter(Boolean)[0] || "";
          return firstPart || "未設定";
        }

        function normalizeUnitBuilding(v) {
          const value = String(v || "").trim();
          if (!value) return "未設定";
          return value.endsWith("棟") ? value : value;
        }

        function buildUnitMetaMap(units) {
          const map = new Map();
          const raw = Array.isArray(units) ? units : [];
          for (const x of raw) {
            const id = (x && typeof x === "object") ? String(x.id || "").trim() : String(x || "").trim();
            if (!id) continue;
            const key = id.toLowerCase();
            if (map.has(key)) continue;
            const building = (x && typeof x === "object") ? normalizeUnitBuilding(x.building || x.block || "") : "未設定";
            const address = (x && typeof x === "object") ? String(x.address || "").trim() : "";
            map.set(key, {
              building: building || "未設定",
              address,
            });
          }
          return map;
        }

        function setStatus(message) {
          gridEl.innerHTML = `<div class="chatphone-status">${escapeHtml(message)}</div>`;
        }

        function stopResidentMissedCountsSubscription() {
          if (_unsubResidentMissedCounts) {
            try { _unsubResidentMissedCounts(); } catch {}
            _unsubResidentMissedCounts = null;
          }
          _residentMissedCountsCid = "";
          _residentMissedCountsByUid = new Map();
          _residentMissedCountsByUnitKey = new Map();
        }

        function stopHiddenCallIdsSubscription() {
          if (_hiddenCallIdsUnsub) {
            try { _hiddenCallIdsUnsub(); } catch {}
            _hiddenCallIdsUnsub = null;
          }
          _hiddenCallIdsUid = "";
          _hiddenCallIdSet = new Set();
        }

        function ensureHiddenCallIdsSubscription(uid) {
          const id = String(uid || "").trim();
          if (!id) {
            stopHiddenCallIdsSubscription();
            updateResidentMissedBadgesInGrid();
            return;
          }
          if (_hiddenCallIdsUid === id && _hiddenCallIdsUnsub) return;
          stopHiddenCallIdsSubscription();
          _hiddenCallIdsUid = id;
          try {
            _hiddenCallIdsUnsub = db.collection("users").doc(id).onSnapshot((snap) => {
              const data = snap && snap.exists ? (snap.data() || {}) : {};
              const list = Array.isArray(data.hiddenCallIds) ? data.hiddenCallIds : [];
              _hiddenCallIdSet = new Set(list.map((x) => String(x || "").trim()).filter(Boolean));
              updateResidentMissedBadgesInGrid();
            }, () => {});
          } catch {
            stopHiddenCallIdsSubscription();
          }
        }

        function formatBadgeNumber(n) {
          const num = Number.isFinite(Number(n)) ? Number(n) : 0;
          if (num > 99) return "99+";
          return String(num);
        }

        function buildUnitKey(houseNo, subUnit) {
          const h = normalizeUnit(houseNo).toLowerCase();
          const s = normalizeUnit(subUnit).toLowerCase();
          if (!h) return "";
          return `${h}__${s || "_"}`;
        }

        function updateResidentMissedBadgesInGrid() {
          if (!gridEl) return;
          Array.from(gridEl.querySelectorAll(".account-card")).forEach((card) => {
            const uid = String(card.getAttribute("data-uid") || "").trim();
            const houseNo = String(card.getAttribute("data-house") || "").trim();
            const subUnit = String(card.getAttribute("data-sub") || "").trim();
            const unitKey = buildUnitKey(houseNo, subUnit);
            let n = Number(_residentMissedCountsByUid.get(uid) || 0);
            if (!uid && n === 0) n = Number((unitKey ? _residentMissedCountsByUnitKey.get(unitKey) : 0) || 0);
            const badge = card.querySelector('[data-missed-badge="1"]');
            if (!badge) return;
            badge.textContent = formatBadgeNumber(n);
            badge.hidden = n === 0;
          });
        }

        function ensureResidentMissedCountsSubscription(cid) {
          const communityId = String(cid || "").trim();
          if (!communityId) {
            stopResidentMissedCountsSubscription();
            updateResidentMissedBadgesInGrid();
            return;
          }
          if (_residentMissedCountsCid === communityId && _unsubResidentMissedCounts) {
            updateResidentMissedBadgesInGrid();
            return;
          }
          stopResidentMissedCountsSubscription();
          _residentMissedCountsCid = communityId;
          try {
            const baseQuery = viewerIsAdminLike
              ? db.collection("calls").where("community", "==", communityId).limit(150)
              : db.collection("calls").where("community", "==", communityId).where("toRole", "==", "admin").where("status", "==", "missed");

            _unsubResidentMissedCounts = baseQuery.onSnapshot((snap) => {
              const next = new Map();
              const nextUnit = new Map();
              try {
                snap.forEach((doc) => {
                  const callId = String(doc && doc.id ? doc.id : "").trim();
                  if (callId && _hiddenCallIdSet && _hiddenCallIdSet.has(callId)) return;
                  const d = doc && doc.data ? (doc.data() || {}) : {};
                  const st = String(d.status || "").trim();
                  if (st !== "missed") return;

                  const fromUid = String(d.fromUid || "").trim();
                  const toUid = String(d.toUid || "").trim();
                  const fromRoleRaw = String(d.fromRole || "").trim().toLowerCase();
                  const toRoleRaw = String(d.toRole || "").trim().toLowerCase();
                  const normCallRole = (raw) => {
                    const v = String(raw || "").trim().toLowerCase();
                    if (v === "resident" || v === "住戶") return "resident";
                    if (v === "admin" || v === "系統管理員" || v === "系統管理者" || v === "system" || v === "community" || v === "社區") return "admin";
                    return "";
                  };
                  const fromRole = normCallRole(fromRoleRaw);
                  const toRole = normCallRole(toRoleRaw);

                  if (toRole !== "admin") return;
                  if (fromRole !== "resident") return;
                  if (!fromUid) return;
                  next.set(fromUid, (Number(next.get(fromUid) || 0) + 1));

                  const fromUnitKey = buildUnitKey(d.fromHouseNo, d.fromSubHouseNo || d.fromSubUnit || d.subUnit);
                  if (fromUnitKey) nextUnit.set(fromUnitKey, (Number(nextUnit.get(fromUnitKey) || 0) + 1));
                });
              } catch {}
              _residentMissedCountsByUid = next;
              _residentMissedCountsByUnitKey = nextUnit;
              updateResidentMissedBadgesInGrid();
            }, () => {});
          } catch {
            stopResidentMissedCountsSubscription();
          }
        }

        function createIntercomPeerConnection() {
          return new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
        }

        function attachRemoteAudio(remoteStream) {
          const audio = document.getElementById("chatCallRemoteAudio");
          if (!audio) return;
          audio.muted = false;
          audio.volume = 1;
          audio.srcObject = remoteStream || null;
          const p = audio.play();
          if (p && typeof p.catch === "function") p.catch(() => {});
        }

        let chatCallRingAudio = null;
        function startChatCallRingtone(mode = "waiting") {
          stopChatCallRingtone();
          try {
            chatCallRingAudio = new Audio("./mp3/ring.mp3");
            chatCallRingAudio.loop = true;
            chatCallRingAudio.preload = "auto";
            chatCallRingAudio.volume = String(mode || "").trim() === "incoming" ? 0.85 : 0.65;
            const p = chatCallRingAudio.play();
            if (p && typeof p.catch === "function") p.catch(() => {});
          } catch {}
        }

        function stopChatCallRingtone() {
          try {
            if (chatCallRingAudio) {
              chatCallRingAudio.pause();
              chatCallRingAudio.currentTime = 0;
            }
          } catch {}
          chatCallRingAudio = null;
        }

        function setCallStatus(message, isError) {
          if (!callStatusEl) return;
          callStatusEl.textContent = String(message || "").trim() || "—";
          callStatusEl.classList.toggle("error", Boolean(isError));
        }

        function setCallHelp(message, isError) {
          if (!callHelpEl) return;
          const text = String(message || "").trim();
          callHelpEl.textContent = text;
          callHelpEl.hidden = !text;
          callHelpEl.classList.toggle("error", Boolean(isError));
        }

        function setCallPeer(target) {
          const name = String(target && target.displayName || "").trim() || "聯絡人";
          const house = normalizeUnit(target && target.houseNo);
          const sub = normalizeUnit(target && target.subUnit);
          const avatar = String(target && target.avatarDataUrl || "").trim();
          if (callNameEl) callNameEl.textContent = name;
          if (callSubEl) callSubEl.textContent = [house, sub].filter(Boolean).join("｜") || "語音通話";
          if (callAvatarTextEl) callAvatarTextEl.textContent = pickInitial(name, house);
          if (callAvatarImgEl) {
            if (avatar) {
              callAvatarImgEl.src = avatar;

        function dedupeAccounts(list) {
          const raw = Array.isArray(list) ? list : [];
          const map = new Map();
          for (const item of raw) {
            if (!item || typeof item !== "object") continue;
            const houseNo = normalizeUnit(item.houseNo);
            const subUnit = normalizeUnit(item.subUnit);
            const key = houseNo
              ? `${houseNo.toLowerCase()}__${subUnit.toLowerCase()}`
              : `id__${String(item.id || "").trim().toLowerCase()}`;
            if (!map.has(key)) {
              map.set(key, { ...item });
              continue;
            }
            const prev = map.get(key) || {};
            map.set(key, {
              ...prev,
              ...item,
              avatarDataUrl: String(prev.avatarDataUrl || item.avatarDataUrl || "").trim(),
              address: String(prev.address || item.address || "").trim(),
              displayName: String(prev.displayName || item.displayName || "").trim(),
              building: String(prev.building || item.building || "").trim() || "未設定",
            });
          }
          return Array.from(map.values());
        }

        function removeParentAccountsWhenSubUnitsExist(list) {
          const raw = Array.isArray(list) ? list : [];
          const housesWithSubUnits = new Set(
            raw
              .filter((item) => normalizeUnit(item && item.subUnit))
              .map((item) => normalizeUnit(item && item.houseNo).toLowerCase())
              .filter(Boolean)
          );
          return raw.filter((item) => {
            const houseNo = normalizeUnit(item && item.houseNo).toLowerCase();
            const subUnit = normalizeUnit(item && item.subUnit);
            if (!houseNo) return true;
            if (!housesWithSubUnits.has(houseNo)) return true;
            return Boolean(subUnit);
          });
        }

        async function resolveCommunityName(communityKey) {
          const key = String(communityKey || "").trim();
          if (!key) return "社區名稱";
          try {
            const direct = await db.collection("communities").doc(key).get();
            if (direct && direct.exists) {
              const data = direct.data() || {};
              return String(data.name || data.displayName || data.title || data.communityName || key).trim() || key;
            }
          } catch {}

          try {
            const byUsername = await db.collection("communities").where("username", "==", key).limit(1).get();
            if (!byUsername.empty) {
              const data = byUsername.docs[0].data() || {};
              return String(data.name || data.displayName || data.title || data.communityName || key).trim() || key;
            }
          } catch {}

          try {
            const byId = await db.collection("communities").where("id", "==", key).limit(1).get();
            if (!byId.empty) {
              const data = byId.docs[0].data() || {};
              return String(data.name || data.displayName || data.title || data.communityName || key).trim() || key;
            }
          } catch {}

          return key;
        }

        async function resolveCommunityDoc(communityKey) {
          const key = String(communityKey || "").trim();
          if (!key) return null;
          try {
            const direct = await db.collection("communities").doc(key).get();
            if (direct && direct.exists) return { id: direct.id, data: direct.data() || {} };
          } catch {}

          try {
            const byUsername = await db.collection("communities").where("username", "==", key).limit(1).get();
            if (byUsername && !byUsername.empty) return { id: byUsername.docs[0].id, data: byUsername.docs[0].data() || {} };
          } catch {}

          try {
            const byId = await db.collection("communities").where("id", "==", key).limit(1).get();
            if (byId && !byId.empty) return { id: byId.docs[0].id, data: byId.docs[0].data() || {} };
          } catch {}

          return null;
        }

        async function loadAccounts(user) {
          let communityKey = readCommunityKey();
          currentUserData = null;

          try {
            const userSnap = await db.collection("users").doc(String(user.uid)).get();
            currentUserData = userSnap && userSnap.exists ? (userSnap.data() || {}) : {};
          } catch {
            currentUserData = {};
          }

          if (!communityKey) {
            communityKey = String((currentUserData && currentUserData.community) || "").trim();
          }
          if (!communityKey) {
            setStatus("找不到社區資料");
            return;
          }
          currentCommunityKey = communityKey;
          viewerIsAdminLike = resolveViewerIsAdminLike();

          try { sessionStorage.setItem("csp_last_cid", communityKey); } catch {}
          try { localStorage.setItem("csp_active_community_v1", communityKey); } catch {}

          const communityDoc = await resolveCommunityDoc(communityKey);
          const communityData = communityDoc ? (communityDoc.data || {}) : {};
          const nameText = String(communityData.name || communityData.displayName || communityData.title || communityData.communityName || (await resolveCommunityName(communityKey))).trim() || "社區名稱";
          communityNameEl.textContent = "聯絡人";

          const unitMetaMap = buildUnitMetaMap(communityData.units);
          buildingOptions = Array.from(new Set(Array.from(unitMetaMap.values()).map((item) => item && item.building).filter(Boolean)));

          const candidateKeys = Array.from(new Set([
            communityKey,
            communityDoc ? String(communityDoc.id || "").trim() : "",
            String(communityData.username || "").trim(),
            String(communityData.id || "").trim(),
          ].filter(Boolean)));

          const seenUsers = new Set();
          const docs = [];
          for (const key of candidateKeys) {
            try {
              const s = await db.collection("users").where("community", "==", key).get();
              const arr = (s && s.docs) ? s.docs : [];
              for (const d of arr) {
                if (!d || !d.id || seenUsers.has(d.id)) continue;
                seenUsers.add(d.id);
                docs.push(d);
              }
              if (docs.length) break;
            } catch (err) {
              console.error(err);
            }
          }
          if (!docs.length) {
            setStatus("目前沒有帳號資料");
            allAccounts = [];
            activeBuilding = "all";
            renderFilters();
            return;
          }

          allAccounts = removeParentAccountsWhenSubUnitsExist(
            dedupeAccounts(
              docs
                .map((doc) => {
                  const data = doc.data() || {};
                  const role = normalizeSessionRoleText(data.role);
                  if (role !== "resident") return null;
                  if (String(doc.id || "").trim() === String(user.uid || "").trim()) return null;
                  const houseNo = normalizeUnit(data.houseNo || data.unit);
                  const subUnit = normalizeUnit(data.subUnit || data.subHouseNo);
                  const unitMeta = unitMetaMap.get(String(houseNo || "").toLowerCase()) || null;
                  const building = (unitMeta && unitMeta.building) || extractBuilding(houseNo);
                  return {
                    id: doc.id,
                    displayName: String(data.displayName || data.name || "").trim(),
                    avatarDataUrl: String(data.avatarDataUrl || "").trim(),
                    houseNo,
                    subUnit,
                    address: String((unitMeta && unitMeta.address) || data.address || "").trim(),
                    building: building || "未設定",
                  };
                })
                .filter(Boolean)
            )
          ).sort((a, b) => compareUnit(a.houseNo, b.houseNo) || compareUnit(a.subUnit, b.subUnit) || compareUnit(a.displayName, b.displayName));

          if (!allAccounts.length) {
            setStatus("目前沒有住戶帳號資料");
            renderFilters();
            return;
          }

          buildingOptions = Array.from(new Set([
            ...buildingOptions,
            ...allAccounts.map((item) => item.building),
          ].filter(Boolean))).sort((a, b) => {
            if (a === "未設定" && b !== "未設定") return 1;
            if (b === "未設定" && a !== "未設定") return -1;
            return String(a || "").localeCompare(String(b || ""), "zh-Hant", { numeric: true, sensitivity: "base" });
          });

          activeBuilding = "all";
          renderFilters();
          renderGrid();
          ensureResidentMissedCountsSubscription(currentCommunityKey);
        }

            // #endregion
          } catch (err) {
            // #region debug-point C:calldoc-set-error
            fetch("http://127.0.0.1:7777/event",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:"section-call-no-ring",runId:"pre-fix",hypothesisId:"C",location:"chatphone.html:startOutgoingResidentCall:set-error",msg:"[DEBUG] call doc set error",data:{message:String((err&&err.message)||err||""),targetUid:uid},ts:Date.now()})}).catch(()=>{});
            // #endregion
            console.error(err);
            setCallStatus("呼叫失敗：可能沒有權限或網路異常。", true);
            setCallHelp("請檢查 Firestore 權限、通知/麥克風權限，或稍後再試。", true);
            await releaseChatCallResources({ keepModalOpen: true });
            return;
          }
          if (chatCallState) chatCallState.canUpdateStatus = true;

          const unsubDoc = callDocRef.onSnapshot(async (snap) => {
            const data = snap && snap.exists ? (snap.data() || {}) : null;
            if (!data) return;
            const st = String(data.status || "").trim();
            if (st === "accepted") {
              stopChatCallRingtone();
              if (!pc.currentRemoteDescription && data.answer && data.answer.type && data.answer.sdp) {
                try { await pc.setRemoteDescription(new RTCSessionDescription(data.answer)); } catch {}
              }
              setCallStatus("已接通", false);
              setCallHelp("", false);
              if (chatCallState && !chatCallState.timerId) chatCallState.timerId = startCallTimer();
              return;
            }
            if (st === "rejected" || st === "ended" || st === "busy" || st === "missed") {
              setCallStatus(st === "busy" ? "對方忙線中" : (st === "rejected" ? "對方已掛斷" : "通話已結束"), false);
              await cleanupChatCall({ closeDelayMs: 1000 });
            }
          });

          const unsubAnswerCandidates = callDocRef.collection("answerCandidates").onSnapshot((snap) => {
            (snap.docChanges ? snap.docChanges() : []).forEach((ch) => {
              if (!ch || ch.type !== "added") return;
              const v = ch.doc && ch.doc.data ? (ch.doc.data() || {}) : {};
              if (!v || !v.candidate) return;
              try { pc.addIceCandidate(new RTCIceCandidate(v)); } catch {}
            });
          });

          if (chatCallState) {
            chatCallState.unsubDoc = unsubDoc;
            chatCallState.unsubCandidates = unsubAnswerCandidates;
          }
        }

        if (callHangupBtn) {
          callHangupBtn.onclick = () => {
            setCallStatus("通話已結束", false);
            cleanupChatCall({ updateStatus: "ended", closeDelayMs: 1000 }).catch(() => {
              if (callModalEl) callModalEl.hidden = true;
            });
          };
        }

        if (callCloseBtn) {
          callCloseBtn.onclick = () => {
            if (callHangupBtn && typeof callHangupBtn.onclick === "function") {
              callHangupBtn.onclick();
              return;
            }
            if (callModalEl) callModalEl.hidden = true;
          };
        }

        let __nwDialLastMs = 0;
        function triggerDialByUid(uid) {
          const id = String(uid || "").trim();
          // #region debug-point A:trigger-dial-entry
          fetch("http://127.0.0.1:7777/event",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:"section-call-no-ring",runId:"pre-fix",hypothesisId:"A",location:"chatphone.html:triggerDialByUid:entry",msg:"[DEBUG] triggerDialByUid entry",data:{uid:id},ts:Date.now()})}).catch(()=>{});
          // #endregion
          if (!id) return;
          const now = Date.now();
          if (now - __nwDialLastMs < 650) {
            // #region debug-point D:trigger-dial-deduped
            fetch("http://127.0.0.1:7777/event",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:"section-call-no-ring",runId:"pre-fix",hypothesisId:"D",location:"chatphone.html:triggerDialByUid:dedupe",msg:"[DEBUG] triggerDialByUid deduped",data:{uid:id,delta:now-__nwDialLastMs},ts:Date.now()})}).catch(()=>{});
            // #endregion
            return;
          }
          __nwDialLastMs = now;
          startOutgoingResidentCall(id).catch((err) => {
            console.error(err);
            setCallStatus("呼叫失敗，請稍後再試。", true);
          });
        }

        function openHistoryModal(uid, unitLabel) {
          const id = String(uid || "").trim();
          if (!id || !historyModalEl || !historyIframeEl) return;
          if (historyTitleEl) {
            const u = String(unitLabel || "").trim();
            historyTitleEl.textContent = u ? `與 ${u} 的通話紀錄` : "通話紀錄";
          }
          const q = new URLSearchParams();
          if (currentCommunityKey) q.set("c", String(currentCommunityKey));
          q.set("peer", id);
          if (viewerIsAdminLike) q.set("toRole", "admin");
          const url = q.toString() ? `./callrecord.html?${q.toString()}` : "./callrecord.html";
          historyIframeEl.src = url;
          historyModalEl.hidden = false;
        }

        function closeHistoryModal() {
          if (historyModalEl) historyModalEl.hidden = true;
          if (historyIframeEl) historyIframeEl.src = "";
          if (historyTitleEl) historyTitleEl.textContent = "通話紀錄";
        }

        if (historyCloseBtn) historyCloseBtn.onclick = closeHistoryModal;
        if (historyBackdropEl) historyBackdropEl.onclick = closeHistoryModal;

        function getEventTargetElement(ev) {
          const target = ev && ev.target ? ev.target : null;
          if (!target) return null;
          if (target.nodeType === 1) return target;
          return target.parentElement || null;
        }

        // 監聽來自 callrecord.html 的回撥請求
        window.addEventListener("message", (ev) => {
          const data = ev.data;
          if (!data || typeof data !== "object") return;
          if (data.type === "nw:callrecord:callback" && data.uid) {
            const uid = String(data.uid || "").trim();
            if (!uid) return;
            // 關閉歷史記錄彈窗
            closeHistoryModal();
            // 延遲一小段時間再開始撥號
            setTimeout(() => {
              triggerDialByUid(uid);
            }, 150);
          }
        });

        auth.onAuthStateChanged((user) => {
          if (!user) {
            setStatus("請先登入");
            return;
          }
          ensureHiddenCallIdsSubscription(user.uid);
          setStatus("載入中...");
          loadAccounts(user).catch((err) => {
            console.error(err);
            setStatus("頁面載入失敗");
          });
        });
      })();
    </script>
  </body>
</html>
