<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>區大直播｜社區系統</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=4" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />
    <link rel="stylesheet" href="css/parcel.css?v=3" />
    <link rel="stylesheet" href="css/ads-footer.css?v=16" />
    <link rel="stylesheet" href="css/pwa.css" />
    <style>
      #residentLiveStreamWrap,
      #residentLiveStreamWrap * { box-sizing: border-box !important; flex-shrink: 0 !important; }
      #residentLiveStreamWrap {
        display: block !important;
        visibility: visible !important;
        overflow: visible !important;
        min-height: 200px !important;
        margin: 0 0 16px 0 !important;
        padding: 0 !important;
      }
      #residentLiveStreamWrap .resident-live-card-main,
      #residentLiveStreamWrap .resident-live-embed {
        display: block !important;
        visibility: visible !important;
        overflow: visible !important;
      }
    </style>
  </head>
  <body>
    <div class="parcel-layout">
      <header class="parcel-hd">
        <div class="parcel-hd-content">
          <div class="parcel-title" id="communityLiveTitle">&lt;戶號&gt; &lt;姓名&gt;</div>
        </div>
      </header>

      <div class="parcel-midtop">
        <div class="parcel-tabs">
          <button class="tab-btn active" type="button" data-tab="live">直播</button>
          <button class="tab-btn" type="button" data-tab="history">歷史影片</button>
        </div>
      </div>

      <main class="parcel-bd">
        <div class="parcel-list" id="residentLiveStreamWrap" style="display:block;">
          <div class="resident-live-card-main" data-live-card="0" data-resident-live-card="1" style="display:block !important;visibility:visible !important;overflow:hidden !important;cursor:default;position:relative;border-radius:20px;border:1px solid rgba(17,24,39,0.08);background:#fff;padding:0;">
            <div data-resident-cover="empty" style="aspect-ratio:16/9;background:linear-gradient(135deg,#f3f4f6,#e5e7eb);display:flex;align-items:center;justify-content:center;color:#6b7280;">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="width:56px;height:56px;">
                <path d="M22 8.5v7a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="m10 9 5 3-5 3V9Z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="parcel-list" id="liveList">
          <div class="status" style="display:none;">載入中...</div>
        </div>

        <div class="parcel-list hidden" id="historyList" style="display:flex;flex-direction:column;gap:16px;"></div>
      </main>

      <footer class="parcel-ft"></footer>
    </div>

    <div class="modal" id="profileModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
        <div class="modal-hd">
          <h3 class="modal-title" id="profileModalTitle">個人資訊</h3>
          <button class="modal-close" type="button" id="btnCloseProfileModal" aria-label="關閉">×</button>
        </div>
        <div class="modal-body">
          <div class="profile-row" id="profileCommunityItem" hidden>
            <div class="profile-value community" id="profileCommunityText">—</div>
            <div class="profile-value" id="profileRole">—</div>
          </div>
          <div class="profile-item">
            <div class="profile-avatar">
              <img id="profileAvatarImg" alt="" />
              <span class="user-avatar-fallback" id="profileAvatarFallback" aria-hidden="true">U</span>
              <button type="button" class="avatar-edit-btn" id="btnEditAvatar" aria-label="更換大頭照" title="更換大頭照">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 20h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                  <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
              </button>
              <input type="file" id="profileAvatarFile" accept="image/*" hidden />
            </div>
          </div>
          <div class="profile-item">
            <div class="profile-label">姓名</div>
            <div class="profile-value" id="profileNameText">—</div>
          </div>
          <div class="profile-item" id="profileHouseNoItem">
            <div class="profile-label">戶號</div>
            <div class="profile-value" id="profileHouseNoText">—</div>
          </div>
          <div class="status" id="profileStatus" hidden></div>
        </div>
        <div class="modal-ft">
          <div class="profile-switch" id="profileSwitch" hidden></div>
          <button class="btn" type="button" id="btnCloseProfileModalFt">關閉</button>
          <button class="btn btn-primary" type="button" id="btnSignOut">登出</button>
        </div>
      </div>
    </div>

    <div class="modal" id="liveModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog booking-modal" role="dialog" aria-modal="true" aria-labelledby="liveModalTitle">
        <div class="booking-hd">
          <div class="booking-header-left">
            <span class="booking-community-name" id="liveCommunityName">社區名稱</span>
            <span class="booking-facility-name" id="liveRoomName">直播室名稱</span>
          </div>
          <button class="modal-close" type="button" id="btnCloseLiveModal" aria-label="關閉">×</button>
        </div>
        <div class="booking-date">
          <span id="liveCurrentDate">2024年1月1日 星期一</span>
          <button class="booking-date-btn" type="button" id="btnSelectDate" aria-label="選擇日期">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="width: 20px; height: 20px;">
              <path d="M7 3v2M17 3v2M4 7h16M7 11h.01M11 11h.01M15 11h.01M7 15h.01M11 15h.01M15 15h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.7"/>
            </svg>
          </button>
        </div>
        <div class="booking-times">
          <div id="liveTimesContainer"></div>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/live-meeting.js?v=24"></script>
    <script src="js/ads-footer.js?v=16"></script>
    <script src="js/pwa.js?v=6"></script>
  </body>
</html>
