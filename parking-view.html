<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>車牌辨識｜社區系統</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=4" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />
    <link rel="stylesheet" href="css/parcel.css?v=3" />
    <link rel="stylesheet" href="css/ads-footer.css?v=16" />
    <link rel="stylesheet" href="css/pwa.css" />
    <style>
      .camera-wrap {
        position: relative;
        width: 100%;
        background: #000;
        border-radius: var(--radius-sm);
        overflow: hidden;
        aspect-ratio: 4 / 3;
        box-shadow: 0 10px 28px rgba(17, 24, 39, 0.18);
      }
      .camera-wrap video,
      .camera-wrap canvas,
      .camera-wrap img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      .camera-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: rgba(255, 255, 255, 0.75);
        gap: 10px;
        text-align: center;
        padding: 20px;
      }
      .camera-placeholder svg {
        width: 56px;
        height: 56px;
        stroke: rgba(255, 255, 255, 0.7);
        stroke-width: 1.6;
        fill: none;
      }
      .scan-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .scan-box {
        width: 70%;
        max-width: 340px;
        aspect-ratio: 2 / 1;
        border: 2px solid rgba(255, 255, 255, 0.85);
        border-radius: 10px;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
        position: relative;
      }
      .scan-box::before,
      .scan-box::after {
        content: "";
        position: absolute;
        width: 22px;
        height: 22px;
        border-color: #d32f2f;
        border-style: solid;
      }
      .scan-box::before {
        top: -2px;
        left: -2px;
        border-width: 3px 0 0 3px;
        border-radius: 8px 0 0 0;
      }
      .scan-box::after {
        bottom: -2px;
        right: -2px;
        border-width: 0 3px 3px 0;
        border-radius: 0 0 8px 0;
      }
      .scan-line {
        position: absolute;
        left: 6%;
        right: 6%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(211, 47, 47, 0.95), transparent);
        box-shadow: 0 0 12px rgba(211, 47, 47, 0.7);
        animation: scanMove 2.2s ease-in-out infinite;
      }
      @keyframes scanMove {
        0%, 100% { top: 12%; }
        50% { top: 86%; }
      }
      .action-row {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .cam-btn {
        min-height: 48px;
        padding: 0 20px;
        border-radius: 999px;
        border: 0;
        outline: 0;
        font-weight: 900;
        font-size: 14px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease, opacity 120ms ease;
        flex: 0 0 auto;
      }
      .cam-btn svg {
        width: 20px;
        height: 20px;
        stroke-width: 2;
        fill: none;
      }
      .cam-btn-primary {
        background: linear-gradient(180deg, #e53935, #c62828);
        color: #fff;
        box-shadow: 0 10px 24px rgba(211, 47, 47, 0.32);
      }
      .cam-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(211, 47, 47, 0.4); }
      .cam-btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: 0 4px 10px rgba(17, 24, 39, 0.12); }
      .cam-btn-secondary {
        background: #fff;
        color: var(--text);
        border: 1px solid var(--border);
        box-shadow: 0 6px 16px rgba(17, 24, 39, 0.08);
      }
      .cam-btn-secondary:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(17, 24, 39, 0.12); }
      .cam-btn-secondary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
      .cam-btn-ghost {
        background: rgba(17, 24, 39, 0.06);
        color: var(--text);
        border: 1px solid transparent;
      }
      .cam-btn-ghost:hover { background: rgba(17, 24, 39, 0.1); }
      .result-card {
        background: #fff;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        padding: 16px;
        margin-top: 14px;
        box-shadow: 0 10px 26px rgba(17, 24, 39, 0.08);
      }
      .result-card-hd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }
      .result-card-title {
        font-weight: 900;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .plate-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 2px 10px;
        border-radius: 999px;
        font-weight: 900;
        font-size: 12px;
        letter-spacing: 0.3px;
      }
      .plate-badge.car {
        background: rgba(37, 99, 235, 0.1);
        color: #1d4ed8;
        border: 1px solid rgba(37, 99, 235, 0.22);
      }
      .plate-badge.moto {
        background: rgba(245, 158, 11, 0.1);
        color: #b45309;
        border: 1px solid rgba(245, 158, 11, 0.22);
      }
      .plate-display {
        background: linear-gradient(180deg, #ffffff, #f3f4f6);
        border: 2px solid rgba(17, 24, 39, 0.12);
        border-radius: 10px;
        padding: 14px 18px;
        text-align: center;
        font-family: "Consolas", "SF Mono", ui-monospace, monospace;
        font-weight: 900;
        font-size: 28px;
        letter-spacing: 4px;
        color: #111827;
        margin-bottom: 10px;
        word-break: break-all;
      }
      .plate-input-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: stretch;
        margin-bottom: 10px;
      }
      .plate-input-row input {
        width: 100%;
        height: 48px;
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 0 14px;
        font-family: "Consolas", "SF Mono", ui-monospace, monospace;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: 3px;
        text-align: center;
        outline: 0;
        transition: border-color 120ms ease, box-shadow 120ms ease;
        text-transform: uppercase;
      }
      .plate-input-row input:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.16);
      }
      .confidence-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 13px;
        color: var(--muted);
      }
      .confidence-bar {
        flex: 1 1 auto;
        height: 8px;
        background: rgba(17, 24, 39, 0.08);
        border-radius: 999px;
        overflow: hidden;
        min-width: 100px;
      }
      .confidence-fill {
        height: 100%;
        background: linear-gradient(90deg, #f59e0b, #22c55e);
        border-radius: 999px;
        transition: width 200ms ease;
      }
      .type-switch {
        display: inline-flex;
        background: var(--panel-2);
        border-radius: 999px;
        padding: 4px;
        border: 1px solid var(--border);
      }
      .type-switch button {
        border: 0;
        background: transparent;
        height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        font-weight: 800;
        font-size: 13px;
        color: var(--muted);
        cursor: pointer;
        transition: background 120ms ease, color 120ms ease, box-shadow 120ms ease;
      }
      .type-switch button.active {
        background: var(--brand);
        color: #fff;
        box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
      }
      .ocr-progress {
        margin-top: 10px;
        font-size: 13px;
        color: var(--muted);
        text-align: center;
        min-height: 20px;
      }
      .ocr-progress.active {
        color: var(--brand);
        font-weight: 800;
      }
      .history-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 18px 0 10px;
      }
      .history-title > div {
        font-weight: 900;
        font-size: 15px;
      }
      .history-clear {
        background: none;
        border: 0;
        color: var(--muted);
        font-weight: 800;
        font-size: 13px;
        cursor: pointer;
        padding: 4px 10px;
        border-radius: 999px;
      }
      .history-clear:hover {
        background: rgba(211, 47, 47, 0.08);
        color: var(--brand);
      }
      .history-item {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 12px 14px;
        background: #fff;
        border-radius: 12px;
        border: 1px solid var(--border);
        margin-bottom: 8px;
      }
      .history-thumb {
        width: 56px;
        height: 56px;
        border-radius: 10px;
        overflow: hidden;
        background: #e5e7eb;
        flex: 0 0 auto;
      }
      .history-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .history-plate {
        font-family: "Consolas", "SF Mono", ui-monospace, monospace;
        font-weight: 900;
        font-size: 18px;
        letter-spacing: 2px;
      }
      .history-meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .empty-state {
        text-align: center;
        padding: 28px 16px;
        color: var(--muted);
        font-size: 14px;
      }
      .hidden { display: none !important; }
      .pv-section-label {
        font-weight: 900;
        font-size: 14px;
        margin: 14px 0 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pv-section-label::before {
        content: "";
        width: 4px;
        height: 16px;
        background: var(--brand);
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="parcel-layout" id="pvLayout">
      <header class="parcel-hd" id="pvHeader">
        <div class="parcel-hd-content">
          <div class="parcel-title" id="pvTitle">車牌辨識</div>
        </div>
      </header>

      <div class="parcel-midtop">
        <div class="parcel-tabs" id="pvTabs">
          <button class="tab-btn active" type="button" data-tab="camera">即時辨識</button>
          <button class="tab-btn" type="button" data-tab="history">辨識紀錄</button>
        </div>
      </div>

      <main class="parcel-bd">
        <div class="parcel-list" id="cameraPanel">
          <div class="pv-section-label">攝影機</div>
          <div class="camera-wrap" id="cameraWrap">
            <video id="cameraVideo" autoplay playsinline muted allow="microphone; camera; autoplay"></video>
            <canvas id="cameraCanvas" class="hidden"></canvas>
            <img id="capturedImg" class="hidden" alt="擷取畫面" />
            <div class="camera-placeholder" id="cameraPlaceholder">
              <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                <circle cx="12" cy="13" r="4" />
              </svg>
              <div id="cameraHint">點擊下方「開啟攝影機」開始辨識</div>
            </div>
            <div class="scan-overlay hidden" id="scanOverlay">
              <div class="scan-box">
                <div class="scan-line"></div>
              </div>
            </div>
          </div>

          <div class="action-row">
            <div class="type-switch" role="group" aria-label="車輛類型">
              <button type="button" id="typeCar" class="active" data-type="car">
                <span aria-hidden="true">🚗</span> 汽車
              </button>
              <button type="button" id="typeMoto" data-type="moto">
                <span aria-hidden="true">🏍️</span> 機車
              </button>
            </div>
          </div>

          <div class="action-row">
            <button class="cam-btn cam-btn-secondary" type="button" id="btnToggleCam">
              <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
              <span id="btnToggleCamLabel">開啟攝影機</span>
            </button>
            <button class="cam-btn cam-btn-ghost" type="button" id="btnSwitchFacing">
              <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
              <span>翻轉鏡頭</span>
            </button>
            <button class="cam-btn cam-btn-primary" type="button" id="btnCapture" disabled>
              <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              <span>擷取辨識</span>
            </button>
            <button class="cam-btn cam-btn-ghost" type="button" id="btnAutoRec" aria-pressed="false">
              <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              <span id="btnAutoRecLabel">自動辨識：關</span>
            </button>
          </div>

          <div class="ocr-progress" id="ocrProgress" role="status" aria-live="polite"></div>

          <div class="result-card hidden" id="resultCard">
            <div class="result-card-hd">
              <div class="result-card-title">
                辨識結果
                <span class="plate-badge" id="resultBadge">汽車</span>
              </div>
              <div class="type-switch" id="resultTypeSwitch">
                <button type="button" class="active" data-rtype="car">汽車</button>
                <button type="button" data-rtype="moto">機車</button>
              </div>
            </div>
            <div class="plate-display" id="plateDisplay">—</div>
            <div id="plateSubLabel" style="margin:0 0 8px 0;font-size:12px;color:#6b7280;font-weight:700;text-align:center;display:none;"></div>
            <div class="plate-input-row">
              <input id="plateInput" type="text" maxlength="12" autocomplete="off" placeholder="手動輸入或修正車牌" aria-label="車牌號碼" />
              <button class="cam-btn cam-btn-primary" type="button" id="btnSaveRecord" style="border-radius:10px;">
                儲存
              </button>
            </div>
            <div class="confidence-row">
              <span>辨識信心度</span>
              <div class="confidence-bar" aria-hidden="true">
                <div class="confidence-fill" id="confidenceFill" style="width:0%"></div>
              </div>
              <span id="confidenceText">— %</span>
            </div>
          </div>

          <div class="pv-section-label">手動登錄</div>
          <div class="parcel-item" style="display:block;">
            <div style="display:grid; grid-template-columns:1fr; gap:10px;">
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <select id="manualType" aria-label="車輛類型">
                  <option value="car">汽車</option>
                  <option value="moto">機車</option>
                </select>
                <input id="manualPlate" type="text" maxlength="12" autocomplete="off" placeholder="車牌號碼（例如：ABC-1234）" style="height:44px; border-radius:10px; border:1px solid var(--border); padding:0 12px; outline:0; text-transform:uppercase; font-family:Consolas,monospace; font-weight:800; letter-spacing:2px;" />
              </div>
              <div style="display:flex; justify-content:flex-end;">
                <button class="cam-btn cam-btn-secondary" type="button" id="btnManualSave">
                  <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><polyline points="20 6 9 17 4 12"/></svg>
                  <span>手動新增紀錄</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="parcel-list hidden" id="historyPanel">
          <div class="history-title">
            <div>辨識紀錄</div>
            <button class="history-clear" type="button" id="btnClearHistory">清空紀錄</button>
          </div>
          <div id="historyList"></div>
        </div>
      </main>

      <footer class="parcel-ft"></footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/parking-view.js?v=11"></script>
    <script src="js/ads-footer.js?v=16"></script>
    <script src="js/pwa.js?v=6"></script>
  </body>
</html>
