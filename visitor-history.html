<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>歷史訪客</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=4" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />
    <link rel="stylesheet" href="./css/index.css?v=3" />
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script defer src="./js/firebase-config.js"></script>
    <script defer src="./js/visitor-history.js?v=1"></script>
    <style>
      [hidden] { display: none !important; }
      body { background: var(--bg); }
      .vh-wrap {
        height: 100dvh;
        width: 100%;
        display: grid;
        grid-template-rows: auto auto 1fr;
        overflow: hidden;
      }
      .vh-hd {
        padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
        display: grid;
        gap: 6px;
        align-content: center;
        border-bottom: 1px solid rgba(17, 24, 39, 0.08);
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
      }
      .vh-brand { display: flex; align-items: center; gap: 10px; font-weight: 900; }
      .vh-brand img { width: 28px; height: 28px; display: block; }
      .vh-title { font-size: 14px; font-weight: 900; color: rgba(31, 41, 55, 0.92); }
      .vh-sub { font-size: 13px; color: var(--muted); word-break: break-all; }
      .vh-monthbar {
        display: grid;
        grid-template-columns: 44px 1fr 44px;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        background: rgba(255, 255, 255, 0.92);
        border-bottom: 1px solid rgba(17, 24, 39, 0.08);
      }
      .vh-monthbar button {
        height: 40px;
        border-radius: 14px;
        border: 1px solid rgba(17, 24, 39, 0.12);
        background: #fff;
        color: var(--text);
        font-size: 20px;
        font-weight: 900;
        line-height: 1;
        display: grid;
        place-items: center;
        cursor: pointer;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .vh-monthbar button:disabled { opacity: 0.35; cursor: default; }
      .vh-monthbar select {
        height: 40px;
        border-radius: 14px;
        border: 1px solid rgba(17, 24, 39, 0.12);
        background: #fff;
        padding: 0 12px;
        font-weight: 900;
        width: 100%;
        text-align: center;
        text-align-last: center;
      }
      .vh-main {
        min-height: 0;
        overflow-y: auto;
        padding: 12px 12px calc(16px + env(safe-area-inset-bottom));
        display: grid;
        gap: 10px;
        align-content: start;
      }
      .vh-item {
        background: #fff;
        border: 1px solid rgba(17, 24, 39, 0.10);
        border-radius: 18px;
        padding: 14px 16px;
        box-shadow: 0 6px 18px rgba(17, 24, 39, 0.06);
        display: grid;
        gap: 10px;
      }
      .vh-item-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .vh-name { font-size: 16px; font-weight: 900; color: var(--text); word-break: break-all; }
      .vh-badge {
        flex: 0 0 auto;
        font-size: 12px;
        font-weight: 900;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(211, 47, 47, 0.10);
        color: #b91c1c;
        border: 1px solid rgba(211, 47, 47, 0.22);
        white-space: nowrap;
      }
      .vh-meta { display: grid; gap: 6px; }
      .vh-meta-row { display: grid; grid-template-columns: 62px 1fr; gap: 8px; font-size: 13px; line-height: 1.5; }
      .vh-k { color: var(--muted); font-weight: 900; }
      .vh-v { color: var(--text); word-break: break-all; }
      .vh-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 32px 12px; }
      #vhStatus { margin: 0 0 4px; }
    </style>
  </head>
  <body>
    <main class="vh-wrap">
      <header class="vh-hd">
        <div class="vh-brand">
          <img src="./logo.svg?v=4" alt="LOGO" />
          <div class="vh-title">生活網 · 歷史訪客</div>
        </div>
        <div class="vh-sub" id="vhSub">—</div>
      </header>

      <div class="vh-monthbar">
        <button type="button" id="vhPrev" aria-label="上一個月">‹</button>
        <select id="vhMonth" aria-label="選擇月份"></select>
        <button type="button" id="vhNext" aria-label="下一個月">›</button>
      </div>

      <section class="vh-main">
        <div class="status" id="vhStatus" hidden></div>
        <div class="vh-list" id="vhList"></div>
      </section>
    </main>
  </body>
</html>
