<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>訪客登記</title>
    <link rel="stylesheet" href="./css/index.css" />
    <link rel="stylesheet" href="./css/pwa.css" />
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script defer src="./js/firebase-config.js"></script>
    <script defer src="./js/pwa.js?v=5"></script>
    <script defer src="./js/visitor.js?v=6"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
      body { background: var(--bg); }
      [hidden] { display: none !important; }
      .wrap { min-height: 100dvh; padding: 0; grid-template-rows: none; justify-items: stretch; align-items: stretch; }
      .v-page { height: 100dvh; width: 100%; display: grid; grid-template-rows: auto 1fr auto; }
      .v-hd { padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: grid; gap: 6px; align-content: center; border-bottom: 1px solid rgba(17, 24, 39, 0.08); background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); }
      .v-brand { display: flex; align-items: center; gap: 10px; font-weight: 900; }
      .v-brand img { width: 28px; height: 28px; display: block; }
      .v-title { font-size: 14px; font-weight: 900; color: rgba(31, 41, 55, 0.92); }
      .v-main { display: grid; place-items: center; padding: 16px; overflow: auto; }
      .v-card { width: 100%; max-width: 520px; background: var(--panel); border-radius: 24px; border: 1px solid rgba(17, 24, 39, 0.08); box-shadow: 0 14px 36px rgba(17, 24, 39, 0.10); padding: clamp(16px, 4vw, 24px); display: grid; gap: 16px; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
      textarea { min-height: 92px; padding: 12px 16px; border-radius: 16px; border: 2px solid rgba(17, 24, 39, 0.08); background: #fff; outline: none; resize: vertical; font: inherit; }
      textarea:focus { border-color: rgba(211, 47, 47, 0.42); box-shadow: 0 0 0 4px rgba(211, 47, 47, 0.14); }
      .qr-box { display: grid; justify-items: center; gap: 12px; padding: 20px; border-radius: 20px; background: rgba(17, 24, 39, 0.03); border: 1px dashed rgba(17, 24, 39, 0.22); }
      .qr-box img { width: 100%; max-width: 240px; height: auto; aspect-ratio: 1/1; }
      .hint { color: var(--muted); font-size: 13px; line-height: 1.6; text-align: center; word-break: break-all; }
      .pill { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 999px; font-size: 12px; background: rgba(211, 47, 47, 0.10); color: #b91c1c; border: 1px solid rgba(211, 47, 47, 0.22); white-space: nowrap; justify-self: end; }
      .v-ft { padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 12px; align-content: center; border-top: 1px solid rgba(17, 24, 39, 0.08); background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); }
      .v-ft .btn { height: 52px; border-radius: 16px; }
      .btn-success { background: #10b981; color: #fff; border: 1px solid rgba(0,0,0,0.08); }
      .btn-success:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="v-page">
        <header class="v-hd">
          <div class="v-brand">
            <img src="./logo.svg" alt="LOGO" />
            <div>Qai守護星</div>
            <div class="pill" id="authPill" hidden>連線中…</div>
          </div>
          <div class="v-title" id="pageTitle">訪客登記-—</div>
        </header>

        <section class="v-main">
          <div class="v-card">
            <div class="status" id="statusBox" hidden></div>

            <form class="form" id="visitorForm">
          <div class="grid2">
            <div class="field">
              <label for="v_name">訪客姓名</label>
              <input id="v_name" type="text" autocomplete="name" required />
            </div>
            <div class="field">
              <label for="v_party">拜訪人數</label>
              <input id="v_party" type="text" inputmode="numeric" autocomplete="off" value="1" />
            </div>
          </div>

          <div class="grid2">
            <div class="field">
              <label for="v_unit">拜訪戶號</label>
              <input id="v_unit" type="text" autocomplete="off" list="unitList" required />
              <datalist id="unitList"></datalist>
            </div>
            <div class="field">
              <label for="v_phone">手機</label>
              <input id="v_phone" type="text" inputmode="tel" autocomplete="tel" />
            </div>
          </div>

          <div class="grid2">
            <div class="field">
              <label for="v_plate">車牌</label>
              <input id="v_plate" type="text" autocomplete="off" />
            </div>
            <div class="field">
              <label for="v_email">電子郵件</label>
              <input id="v_email" type="email" autocomplete="email" />
            </div>
          </div>

          <div class="field">
            <label for="v_purposeType">到訪事由</label>
            <select id="v_purposeType">
              <option value="親友拜訪">親友拜訪</option>
              <option value="廠商施工">廠商施工</option>
              <option value="外送">外送</option>
              <option value="看房">看房</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div class="field" id="purposeOtherField" hidden>
            <label for="v_purposeOther">其他事由</label>
            <input id="v_purposeOther" type="text" autocomplete="off" />
          </div>

          <div class="field">
            <label for="v_note">備註</label>
            <textarea id="v_note"></textarea>
          </div>
        </form>

            <div id="resultBox" hidden>
              <div class="hint" id="resultMsg">已送出登記，等待授權。</div>
              <div class="qr-box" id="passBox" hidden>
                <img id="passQrImg" alt="QR Code" />
                <div class="hint" id="passHint">請出示此 QR code 作為訪客證。</div>
                <div class="hint" id="passUrl"></div>
                <button class="btn btn-sm btn-success" type="button" id="btnSavePassImage" style="margin-top: 10px; height: 36px; padding: 0 20px; font-size: 13px;">儲存為圖片</button>
              </div>
            </div>
          </div>
        </section>

        <footer class="v-ft">
          <button class="btn btn-primary" type="submit" form="visitorForm" id="btnFooterSubmit">送出登記</button>
          <button class="btn btn-success" type="button" id="btnFooterAuth" hidden>授權</button>
          <button class="btn" type="button" id="btnFooterPass" disabled>訪客證</button>
        </footer>
      </div>
    </main>
  </body>
</html>
