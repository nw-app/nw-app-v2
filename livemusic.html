<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>社區音樂｜QAi生活網</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=5" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />
    <link rel="stylesheet" href="css/pwa.css" />
    <style>
      :root {
        --brand: #d32f2f;
        --ink: #1f2937;
        --muted: #6b7280;
        --bg: #f2f3f5;
        --border: rgba(17, 24, 39, 0.12);
        --radius: 16px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      }
      .ltv-wrap {
        min-height: 100dvh;
        padding: max(14px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom));
      }
      .ltv-hd {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: var(--radius);
        background: #fff;
        box-shadow: 0 10px 26px rgba(17, 24, 39, 0.08);
        margin-bottom: 16px;
      }
      .ltv-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .ltv-brand img { width: 38px; height: 38px; flex: 0 0 auto; }
      .ltv-title { font-size: 18px; font-weight: 900; }
      .ltv-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 14px;
      }
      /* 手機直屏：一行 2 個頻道 */
      @media (max-width: 560px) {
        .ltv-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }
      }
      .ltv-tools {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .ltv-search {
        flex: 1 1 auto;
        min-width: 0;
        height: 44px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--ink);
        font-size: 15px;
      }
      .ltv-fav-toggle {
        flex: 0 0 auto;
        height: 44px;
        padding: 0 16px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--ink);
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      .ltv-fav-toggle svg { display: block; }
      .ltv-fav-toggle[aria-pressed="true"] {
        border-color: var(--brand);
        background: #fdecec;
        color: var(--brand);
      }
      .ltv-fav-toggle[aria-pressed="true"] svg { fill: currentColor; }
      .ltv-tile-fav {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 1;
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: rgba(17, 24, 39, 0.42);
        color: #fff;
        cursor: pointer;
      }
      .ltv-tile-fav svg { display: block; }
      .ltv-tile-fav.is-on { color: #ff4d5e; }
      .ltv-tile-fav.is-on svg { fill: currentColor; }
      .ltv-tile {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: #fff;
        padding: 10px;
        cursor: pointer;
        display: grid;
        gap: 10px;
        text-align: left;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }
      .ltv-tile:hover { transform: translateY(-2px); box-shadow: 0 16px 32px rgba(17, 24, 39, 0.14); }
      .ltv-tile-img {
        position: relative;
        width: 100%;
        aspect-ratio: 3 / 2;
        border-radius: 12px;
        overflow: hidden;
        background: #f3f4f6;
        display: grid;
        place-items: center;
      }
      .ltv-tile-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .ltv-tile-ph { font-size: 13px; color: var(--muted); }
      .ltv-tile-order {
        position: absolute;
        top: 8px;
        left: 8px;
        min-width: 30px;
        height: 30px;
        padding: 0 9px;
        display: inline-grid;
        place-items: center;
        border-radius: 999px;
        background: rgba(211, 47, 47, 0.92);
        color: #fff;
        font-size: 15px;
        font-weight: 900;
      }
      .ltv-tile-name {
        font-weight: 800;
        font-size: 18px;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ltv-empty {
        padding: 40px 18px;
        border-radius: var(--radius);
        border: 1px dashed rgba(17, 24, 39, 0.2);
        background: #fff;
        color: var(--muted);
        text-align: center;
      }
      .ltv-player {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000;
        display: flex;
        flex-direction: column;
      }
      .ltv-player[hidden] { display: none; }
      .ltv-player-frame { position: relative; flex: 1 1 auto; min-height: 0; background: #000; }
      .ltv-player-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      .ltv-player-msg {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 15px;
        padding: 24px;
        text-align: center;
      }
      .ltv-player-close {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        z-index: 2;
        width: 44px;
        height: 44px;
        border-radius: 999px;
        border: 0;
        background: rgba(255, 255, 255, 0.92);
        color: #111827;
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
      }
      .ltv-player-full {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        right: calc(max(12px, env(safe-area-inset-right)) + 52px);
        z-index: 2;
        width: 44px;
        height: 44px;
        padding: 0;
        display: grid;
        place-items: center;
        border-radius: 999px;
        border: 0;
        background: rgba(255, 255, 255, 0.92);
        color: #111827;
        cursor: pointer;
      }
      .ltv-player-full svg {
        display: block;
      }
      .ltv-player-name {
        flex: 0 0 auto;
        padding: max(10px, env(safe-area-inset-bottom)) 16px;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        text-align: center;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="ltv-wrap">
      <header class="ltv-hd">
        <div class="ltv-brand">
          <img src="logo.svg?v=5" alt="" />
          <div>
            <div class="ltv-title">創作音樂</div>
          </div>
        </div>
      </header>
      <div class="ltv-tools">
        <input class="ltv-search" id="ltvSearch" type="search" enterkeyhint="search" autocomplete="off" placeholder="輸入關鍵字或頻道編號" aria-label="搜尋頻道" />
        <button class="ltv-fav-toggle" type="button" id="ltvFavOnly" aria-pressed="false" aria-label="只顯示我的最愛">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21.2l7.8-7.8 1.1-1.1a5.5 5.5 0 0 0-.1-7.7z"/></svg>
          <span>我的最愛</span>
        </button>
      </div>
      <main class="ltv-grid" id="ltvGrid"></main>
      <div class="ltv-empty" id="ltvEmpty" hidden>尚未設定任何頻道。</div>
    </div>

    <div class="ltv-player" id="ltvPlayer" hidden>
      <div class="ltv-player-frame" id="ltvFrame"></div>
      <button class="ltv-player-close" type="button" id="ltvClose" aria-label="關閉">×</button>
      <button class="ltv-player-full" type="button" id="ltvFull" aria-label="全螢幕"></button>
      <div class="ltv-player-name" id="ltvPlayerName"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/pwa.js?v=16"></script>
    <script>
      (function () {
        "use strict";

        const STORE_KEY = "liveMusicChannels";
        const cfg = window.FIREBASE_CONFIG;
        if (!cfg) return;
        try {
          firebase.initializeApp(cfg);
        } catch (e) {}
        const db = firebase.firestore();
        try {
          db.settings({
            experimentalAutoDetectLongPolling: true,
            experimentalForceLongPolling: true,
            useFetchStreams: false,
          });
        } catch (e) {}

        function youtubeVideoId(url) {
          const u = String(url || "").trim();
          if (!u) return "";
          const m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/|live\/))([A-Za-z0-9_-]{6,})/);
          if (m && m[1]) return m[1];
          try {
            const uo = new URL(u);
            if (uo.hostname.indexOf("youtube.com") !== -1 || uo.hostname.indexOf("youtu.be") !== -1) {
              const v = uo.searchParams.get("v");
              if (v) return v;
            }
          } catch (e) {}
          return "";
        }

        function escapeHtml(s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          })[c]);
        }

        // 四個播放頁不分社區／帳號：一律讀取同一份固定頻道設定（與後台「功能」分頁同一份）。
        const GLOBAL_CONFIG_CID = "oOo7WB8YSRo8FGcebLg6";

        // 編號排序：支援「N001」這類含前導字母／補零的編號，取數字部分由小至大
        function orderRank(v) {
          const s = String(v == null ? "" : v).trim();
          if (!s) return Number.POSITIVE_INFINITY;
          const m = s.match(/\d+/);
          if (m) return Number(m[0]);
          const n = parseFloat(s);
          return Number.isFinite(n) ? n : Number.POSITIVE_INFINITY;
        }

        function sortChannels(list) {
          return (Array.isArray(list) ? list.slice() : []).sort((a, b) => {
            const av = orderRank(a.order);
            const bv = orderRank(b.order);
            if (av !== bv) return av - bv;
            return String(a.name || "").localeCompare(String(b.name || ""), "zh-Hant");
          });
        }

        function normalizeChannels(raw) {
          const list = Array.isArray(raw) ? raw : [];
          return sortChannels(
            list
              .map((it) => ({
                id: String(it && it.id ? it.id : ""),
                order: String(it && it.order != null ? it.order : "").trim(),
                name: String(it && it.name != null ? it.name : "").trim(),
                image: String(it && it.image ? it.image : ""),
                youtubeUrl: String(it && it.youtubeUrl ? it.youtubeUrl : "").trim(),
              }))
              .filter((it) => it.order || it.name || it.image || it.youtubeUrl)
          );
        }

        const gridEl = document.getElementById("ltvGrid");
        const emptyEl = document.getElementById("ltvEmpty");
        const searchEl = document.getElementById("ltvSearch");
        const favOnlyEl = document.getElementById("ltvFavOnly");
        const playerEl = document.getElementById("ltvPlayer");
        const frameEl = document.getElementById("ltvFrame");
        const playerNameEl = document.getElementById("ltvPlayerName");
        const cid = GLOBAL_CONFIG_CID;

        // 我的最愛：以 localStorage 記錄頻道 id，依頁面各自獨立
        const FAV_KEY = "nwapp.livemusic.favs";
        const FAV_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21.2l7.8-7.8 1.1-1.1a5.5 5.5 0 0 0-.1-7.7z"/></svg>';

        function loadFavorites() {
          try {
            const arr = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
            return new Set(Array.isArray(arr) ? arr.map(String) : []);
          } catch (e) {
            return new Set();
          }
        }

        let favorites = loadFavorites();

        function isFav(id) { return favorites.has(String(id)); }

        function saveFavorites() {
          try { localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favorites))); } catch (e) {}
        }

        function toggleFav(id) {
          const k = String(id);
          if (favorites.has(k)) favorites.delete(k);
          else favorites.add(k);
          saveFavorites();
        }

        // 依搜尋關鍵字（比對編號或名稱）與「我的最愛」開關篩選
        function visibleChannels() {
          const q = String(searchEl.value || "").trim().toLowerCase();
          let list = channels;
          if (q) {
            list = list.filter((it) =>
              String(it.order || "").toLowerCase().indexOf(q) !== -1 ||
              String(it.name || "").toLowerCase().indexOf(q) !== -1
            );
          }
          if (favOnlyEl.getAttribute("aria-pressed") === "true") {
            list = list.filter((it) => isFav(it.id));
          }
          return list;
        }

        function renderGrid() {
          const list = visibleChannels();
          if (!list.length) {
            gridEl.innerHTML = "";
            emptyEl.textContent = channels.length ? "沒有符合的頻道。" : "尚未設定任何頻道。";
            emptyEl.hidden = false;
            return;
          }
          emptyEl.hidden = true;
          gridEl.innerHTML = list
            .map((it) => {
              const on = isFav(it.id);
              return `
              <button class="ltv-tile" type="button" data-tv-open="${escapeHtml(it.id)}">
                <span class="ltv-tile-img">
                  ${it.order ? `<span class="ltv-tile-order">${escapeHtml(it.order)}</span>` : ""}
                  ${
                    it.image
                      ? `<img src="${escapeHtml(it.image)}" alt="${escapeHtml(it.name)}" />`
                      : '<span class="ltv-tile-ph">無圖片</span>'
                  }
                  <span class="ltv-tile-fav${on ? " is-on" : ""}" role="button" tabindex="0" data-tv-fav="${escapeHtml(it.id)}" aria-pressed="${on ? "true" : "false"}" aria-label="${on ? "移除我的最愛" : "加入我的最愛"}">${FAV_ICON}</span>
                </span>
                <span class="ltv-tile-name">${escapeHtml(it.name || "（未命名頻道）")}</span>
              </button>
            `;
            })
            .join("");
        }

        let channels = [];

        function load() {
          return db
            .collection("communities")
            .doc(cid)
            .collection("settings")
            .doc("app_config")
            .get()
            .then((doc) => {
              const data = doc && doc.exists ? doc.data() || {} : {};
              channels = normalizeChannels(data[STORE_KEY]);
              renderGrid();
            })
            .catch(() => {
              channels = [];
              renderGrid();
            });
        }

        const fullBtn = document.getElementById("ltvFull");
        const ICON_FULLSCREEN = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
        const ICON_EXIT_FULLSCREEN = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';

        // 全螢幕按鍵：點一下可翻轉為全螢幕（並嘗試鎖定橫向）觀賞，再點一下退出
        function syncFullBtn() {
          if (!fullBtn) return;
          const on = !!document.fullscreenElement;
          fullBtn.innerHTML = on ? ICON_EXIT_FULLSCREEN : ICON_FULLSCREEN;
          fullBtn.setAttribute("aria-label", on ? "退出全螢幕" : "全螢幕");
        }

        function lockLandscape() {
          try {
            if (screen.orientation && screen.orientation.lock) {
              const p = screen.orientation.lock("landscape");
              if (p && p.catch) p.catch(() => {});
            }
          } catch (e) {}
        }

        function unlockOrientation() {
          try {
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
          } catch (e) {}
        }

        function toggleFullscreen() {
          if (document.fullscreenElement) {
            unlockOrientation();
            try { document.exitFullscreen(); } catch (e) {}
            return;
          }
          if (!playerEl.requestFullscreen) return;
          try {
            const p = playerEl.requestFullscreen();
            if (p && p.then) p.then(lockLandscape, () => {});
            else lockLandscape();
          } catch (e) {}
        }

        function closePlayer() {
          unlockOrientation();
          if (document.fullscreenElement) {
            try { document.exitFullscreen(); } catch (e) {}
          }
          frameEl.innerHTML = "";
          playerEl.hidden = true;
          playerNameEl.textContent = "";
        }

        function openPlayer(ch) {
          const vid = youtubeVideoId(ch.youtubeUrl);
          frameEl.innerHTML = "";
          if (vid) {
            const iframe = document.createElement("iframe");
            iframe.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture; fullscreen");
            iframe.setAttribute("allowfullscreen", "true");
            iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
            iframe.src = `https://www.youtube.com/embed/${encodeURIComponent(vid)}?rel=0&autoplay=1&playsinline=1&modestbranding=1`;
            frameEl.appendChild(iframe);
          } else {
            const msg = document.createElement("div");
            msg.className = "ltv-player-msg";
            msg.textContent = ch.youtubeUrl ? "此網址無法播放。" : "尚未設定播放網址。";
            frameEl.appendChild(msg);
          }
          playerNameEl.textContent = [ch.order ? `第 ${ch.order} 台` : "", ch.name || ""].filter(Boolean).join("　");
          playerEl.hidden = false;
          if (playerEl.requestFullscreen) {
            try {
              const p = playerEl.requestFullscreen();
              if (p && p.then) p.then(lockLandscape, () => {});
            } catch (e) {}
          }
        }

        gridEl.addEventListener("click", (e) => {
          const target = e.target;
          const favEl = target && target.closest ? target.closest("[data-tv-fav]") : null;
          if (favEl) {
            e.preventDefault();
            e.stopPropagation();
            toggleFav(favEl.getAttribute("data-tv-fav"));
            renderGrid();
            return;
          }
          const btn = target && target.closest ? target.closest("[data-tv-open]") : null;
          if (!btn) return;
          const id = btn.getAttribute("data-tv-open");
          const ch = channels.find((x) => x.id === id);
          if (ch) openPlayer(ch);
        });

        // 紅心可用鍵盤（Enter／空白鍵）操作
        gridEl.addEventListener("keydown", (e) => {
          if (e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") return;
          const target = e.target;
          const favEl = target && target.closest ? target.closest("[data-tv-fav]") : null;
          if (!favEl) return;
          e.preventDefault();
          e.stopPropagation();
          toggleFav(favEl.getAttribute("data-tv-fav"));
          renderGrid();
        });

        searchEl.addEventListener("input", renderGrid);
        favOnlyEl.addEventListener("click", () => {
          const on = favOnlyEl.getAttribute("aria-pressed") === "true";
          favOnlyEl.setAttribute("aria-pressed", on ? "false" : "true");
          renderGrid();
        });

        document.getElementById("ltvClose").addEventListener("click", closePlayer);
        fullBtn.addEventListener("click", toggleFullscreen);
        document.addEventListener("fullscreenchange", syncFullBtn);
        syncFullBtn();
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && !playerEl.hidden) closePlayer();
        });

        load();
      })();
    </script>
  </body>
</html>
