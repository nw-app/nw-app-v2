<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title id="rolePageDocTitle">看板系統</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=4" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />
    <link rel="stylesheet" href="css/pwa.css" />
    <link rel="stylesheet" href="css/role-placeholder.css" />
  </head>
  <body>
    <div class="role-page">
      <header class="role-header">
        <div class="role-header-row">
          <div class="role-brand">
            <img src="logo.svg?v=4" alt="" />
            <div class="role-brand-meta">
              <div class="role-brand-title">生活網</div>
              <div class="role-brand-sub" id="communityNameSub">看板</div>
            </div>
          </div>
          <button class="user-avatar" type="button" id="btnUserMenu" aria-label="使用者選單" aria-haspopup="true" aria-expanded="false">
            <span class="user-greet" id="userGreeting">Hi~</span>
            <img class="user-avatar-img" id="userAvatarImg" alt="" />
            <span class="user-avatar-fallback" id="userAvatarFallback" aria-hidden="true">U</span>
          </button>
        </div>
      </header>

      <main class="role-main">
        <section class="role-card">
          <div class="role-badge" id="rolePageBadge">看板</div>
          <div class="role-hero-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="4" y="5" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.7"></rect>
              <path d="M9 19h6M12 16v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
            </svg>
          </div>
          <h1 class="role-title" id="rolePageTitle">看板系統</h1>
          <p class="role-desc" id="rolePageDesc">社區看板頁面功能開發中，後續將提供社區公告、輪播與資訊展示。</p>
          <div class="role-status">
            <span class="role-status-dot" aria-hidden="true"></span>
            <span>開發中</span>
          </div>
          <p class="role-footnote">目前先建立角色入口、登入導向與頁面骨架，後續功能可直接延伸。</p>
        </section>
      </main>
    </div>

    <div class="modal" id="profileModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
        <div class="modal-hd">
          <h3 class="modal-title" id="profileModalTitle">個人資訊</h3>
          <button class="modal-close" type="button" id="btnCloseProfileModal" aria-label="關閉">×</button>
        </div>
        <div class="modal-body">
          <div class="profile-row" id="profileCommunityItem" hidden>
            <div class="profile-value community" id="profileCommunityText">—</div>
            <div class="profile-value" id="profileRole">—</div>
          </div>
          <div class="profile-item">
            <div class="profile-avatar">
              <img id="profileAvatarImg" alt="" />
              <span class="user-avatar-fallback" id="profileAvatarFallback" aria-hidden="true">U</span>
              <button type="button" class="avatar-edit-btn" id="btnEditAvatar" aria-label="更換大頭照" title="更換大頭照">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 20h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
                  <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
                </svg>
              </button>
              <input type="file" id="profileAvatarFile" accept="image/*" hidden />
            </div>
          </div>
          <div class="profile-item">
            <div class="profile-label">姓名</div>
            <div class="profile-value" id="profileNameText">—</div>
          </div>
          <div class="profile-item" id="profileHouseNoItem">
            <div class="profile-label">戶號</div>
            <div class="profile-value" id="profileHouseNoText">—</div>
          </div>
          <div class="profile-item" id="profileHouseNoQrWrap" hidden></div>
          <div class="status" id="profileStatus" hidden></div>
        </div>
        <div class="modal-ft">
          <div class="profile-switch" id="profileSwitch" hidden></div>
          <button class="btn" type="button" id="btnCloseProfileModalFt">關閉</button>
          <button class="btn btn-primary" type="button" id="btnSignOut">登出</button>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/role-placeholder.js"></script>
    <script src="js/pwa.js?v=6"></script>
  </body>
</html>
