<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>社區服務系統平台｜HTML 原型</title>
    <style>
      :root {
        --brand: #d32f2f;
        --bg: #f2f3f5;
        --panel: #ffffff;
        --panel-2: #f9fafb;
        --text: #1f2937;
        --muted: #6b7280;
        --border: rgba(17, 24, 39, 0.12);
        --shadow: 0 10px 30px rgba(17, 24, 39, 0.12);
        --radius: 16px;
        --radius-sm: 12px;
        --sidebar-w: 260px;
        --rail-w: 76px;
        --tap: 48px;
        --gap: 16px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      a { color: inherit; text-decoration: none; }
      button, input, select, textarea { font: inherit; }
      ::selection { background: rgba(211, 47, 47, 0.18); }
      .layout {
        min-height: 100%;
        display: grid;
        grid-template-columns: var(--sidebar-w) 1fr;
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100dvh;
        background: linear-gradient(180deg, #c62828 0%, #d32f2f 45%, #b71c1c 100%);
        color: #fff;
        padding: 18px 14px;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 10px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);
      }
      .brand-badge {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.2);
        display: grid;
        place-items: center;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.18);
      }
      .brand-title {
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: 0.2px;
      }
      .brand-sub {
        font-size: 12px;
        opacity: 0.9;
        margin-top: 2px;
      }
      .side-tools {
        display: grid;
        gap: 10px;
        padding: 2px;
      }
      .pill {
        height: var(--tap);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .pill strong { font-size: 13px; }
      .pill span { font-size: 12px; opacity: 0.9; }
      .nav {
        display: grid;
        gap: 8px;
        align-content: start;
      }
      .nav a {
        height: var(--tap);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.08);
        transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
      }
      .nav a:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.14); }
      .nav a[aria-current="page"] {
        background: rgba(255, 255, 255, 0.22);
        border-color: rgba(255, 255, 255, 0.3);
      }
      .nav svg { flex: 0 0 auto; width: 22px; height: 22px; }
      .nav .label { font-weight: 700; letter-spacing: 0.2px; }
      .nav .hint { font-size: 12px; opacity: 0.9; margin-left: auto; }
      .sidebar-foot {
        display: grid;
        gap: 10px;
        padding-top: 6px;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
      }
      .side-mini {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.12);
      }
      .side-mini small { opacity: 0.9; }
      .main {
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 14px;
        padding: 18px 18px 90px;
      }
      .topbar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 14px 14px;
        border-radius: var(--radius);
        background: var(--panel);
        box-shadow: 0 10px 28px rgba(17, 24, 39, 0.08);
        border: 1px solid var(--border);
      }
      .topbar-title {
        min-width: 220px;
        display: grid;
        gap: 2px;
      }
      .topbar-title h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.2px;
      }
      .topbar-title p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }
      .search {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 14px;
        background: var(--panel-2);
        border: 1px solid rgba(17, 24, 39, 0.1);
      }
      .search input {
        width: 100%;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
      }
      .actions { display: flex; gap: 10px; align-items: center; }
      .role-select {
        height: var(--tap);
        padding: 0 12px;
        border-radius: 14px;
        border: 1px solid rgba(17, 24, 39, 0.12);
        background: #fff;
        color: var(--text);
        cursor: pointer;
      }
      .role-select:focus {
        outline: none;
        border-color: rgba(211, 47, 47, 0.42);
        box-shadow: 0 0 0 4px rgba(211, 47, 47, 0.14);
      }
      .btn {
        height: var(--tap);
        padding: 0 14px;
        border-radius: 14px;
        border: 1px solid rgba(17, 24, 39, 0.12);
        background: #fff;
        color: var(--text);
        display: inline-flex;
        gap: 10px;
        align-items: center;
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease, border-color 120ms ease;
      }
      .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(17, 24, 39, 0.12); }
      .btn-primary {
        background: var(--brand);
        border-color: rgba(0, 0, 0, 0.08);
        color: #fff;
      }
      .btn-primary:hover { box-shadow: 0 14px 28px rgba(211, 47, 47, 0.35); }
      .btn svg { width: 18px; height: 18px; }
      .content {
        display: grid;
        gap: 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 14px;
        align-items: start;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 10px 26px rgba(17, 24, 39, 0.07);
      }
      .card-hd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 14px 10px;
        border-bottom: 1px solid rgba(17, 24, 39, 0.08);
      }
      .card-hd .left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .chip {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: rgba(211, 47, 47, 0.12);
        display: grid;
        place-items: center;
        border: 1px solid rgba(211, 47, 47, 0.25);
      }
      .chip svg { width: 22px; height: 22px; color: var(--brand); }
      .card-hd h2 {
        margin: 0;
        font-size: 16px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card-hd p {
        margin: 2px 0 0;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card-bd { padding: 14px; }
      .form {
        display: grid;
        gap: 12px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .field { display: grid; gap: 6px; }
      label { font-size: 12px; color: var(--muted); }
      input[type="text"], input[type="date"], input[type="time"], select, textarea {
        height: 44px;
        padding: 0 12px;
        border-radius: 14px;
        border: 1px solid rgba(17, 24, 39, 0.14);
        background: #fff;
        outline: none;
      }
      textarea { height: 100px; padding: 10px 12px; resize: vertical; }
      input:focus, select:focus, textarea:focus {
        border-color: rgba(211, 47, 47, 0.42);
        box-shadow: 0 0 0 4px rgba(211, 47, 47, 0.14);
      }
      .kpi {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .kpi .k {
        padding: 12px 12px;
        border-radius: var(--radius-sm);
        background: var(--panel-2);
        border: 1px solid rgba(17, 24, 39, 0.08);
      }
      .k .n {
        font-weight: 900;
        font-size: 18px;
        letter-spacing: 0.3px;
      }
      .k .t { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .list {
        display: grid;
        gap: 10px;
      }
      .item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        padding: 12px;
        border-radius: var(--radius-sm);
        background: #fff;
        border: 1px solid rgba(17, 24, 39, 0.1);
      }
      .item .meta {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        height: 26px;
        padding: 0 10px;
        border-radius: 999px;
        font-size: 12px;
        border: 1px solid rgba(17, 24, 39, 0.14);
        background: var(--panel-2);
        color: var(--muted);
      }
      .tag.red {
        background: rgba(211, 47, 47, 0.1);
        border-color: rgba(211, 47, 47, 0.24);
        color: #9f1c1c;
      }
      .muted { color: var(--muted); }
      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .dynamic-slot {
        position: fixed;
        right: 14px;
        bottom: 14px;
        width: min(420px, calc(100vw - 28px));
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(17, 24, 39, 0.14);
        border-radius: 18px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
        overflow: hidden;
      }
      .slot-hd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 12px;
        border-bottom: 1px solid rgba(17, 24, 39, 0.08);
      }
      .slot-hd strong { font-size: 13px; }
      .slot-bd { padding: 12px; display: grid; gap: 10px; }
      .slot-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px 10px;
        border-radius: 14px;
        background: var(--panel-2);
        border: 1px dashed rgba(17, 24, 39, 0.18);
      }
      .slot-row small { color: var(--muted); }
      .fab {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        border: 0;
        background: var(--brand);
        color: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
        box-shadow: 0 14px 28px rgba(211, 47, 47, 0.35);
      }
      .fab:active { transform: translateY(1px); }
      .fab svg { width: 20px; height: 20px; }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        background: rgba(17, 24, 39, 0.94);
        color: #fff;
        padding: 10px 12px;
        border-radius: 14px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease, transform 140ms ease;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(-4px);
      }
      @media (max-width: 1024px), (max-height: 520px) {
        .layout { grid-template-columns: var(--rail-w) 1fr; }
        .sidebar { padding: 14px 10px; }
        .brand { justify-content: center; }
        .brand-title, .brand-sub, .pill strong, .pill span, .nav .label, .nav .hint, .side-mini div { display: none; }
        .pill, .nav a, .side-mini { justify-content: center; padding: 0; }
        .nav a { gap: 0; }
        .side-mini { justify-content: center; }
        .main { padding: 16px 16px 90px; }
        .grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 700px) {
        .layout { grid-template-columns: 1fr; }
        .sidebar {
          position: sticky;
          top: 0;
          height: auto;
          grid-template-rows: auto;
          grid-auto-flow: column;
          align-items: center;
          overflow-x: auto;
          overflow-y: hidden;
          padding: 10px 10px;
          gap: 10px;
        }
        .brand { min-width: 180px; }
        .side-tools, .sidebar-foot { display: none; }
        .nav {
          display: flex;
          gap: 10px;
          align-items: center;
          padding-right: 6px;
        }
        .nav a {
          flex: 0 0 auto;
          height: 44px;
          padding: 0 12px;
          gap: 10px;
          border-radius: 999px;
        }
        .nav .label, .nav .hint { display: inline; }
        .main { padding: 14px 12px 108px; }
        .topbar { flex-wrap: wrap; }
        .topbar-title { min-width: 0; flex: 1 1 100%; }
        .actions { width: 100%; justify-content: flex-end; }
        .kpi { grid-template-columns: 1fr; }
        .row { grid-template-columns: 1fr; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <div class="layout" id="app">
      <aside class="sidebar" aria-label="主選單">
        <div class="brand">
          <div class="brand-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M4 10.5 12 4l8 6.5V20a1.5 1.5 0 0 1-1.5 1.5H5.5A1.5 1.5 0 0 1 4 20v-9.5Z" stroke="white" stroke-width="1.7" />
              <path d="M9 21v-7a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v7" stroke="white" stroke-width="1.7" />
            </svg>
          </div>
          <div>
            <div class="brand-title">社區服務系統</div>
            <div class="brand-sub" id="brandRole">社區｜原型</div>
          </div>
        </div>

        <div class="side-tools" aria-label="狀態">
          <div class="pill" role="status">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <div>
              <strong>今日值班</strong>
              <div><span>管理員｜大廳</span></div>
            </div>
          </div>
        </div>

        <nav class="nav" id="nav"></nav>

        <div class="sidebar-foot">
          <div class="side-mini" role="note" aria-label="提示">
            <div>
              <div style="font-weight:800; letter-spacing:0.2px;">擴充預留</div>
              <small>右下角 Dynamic Slot</small>
            </div>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="width:18px;height:18px;opacity:0.95;">
              <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10Z" stroke="white" stroke-width="1.7"/>
              <path d="M12 16v-5" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M12 8.2h.01" stroke="white" stroke-width="3.2" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </aside>

      <main class="main" aria-label="內容區">
        <header class="topbar">
          <div class="topbar-title">
            <h1 id="pageTitle">包裹郵件</h1>
            <p id="pageSubtitle">快速登記、查詢與領取確認（示意）</p>
          </div>

          <div class="search" role="search" aria-label="全站快速搜尋">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z" stroke="rgba(31,41,55,0.7)" stroke-width="1.7"/>
              <path d="M21 21l-4.3-4.3" stroke="rgba(31,41,55,0.7)" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <input id="globalSearch" type="text" placeholder="輸入住戶/訪客/包裹單號/設施名稱..." autocomplete="off" />
          </div>

          <div class="actions">
            <select id="roleSelect" class="role-select" aria-label="切換角色">
              <option value="admin">系統管理員</option>
              <option value="community" selected>社區</option>
              <option value="resident">住戶</option>
            </select>
            <button class="btn" id="btnDemoData" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 8v8M8 12h8" stroke="rgba(31,41,55,0.85)" stroke-width="1.7" stroke-linecap="round"/>
                <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10Z" stroke="rgba(31,41,55,0.35)" stroke-width="1.7"/>
              </svg>
              產生示例
            </button>
            <button class="btn btn-primary" id="btnQuickAction" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 5v14M5 12h14" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
              快速新增
            </button>
          </div>
        </header>

        <section class="content" id="content" aria-live="polite"></section>
      </main>
    </div>

    <aside class="dynamic-slot" aria-label="Dynamic Slot（功能擴充預留位）">
      <div class="slot-hd">
        <strong>Dynamic Slot（預留）</strong>
        <button class="fab" type="button" id="btnAddSlot" aria-label="新增預留功能卡片">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 5v14M5 12h14" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="slot-bd" id="slotBody">
        <div class="slot-row">
          <div>
            <div style="font-weight:800; letter-spacing:0.2px;">新增功能預留位</div>
            <small>複製卡片模板即可快速擴充模組</small>
          </div>
          <span class="tag red">Slot 1</span>
        </div>
      </div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <template id="module-card-template">
      <article class="card" data-module-card>
        <div class="card-hd">
          <div class="left">
            <div class="chip" aria-hidden="true"></div>
            <div style="min-width:0;">
              <h2 data-title></h2>
              <p data-desc></p>
            </div>
          </div>
          <div style="display:flex; gap:10px; align-items:center;">
            <span class="tag" data-badge></span>
            <button class="btn" type="button" data-action>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 12h14" stroke="rgba(31,41,55,0.85)" stroke-width="1.7" stroke-linecap="round"/>
                <path d="M13 5l7 7-7 7" stroke="rgba(31,41,55,0.85)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              進入
            </button>
          </div>
        </div>
        <div class="card-bd" data-body></div>
      </article>
    </template>

    <script>
      const icons = {
        parcel: `
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21 8.5 12 13 3 8.5 12 4l9 4.5Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M21 8.5V17a2 2 0 0 1-1.1 1.8L12 22l-7.9-3.2A2 2 0 0 1 3 17V8.5" stroke="white" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M12 13v9" stroke="white" stroke-width="1.7" />
          </svg>
        `,
        visitor: `
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z" stroke="white" stroke-width="1.7"/>
            <path d="M4 20a8 8 0 0 1 16 0" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        `,
        residents: `
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 21v-9a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v9" stroke="white" stroke-width="1.7"/>
            <path d="M12 7a3.5 3.5 0 1 0-3.5-3.5A3.5 3.5 0 0 0 12 7Z" stroke="white" stroke-width="1.7"/>
          </svg>
        `,
        facility: `
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 3h10v4H7V3Z" stroke="white" stroke-width="1.7"/>
            <path d="M6 7h12v14H6V7Z" stroke="white" stroke-width="1.7"/>
            <path d="M9 11h6M9 15h6" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        `,
        bulletin: `
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 4h10v16H7V4Z" stroke="white" stroke-width="1.7"/>
            <path d="M9 8h6M9 12h6M9 16h4" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        `,
        parking: `

      const communityModules = [
        {

      function getRoleModules(roleId) {
        if (roleId === "admin") return adminModules;
        if (roleId === "resident") return residentModules;
        return communityModules;
      }

      const navEl = document.getElementById("nav");
      const contentEl = document.getElementById("content");
      const pageTitleEl = document.getElementById("pageTitle");
      const pageSubtitleEl = document.getElementById("pageSubtitle");
      const toastEl = document.getElementById("toast");
      const globalSearchEl = document.getElementById("globalSearch");
      const roleSelectEl = document.getElementById("roleSelect");
      const brandRoleEl = document.getElementById("brandRole");

      let currentRoleId = "community";

      function toast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        window.clearTimeout(toastEl._t);
        toastEl._t = window.setTimeout(() => toastEl.classList.remove("show"), 1600);
      }

      function parseRoute() {
        const raw = String(location.hash || "").replace(/^#/, "").trim();
        if (!raw) return { roleId: "community", moduleId: roles.community.defaultModule };
        const parts = raw.split("/");
        const roleId = roles[parts[0]] ? parts[0] : "community";
        const moduleId = parts[1] || roles[roleId].defaultModule;
        return { roleId, moduleId };
      }

      function setRoute(roleId, moduleId) {
        history.replaceState(null, "", `#${roleId}/${moduleId}`);
      }

      function buildNav(roleId) {
        const modules = getRoleModules(roleId);
        navEl.innerHTML = modules.map((m) => `
          <a href="#${roleId}/${m.id}" data-id="${m.id}" aria-current="false">
            <span aria-hidden="true">${m.icon}</span>
            <span class="label">${m.name}</span>
            <span class="hint">${m.hint}</span>
          </a>
        `).join("");
        navEl.querySelectorAll("a").forEach((a) => {
          a.addEventListener("click", (e) => {
            e.preventDefault();
            setActive(roleId, a.dataset.id);
          });
        });
      }

      function setActive(roleId, moduleId) {
        const modules = getRoleModules(roleId);
        const m = modules.find((x) => x.id === moduleId) || modules[0];
        currentRoleId = roleId;

        roleSelectEl.value = roleId;
        brandRoleEl.textContent = `${roles[roleId].name}｜原型`;
        globalSearchEl.placeholder = roles[roleId].searchPlaceholder;

        buildNav(roleId);
        navEl.querySelectorAll("a").forEach((a) => {
          a.setAttribute("aria-current", a.dataset.id === m.id ? "page" : "false");
        });

        pageTitleEl.textContent = m.name;
        pageSubtitleEl.textContent = m.desc;
        contentEl.innerHTML = "";

        const tpl = document.getElementById("module-card-template");
        const node = tpl.content.cloneNode(true);
        const chip = node.querySelector(".chip");
        chip.innerHTML = m.icon;
        node.querySelector("[data-title]").textContent = m.name;
        node.querySelector("[data-desc]").textContent = m.desc;
        node.querySelector("[data-badge]").textContent = m.badge;
        node.querySelector("[data-body]").innerHTML = m.render();
        node.querySelector("[data-action]").addEventListener("click", () => toast(`已進入「${m.name}」（示意）`));
        contentEl.appendChild(node);

        m.afterRender?.();
        setRoute(roleId, m.id);
      }

      function initSlot() {
        const btnAdd = document.getElementById("btnAddSlot");
        const slotBody = document.getElementById("slotBody");
        let slotCount = 1;
        btnAdd.addEventListener("click", () => {
          slotCount += 1;
          const row = document.createElement("div");
          row.className = "slot-row";
          row.innerHTML = `
            <div>
              <div style="font-weight:800; letter-spacing:0.2px;">動態預留位 ${slotCount}</div>
              <small>可作為新模組入口、快捷操作、通知中心等</small>
            </div>
            <span class="tag red">Slot ${slotCount}</span>
          `;
          slotBody.appendChild(row);
          toast("已新增 Dynamic Slot（示意）");
        });
      }

        document.getElementById("btnQuickAction").addEventListener("click", () => {
          const r = parseRoute();
          const name = getRoleModules(r.roleId).find((x) => x.id === r.moduleId)?.name || "功能";
          toast(`快速新增：${name}（示意）`);

        document.getElementById("btnDemoData").addEventListener("click", () => {
          saveConfig(defaultConfig());
          saveAccounts(defaultAccounts());
          const r = parseRoute();
          setActive(r.roleId, r.moduleId);
          toast("已產生示例資料（示意）");
        });
        globalSearchEl.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            toast(`搜尋：「${globalSearchEl.value || "（空）"}」（示意）`);
          }
        });
        roleSelectEl.addEventListener("change", () => {
          const roleId = roleSelectEl.value;
          setActive(roleId, roles[roleId].defaultModule);
        });
      }

      initSlot();
      bindTopbar();
      const initial = parseRoute();
      setActive(initial.roleId, initial.moduleId);
      window.addEventListener("hashchange", () => {
        const r = parseRoute();
        setActive(r.roleId, r.moduleId);
      });
    </script>
