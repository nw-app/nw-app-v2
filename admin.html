<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>社區｜社區APP後台</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="layout">
      <header class="frame-hd" aria-label="頁首">
        <div class="frame-hd-row">
          <div class="brand">
            <img src="logo.svg" alt="" />
            <div class="meta">
              <div class="title">社區APP後台</div>
              <div class="sub" id="loginInfo">—</div>
            </div>
          </div>
          <div class="actions">
            <select id="roleSelect" class="role-select" aria-label="切換角色">
              <option value="admin">系統管理員</option>
              <option value="community" selected>社區</option>
              <option value="resident">住戶</option>
            </select>
            <button class="btn" type="button" id="btnSignOut">登出</button>
          </div>
        </div>
        <div class="frame-hd-row">
          <div class="frame-title">
            <h1>功能入口</h1>
            <p>圖卡式快速操作｜依系統設定啟用/停用與導向</p>
          </div>
          <div class="search" role="search" aria-label="全站快速搜尋">
            <input id="globalSearch" type="text" placeholder="輸入住戶/訪客/包裹單號/設施名稱..." autocomplete="off" />
          </div>
        </div>
      </header>

      <main class="frame-bd" aria-label="頁中">
        <section id="content" aria-live="polite"></section>
      </main>

      <footer class="frame-ft" aria-label="頁尾">
        <nav class="nav" aria-label="快捷入口">
          <a href="admin.html#community/community-dashboard" aria-current="page">總覽</a>
          <a href="nw01.html">包裹</a>
          <a href="nw02.html">訪客</a>
          <a href="nw03.html">造冊</a>
          <a href="nw04.html">預約</a>
          <a href="nw05.html">公告</a>
          <a href="nw06.html">停車</a>
        </nav>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
