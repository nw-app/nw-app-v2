<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>社區｜社區APP後台</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="css/pwa.css" />
  </head>
  <body>
    <div class="layout">
      <header class="frame-hd" aria-label="頁首">
        <div class="frame-hd-row">
          <div class="brand">
            <img src="logo.svg" alt="" />
            <div class="meta">
              <div class="title">西北守護星</div>
            </div>
          </div>
          <button class="user-avatar" type="button" id="btnUserMenu" aria-label="使用者選單" aria-haspopup="true" aria-expanded="false">
            <span class="user-avatar-fallback" id="userAvatarFallback" aria-hidden="true">U</span>
          </button>
        </div>
      </header>

      <div class="frame-midtop" aria-label="頁中上">
        <div class="frame-hd-row">
          <div class="frame-title">
            <h1>功能入口</h1>
            <p>圖卡式快速操作｜依系統設定啟用/停用與導向</p>
          </div>
          <div class="search" role="search" aria-label="全站快速搜尋">
            <input id="globalSearch" type="text" placeholder="輸入住戶/訪客/包裹單號/設施名稱..." autocomplete="off" />
          </div>
        </div>
      </div>

      <main class="frame-bd" aria-label="頁中">
        <section id="content" aria-live="polite"></section>
      </main>

      <footer class="frame-ft" aria-label="頁尾">
        <nav class="nav" aria-label="快捷入口">
          <a href="admin.html#community/community-dashboard" aria-current="page">總覽</a>
          <a href="nw01.html">包裹</a>
          <a href="nw02.html">訪客</a>
          <a href="nw03.html">造冊</a>
          <a href="nw04.html">預約</a>
          <a href="nw05.html">公告</a>
          <a href="nw06.html">停車</a>
        </nav>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/pwa.js"></script>

    <div class="modal" id="profileModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
        <div class="modal-hd">
          <h3 class="modal-title" id="profileModalTitle">個人資訊</h3>
          <button class="modal-close" type="button" id="btnCloseProfileModal" aria-label="關閉">×</button>
        </div>
        <form id="profileForm">
          <div class="modal-body">
            <div class="profile-item">
              <div class="profile-label">角色名稱</div>
              <div class="profile-value" id="profileRole">—</div>
            </div>
            <div class="profile-item">
              <div class="profile-label">大頭照</div>
              <div class="profile-avatar">
                <span class="user-avatar-fallback" id="profileAvatarFallback" aria-hidden="true">U</span>
              </div>
            </div>
            <div class="profile-item">
              <div class="profile-label">姓名</div>
              <input id="profileName" type="text" placeholder="請輸入姓名" autocomplete="off" />
            </div>
            <div class="status" id="profileStatus" hidden></div>
          </div>
          <div class="modal-ft">
            <button class="btn" type="button" id="btnCloseProfileModalFt">關閉</button>
            <button class="btn btn-primary" type="button" id="btnSignOut">登出</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
