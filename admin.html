<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />

    <link rel="icon" type="image/svg+xml" href="logo.svg?v=3" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="css/admin.css" />

  <body>
    <div class="layout">
      <header class="frame-hd" aria-label="頁首">
        <div class="frame-hd-row">
          <div class="brand">
            <img src="logo.svg?v=3" alt="" />
            <div class="meta">
              <div class="title">QAI生活網</div>
              <div class="sub" id="communityNameSub"></div>
            </div>
          </div>
          <button class="user-avatar" type="button" id="btnUserMenu" aria-label="使用者選單" aria-haspopup="true" aria-expanded="false">
            <span class="user-greet" id="userGreeting">Hi~</span>
            <img class="user-avatar-img" id="userAvatarImg" alt="" />
            <span class="user-avatar-fallback" id="userAvatarFallback" aria-hidden="true">U</span>
          </button>
        </div>
      </header>

      <div class="frame-midtop" aria-label="頁中上"></div>

      <div class="frame-subnav" id="subnav" aria-label="子分頁按鈕列"></div>

      <main class="frame-bd" aria-label="頁中">
        <section id="content" aria-live="polite"></section>
      </main>

            </svg>

          </a>
          <a href="#community/care">

              <path d="M12 21.2c4.8 0 8.7-3.9 8.7-8.7S16.8 3.8 12 3.8 3.3 7.7 3.3 12.5 7.2 21.2 12 21.2Z" stroke="currentColor" stroke-width="1.7"/>

    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/admin.js?v=108"></script>
    <script src="js/pwa.js?v=3"></script>

    <div class="modal" id="profileModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
        <div class="modal-hd">
          <h3 class="modal-title" id="profileModalTitle">個人資訊</h3>
          <button class="modal-close" type="button" id="btnCloseProfileModal" aria-label="關閉">×</button>
        </div>
        <form id="profileForm">
          <div class="modal-body">
            <div class="profile-row" id="profileCommunityItem" hidden>
              <div class="profile-value community" id="profileCommunityText">—</div>
              <div class="profile-value" id="profileRole">—</div>
            </div>
            <div class="profile-item">
              <div class="profile-avatar">
                <img id="profileAvatarImg" alt="" />
                <span class="user-avatar-fallback" id="profileAvatarFallback" aria-hidden="true">U</span>
                <button type="button" class="avatar-edit-btn" id="btnEditAvatar" aria-label="更換大頭照" title="更換大頭照">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 20h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                  </svg>
                </button>
                <input type="file" id="profileAvatarFile" accept="image/*" hidden />
              </div>
            </div>
            <div class="profile-item">
              <div class="profile-label">姓名</div>
              <div class="profile-value" id="profileNameText">—</div>
            </div>
            <div class="profile-item" id="profileHouseNoItem">
              <div class="profile-label">戶號</div>
              <div class="profile-value" id="profileHouseNoText">—</div>
            </div>
            <div class="status" id="profileStatus" hidden></div>
          </div>
          <div class="modal-ft">
            <div class="profile-switch" id="profileSwitch" hidden></div>
            <button class="btn" type="button" id="btnCloseProfileModalFt">關閉</button>
            <button class="btn btn-primary" type="button" id="btnSignOut">登出</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
