<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>社區｜社區APP後台</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="css/pwa.css" />
  </head>
  <body>
    <div class="layout">
      <header class="frame-hd" aria-label="頁首">
        <div class="frame-hd-row">
          <div class="brand">
            <img src="logo.svg" alt="" />
            <div class="meta">
              <div class="title">西北守護星</div>
              <div class="sub" id="communityNameSub"></div>
            </div>
          </div>
          <button class="user-avatar" type="button" id="btnUserMenu" aria-label="使用者選單" aria-haspopup="true" aria-expanded="false">
            <span class="user-greet" id="userGreeting">Hi~</span>
            <img class="user-avatar-img" id="userAvatarImg" alt="" />
            <span class="user-avatar-fallback" id="userAvatarFallback" aria-hidden="true">U</span>
          </button>
        </div>
      </header>

      <div class="frame-midtop" aria-label="頁中上"></div>

      <main class="frame-bd" aria-label="頁中">
        <section id="content" aria-live="polite"></section>
      </main>

      <footer class="frame-ft" aria-label="頁尾">
        <nav class="nav" aria-label="快捷入口">
          <a href="admin.html#community/community-dashboard" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1.5 1.5 0 0 1-1.5 1.5H5.5A1.5 1.5 0 0 1 4 20v-9.5Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 21v-7a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v7" stroke="currentColor" stroke-width="1.7"/></svg>
            <span class="label">總覽</span>
          </a>
          <a href="#community/parcel">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 8.5 12 13 3 8.5 12 4l9 4.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M21 8.5V17a2 2 0 0 1-1.1 1.8L12 22l-7.9-3.2A2 2 0 0 1 3 17V8.5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 13v9" stroke="currentColor" stroke-width="1.7"/></svg>
            <span class="label">包裹</span>
          </a>
          <a href="#community/visitor">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z" stroke="currentColor" stroke-width="1.7"/><path d="M4 20a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span class="label">訪客</span>
          </a>
          <a href="#community/residents">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 21v-9a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v9" stroke="currentColor" stroke-width="1.7"/><path d="M12 7a3.5 3.5 0 1 0-3.5-3.5A3.5 3.5 0 0 0 12 7Z" stroke="currentColor" stroke-width="1.7"/></svg>
            <span class="label">造冊</span>
          </a>
          <a href="#community/facility">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h10v4H7V3Z" stroke="currentColor" stroke-width="1.7"/><path d="M6 7h12v14H6V7Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 11h6M9 15h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span class="label">預約</span>
          </a>
          <a href="#community/bulletin">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 4h10v16H7V4Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 8h6M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span class="label">公告</span>
          </a>
          <a href="#community/parking">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 21V3h6a5 5 0 0 1 0 10H7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 13.5c2 2 2 5.5-1.5 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M14.5 13.5c2 2 2 5.5-1.5 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" opacity="0.85"/></svg>
            <span class="label">停車</span>
          </a>
        </nav>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/pwa.js"></script>

    <div class="modal" id="profileModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
        <div class="modal-hd">
          <h3 class="modal-title" id="profileModalTitle">個人資訊</h3>
          <button class="modal-close" type="button" id="btnCloseProfileModal" aria-label="關閉">×</button>
        </div>
        <form id="profileForm">
          <div class="modal-body">
            <div class="profile-row" id="profileCommunityItem" hidden>
              <div class="profile-value community" id="profileCommunityText">—</div>
              <div class="profile-value" id="profileRole">—</div>
            </div>
            <div class="profile-item">
              <div class="profile-avatar">
                <img id="profileAvatarImg" alt="" />
                <span class="user-avatar-fallback" id="profileAvatarFallback" aria-hidden="true">U</span>
              </div>
            </div>
            <div class="profile-item">
              <div class="profile-label">姓名</div>
              <div class="profile-value" id="profileNameText">—</div>
            </div>
            <div class="status" id="profileStatus" hidden></div>
          </div>
          <div class="modal-ft">
            <div class="profile-switch" id="profileSwitch" hidden></div>
            <button class="btn" type="button" id="btnCloseProfileModalFt">關閉</button>
            <button class="btn btn-primary" type="button" id="btnSignOut">登出</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
