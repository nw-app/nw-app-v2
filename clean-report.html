<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>通知清潔｜社區系統</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=4" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />
    <link rel="stylesheet" href="css/parcel.css?v=5" />
    <link rel="stylesheet" href="css/ads-footer.css?v=16" />
    <link rel="stylesheet" href="css/pwa.css" />
    <style>
      /* 表單區（沿用 parcel 版面的卡片與間距） */
      .hidden{display:none !important;}
      .cr-form{display:grid;gap:14px;padding:12px 0 4px;}
      .cr-field{display:grid;gap:6px;}
      .cr-field > .cr-label{font-weight:800;font-size:calc(13px * var(--fs,1));color:var(--muted);}
      .cr-locs{display:flex;flex-wrap:wrap;gap:8px;}
      .cr-chip{
        border:1px solid var(--border);
        background:var(--panel);
        color:var(--text);
        border-radius:999px;
        height:40px;
        padding:0 16px;
        font-weight:800;
        font-size:calc(13px * var(--fs,1));
        cursor:pointer;
        transition:all .2s;
      }
      .cr-chip.active{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(211,47,47,.3);}
      .cr-hint{
        margin-top:8px;
        font-size:calc(12px * var(--fs,1));
        font-weight:800;
        color:var(--brand);
        background:rgba(211,47,47,.08);
        border:1px solid rgba(211,47,47,.18);
        border-radius:var(--radius-sm);
        padding:8px 10px;
        line-height:1.5;
        white-space:pre-wrap;
        word-break:break-word;
      }
      .cr-field textarea{
        width:100%;
        min-height:96px;
        padding:12px;
        border-radius:var(--radius-sm);
        border:1px solid var(--border);
        background:var(--panel);
        color:var(--text);
        font-weight:700;
        font-family:inherit;
        font-size:calc(14px * var(--fs,1));
        resize:vertical;
      }
      .cr-submit{width:100%;}
      .cr-item{
        background:var(--panel);
        border:1px solid var(--border);
        border-radius:var(--radius);
        box-shadow:0 10px 26px rgba(17,24,39,.06);
        padding:12px 14px;
        margin-bottom:10px;
      }
      .cr-item .cr-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
      .cr-item .cr-loc{font-weight:900;font-size:calc(15px * var(--fs,1));}
      .cr-item .cr-note{margin-top:6px;font-size:calc(13px * var(--fs,1));color:var(--text);white-space:pre-wrap;word-break:break-word;}
      .cr-item .cr-time{margin-top:6px;font-size:calc(11px * var(--fs,1));color:var(--muted);font-weight:700;}
      .cr-tag{flex:0 0 auto;font-size:calc(11px * var(--fs,1));font-weight:900;border-radius:999px;padding:4px 10px;background:rgba(211,47,47,.12);color:var(--brand);}
      .cr-tag.done{background:rgba(22,163,74,.14);color:#15803d;}
    </style>
  </head>
  <body>
    <div class="parcel-layout">
      <header class="parcel-hd">
        <div class="parcel-hd-content">
          <div class="parcel-title" id="crTitle">通知清潔</div>
        </div>
      </header>

      <div class="parcel-midtop">
        <div class="parcel-tabs">
          <button class="tab-btn active" type="button" data-cr-tab="report">通報清潔</button>
          <button class="tab-btn" type="button" data-cr-tab="history">我的紀錄<span class="tab-count" id="crHistoryCount" hidden>0</span></button>
        </div>
      </div>

      <main class="parcel-bd">
        <div class="cr-form" id="crReportView">
          <div class="cr-field">
            <div class="cr-label">選擇打掃位置</div>
            <div class="cr-locs" id="crLocations">
              <div class="status">載入中...</div>
            </div>
            <div class="cr-hint" id="crLocHint" hidden></div>
          </div>

          <div class="cr-field">
            <div class="cr-label">補充說明（選填）</div>
            <textarea id="crNote" placeholder="例如：垃圾滿出、地面積水、需要消毒…"></textarea>
          </div>

          <button class="btn-ft btn-back cr-submit" type="button" id="crSubmit">送出清潔通報</button>
        </div>

        <div class="hidden" id="crHistoryView">
          <div class="status">載入中...</div>
        </div>
      </main>

      <footer class="parcel-ft">
        <button class="btn-ft btn-back" type="button" id="crBack">返回</button>
        <button class="btn-ft btn-refresh" type="button" id="crRefresh">重新整理</button>
      </footer>
    </div>

    <div class="modal" id="profileModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
        <div class="modal-hd">
          <h3 class="modal-title" id="profileModalTitle">個人資訊</h3>
          <button class="modal-close" type="button" id="btnCloseProfileModal" aria-label="關閉">×</button>
        </div>
        <div class="modal-body">
          <div class="profile-row" id="profileCommunityItem" hidden>
            <div class="profile-value community" id="profileCommunityText">—</div>
            <div class="profile-value" id="profileRole">—</div>
          </div>
          <div class="profile-item">
            <div class="profile-avatar">
              <img id="profileAvatarImg" alt="" />
              <span class="user-avatar-fallback" id="profileAvatarFallback" aria-hidden="true">U</span>
            </div>
          </div>
          <div class="profile-item">
            <div class="profile-label">姓名</div>
            <div class="profile-value" id="profileNameText">—</div>
          </div>
          <div class="profile-item" id="profileHouseNoItem">
            <div class="profile-label">戶號</div>
            <div class="profile-value" id="profileHouseNoText">—</div>
          </div>
          <div class="status" id="profileStatus" hidden></div>
        </div>
        <div class="modal-ft">
          <button class="btn" type="button" id="btnCloseProfileModalFt">關閉</button>
          <button class="btn btn-primary" type="button" id="btnSignOut">登出</button>
        </div>
      </div>
    </div>

    <div class="wc-toast" id="crToast" style="position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(17,24,39,.94);color:#fff;font-size:13px;font-weight:800;padding:10px 18px;border-radius:999px;z-index:99998;opacity:0;pointer-events:none;transition:opacity .2s ease;max-width:86vw;text-align:center;"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/clean-report.js?v=3"></script>
    <script src="js/ads-footer.js?v=16"></script>
    <script src="js/pwa.js?v=12"></script>
  </body>
</html>
