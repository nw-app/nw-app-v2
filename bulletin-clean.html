<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>清潔通報｜社區系統</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg?v=4" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#d32f2f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-192.png?v=2" />
  <link rel="stylesheet" href="css/parcel.css?v=3" />
  <link rel="stylesheet" href="css/ads-footer.css?v=4" />
  <link rel="stylesheet" href="css/pwa.css" />
</head>
<body>
  <div class="parcel-layout">
    <header class="parcel-hd">
      <div class="parcel-hd-content">
        <div class="parcel-title" id="communityBulletinTitle">清潔通報</div>
      </div>
    </header>

    <div class="parcel-midtop">
      <div class="parcel-tabs" id="cleanTabs">
        <button class="tab-btn active" type="button" data-clean-tab="submit">提出通報</button>
        <button class="tab-btn" type="button" data-clean-tab="list">我的通報進度</button>
      </div>
    </div>

    <main class="parcel-bd">
      <section class="card" id="cleanSubmitSection" style="margin-bottom:18px;">
        <div class="card-hd">
          <div class="left">
            <h2 style="font-size:17px; margin:0 0 4px 0;">提出清潔通報</h2>
            <p class="muted" style="margin:0; font-size:13px;">社區後台接獲後會立即派員處理，處理完成將附上相片與回覆</p>
          </div>
          <span class="tag yellow">住戶申請</span>
        </div>
        <div class="card-bd">
          <form id="cleanSubmitForm">
            <div class="status" id="cleanSubmitStatus" hidden></div>
            <div class="field">
              <label for="cleanCategory">類型</label>
              <select id="cleanCategory" required>
                <option value="trash">垃圾未清</option>
                <option value="mess">環境髒亂</option>
                <option value="disinfect">消毒需求</option>
                <option value="other">其他</option>
              </select>
            </div>
            <div class="field">
              <label for="cleanLocation">位置（樓層/區域/戶號）</label>
              <input id="cleanLocation" type="text" placeholder="例如：3樓電梯間、大廳前門、5樓公共走道" required />
            </div>
            <div class="field">
              <label for="cleanDescription">說明</label>
              <textarea id="cleanDescription" rows="4" placeholder="請描述狀況（例如：廚餘桶滿溢、電梯地毯有飲料溢出…）" required></textarea>
            </div>
            <div class="field">
              <label>相片（最多 5 張，可拍照）</label>
              <div id="cleanImagesPreview" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;"></div>
              <label class="btn btn-sm" style="cursor:pointer; display:inline-flex; align-items:center; gap:6px;">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="width:18px; height:18px;">
                  <path d="M4 4h16v16H4V4zm1 2v12h14V6H5zm2 2h10l-2 4-3-4-2 4-3-4z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                選擇/拍照
                <input id="cleanImagesFile" type="file" accept="image/*" multiple capture="environment" hidden />
              </label>
            </div>
            <div style="margin-top:8px;">
              <button class="btn btn-primary" type="submit">送出通報</button>
            </div>
          </form>
        </div>
      </section>

      <section class="card" id="cleanListSection">
        <div class="card-hd">
          <div class="left">
            <h2 style="font-size:17px; margin:0 0 4px 0;">我的通報進度</h2>
            <p class="muted" style="margin:0; font-size:13px;">可查看申請單處理進度、完成後相片與回覆</p>
          </div>
        </div>
        <div class="card-bd">
          <div class="parcel-list" id="bulletinList" style="display:flex; flex-direction:column; gap:12px;">
            <div class="status">載入中...</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="parcel-ft"></footer>
  </div>

  <div class="modal" id="profileModal" hidden>
    <div class="modal-backdrop" data-modal-close="1"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
      <div class="modal-hd">
        <h3 class="modal-title" id="profileModalTitle">個人資訊</h3>
        <button class="modal-close" type="button" id="btnCloseProfileModal" aria-label="關閉">×</button>
      </div>
      <div class="modal-body">
        <div class="profile-row" id="profileCommunityItem" hidden>
          <div class="profile-value community" id="profileCommunityText">—</div>
          <div class="profile-value" id="profileRole">—</div>
        </div>
        <div class="profile-item">
          <div class="profile-avatar">
            <img id="profileAvatarImg" alt="" />
            <span class="user-avatar-fallback" id="profileAvatarFallback" aria-hidden="true">U</span>
            <button type="button" class="avatar-edit-btn" id="btnEditAvatar" aria-label="更換大頭照" title="更換大頭照">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 20h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </button>
            <input type="file" id="profileAvatarFile" accept="image/*" hidden />
          </div>
        </div>
        <div class="profile-item">
          <div class="profile-label">姓名</div>
          <div class="profile-value" id="profileNameText">—</div>
        </div>
        <div class="profile-item" id="profileHouseNoItem">
          <div class="profile-label">戶號</div>
          <div class="profile-value" id="profileHouseNoText">—</div>
        </div>
        <div class="status" id="profileStatus" hidden></div>
      </div>
      <div class="modal-ft">
        <div class="profile-switch" id="profileSwitch" hidden></div>
        <button class="btn" type="button" id="btnCloseProfileModalFt">關閉</button>
        <button class="btn btn-primary" type="button" id="btnSignOut">登出</button>
      </div>
    </div>
  </div>

  <div class="modal" id="imageModal" hidden>
    <div class="modal-backdrop" data-modal-close="1"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" style="max-width:90vw; width:90vw; max-height:90vh;">
      <div class="modal-hd">
        <h3 class="modal-title" id="imageModalTitle">圖片</h3>
        <button class="modal-close" type="button" id="btnCloseImageModal" aria-label="關閉">×</button>
      </div>
      <div class="modal-body" style="padding:0; display:flex; justify-content:center; align-items:center; max-height:70vh; overflow:auto;">
        <div id="imageModalContent" style="width:100%;"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/pdf-viewer-launcher.js?v=3"></script>
  <script src="js/bulletin-clean.js?v=3"></script>
  <script src="js/ads-footer.js?v=5"></script>
  <script src="js/pwa.js?v=4"></script>
</body>
</html>
