<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>清潔人員｜社區系統</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=4" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />
    <link rel="stylesheet" href="css/worker-clean.css?v=17" />
    <link rel="stylesheet" href="css/pwa.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <!-- 橫屏鎖定提示 -->
    <div class="wc-rotate-lock" id="rotateLock">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="7" y="2.5" width="10" height="19" rx="2.2" stroke="currentColor" stroke-width="1.8"/>
        <path d="M10.5 5.5h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M4 8.5A7.2 7.2 0 0 1 3.2 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M20 8.5a7.2 7.2 0 0 1 .8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <div class="t">請將手機轉為直式</div>
      <div class="s">本頁面僅支援直屏使用，以確保操作正確</div>
    </div>

    <div class="wc-layout">
      <header class="wc-hd">
        <div class="wc-hd-row">
          <div class="wc-brand">
            <img src="logo.svg?v=4" alt="" />
            <div class="meta">
              <div class="title">清潔人員</div>
              <div class="sub" id="wcCommunityName">社區智慧系統平台</div>
            </div>
          </div>
          <div class="header-actions">
            <button class="user-avatar" type="button" id="btnUserChip" aria-label="使用者選單" aria-haspopup="true" aria-expanded="false">
              <span class="user-greet" id="wcUserName">未登入</span>
              <img class="user-avatar-img" id="wcAvatarImg" alt="" />
              <span class="user-avatar-fallback" id="wcAvatar" aria-hidden="true">清</span>
            </button>
          </div>
        </div>
      </header>

      <main class="wc-bd" id="wcBody">
        <div class="wc-empty">載入中…</div>
      </main>

      <nav class="wc-ft" id="wcNav">
        <button class="wc-nav-btn" type="button" data-wc-tab="punch" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 7.6V12l3 1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>首頁</span>
        </button>
        <button class="wc-nav-btn" type="button" data-wc-tab="clean">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 20h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M9 20V9.5l3-2 3 2V20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M13.6 3.2 17 6.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M12.6 8.6h1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>清潔</span>
        </button>
        <button class="wc-nav-btn" type="button" data-wc-tab="patrol">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8.5 4.5h7a1.5 1.5 0 0 1 1.5 1.5v12.5a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 18.5V6a1.5 1.5 0 0 1 1.5-1.5Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M10 4.5V3.8A.8.8 0 0 1 10.8 3h2.4a.8.8 0 0 1 .8.8v.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="m9.8 11.2 1.5 1.5 3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9.8 16h4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>巡邏</span>
        </button>
        <button class="wc-nav-btn" type="button" data-wc-tab="leave">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6.5 3.5h7l4 4v13a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M13 3.5V8h4.5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M12 12.5v4M10 14.5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>請假補卡</span>
        </button>
        <button class="wc-nav-btn" type="button" data-wc-tab="record">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="4" width="14" height="16.5" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8.5 9h7M8.5 12.5h7M8.5 16h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>紀錄</span>
        </button>
      </nav>
    </div>

    <!-- 個人資訊（與社區前台相同格式） -->
    <div class="modal" id="profileModal" hidden>
      <div class="modal-backdrop" data-wc-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
        <div class="modal-hd">
          <h3 class="modal-title" id="profileModalTitle">個人資訊</h3>
          <button class="modal-close" type="button" id="wcProfileClose" aria-label="關閉">×</button>
        </div>
        <form id="wcProfileForm">
          <div class="modal-body">
            <div class="profile-row" id="profileCommunityItem">
              <div class="profile-value community" id="profileCommunityText">—</div>
              <div class="profile-value" id="profileRole">—</div>
            </div>
            <div class="profile-item">
              <div class="profile-avatar">
                <img id="profileAvatarImg" alt="" />
                <span class="user-avatar-fallback" id="profileAvatarFallback" aria-hidden="true">清</span>
              </div>
            </div>
            <div class="profile-item">
              <div class="profile-label">姓名</div>
              <div class="profile-value" id="profileNameText">—</div>
            </div>
            <div style="width:100%;">
              <div style="font-size:12px;font-weight:800;color:rgba(31,41,55,.65);text-align:left;margin-bottom:6px;">帳號資訊</div>
              <div class="wc-info" style="text-align:left;">
                <div class="r"><span class="k">登入帳號</span><span class="v" id="profileAccountText">—</span></div>
                <div class="r"><span class="k">手機</span><span class="v" id="profilePhoneText">—</span></div>
              </div>
            </div>
            <div style="width:100%;">
              <div style="font-size:12px;font-weight:800;color:rgba(31,41,55,.65);text-align:left;margin-bottom:6px;">今日出勤紀錄</div>
              <div class="wc-info" style="text-align:left;">
                <div class="r"><span class="k">上班</span><span class="v" id="profileInText">—</span></div>
                <div class="r"><span class="k">下班</span><span class="v" id="profileOutText">—</span></div>
              </div>
            </div>
            <div class="status" id="profileStatus" hidden></div>
          </div>
          <div class="modal-ft">
            <button class="btn" type="button" id="wcProfileCloseFt">關閉</button>
            <button class="btn btn-primary" type="button" id="wcProfileSignOut">登出</button>
          </div>
        </form>
      </div>
    </div>

    <div class="wc-toast" id="wcToast" role="status" aria-live="polite"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/punch-flow.js?v=4"></script>
    <script src="js/worker-duty.js?v=26"></script>
    <script src="js/worker-clean.js?v=35"></script>
    <script src="js/pwa.js?v=14"></script>
  </body>
</html>
