<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>社區服務系統平台｜登入</title>
    <link id="appIcon" rel="icon" type="image/svg+xml" href="" />
    <style>
      :root {
        --brand: #d32f2f;
        --bg: #f2f3f5;
        --panel: #ffffff;
        --panel-2: #f9fafb;
        --text: #1f2937;
        --muted: #6b7280;
        --border: rgba(17, 24, 39, 0.12);
        --shadow: 0 16px 40px rgba(17, 24, 39, 0.14);
        --radius: 18px;
        --radius-sm: 14px;
        --tap: 48px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      a { color: inherit; text-decoration: none; }
      button, input, select { font: inherit; }
      .mast {
        background: linear-gradient(135deg, #b71c1c 0%, #d32f2f 55%, #c62828 100%);
        color: #fff;
        padding: 54px 18px 86px;
        display: flex;
        justify-content: center;
      }
      .mast-inner {
        width: min(520px, 100%);
        text-align: center;
        display: grid;
        justify-items: center;
        gap: 10px;
      }
      .mark {
        width: 54px;
        height: 54px;
        display: grid;
        place-items: center;
        opacity: 0.95;
      }
      .mark svg {
        border-radius: 999px;
        background: #fff;
        padding: 4px;
      }
      .mast-title {
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 0.6px;
        line-height: 1.05;
      }
      .mast-sub {
        font-size: 16px;
        opacity: 0.92;
        letter-spacing: 0.2px;
      }
      .wrap {
        flex: 1;
        display: grid;
        place-items: start center;
        padding: 0 18px 44px;
      }
      .card {
        background: var(--panel);
        width: min(520px, 100%);
        margin-top: -58px;
        padding: 34px 28px;
        display: grid;
        gap: 18px;
        border-radius: 26px;
        border: 1px solid rgba(17, 24, 39, 0.08);
        box-shadow: 0 22px 60px rgba(17, 24, 39, 0.14);
      }
      .card h2 {
        margin: 0;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0.2px;
      }
      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      .form {
        display: grid;
        gap: 16px;
      }
      .field { display: grid; gap: 10px; }
      label { font-size: 14px; color: #4b5563; }
      .field-label-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .remember {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        user-select: none;
        color: #6b7280;
        font-size: 14px;
      }
      .remember input {
        width: 22px;
        height: 22px;
        accent-color: var(--brand);
      }
      input[type="text"], input[type="email"], input[type="password"], select {
        height: 56px;
        padding: 0 16px;
        border-radius: 16px;
        border: 2px solid rgba(17, 24, 39, 0.08);
        background: #fff;
        outline: none;
      }
      input:focus, select:focus {
        border-color: rgba(211, 47, 47, 0.42);
        box-shadow: 0 0 0 4px rgba(211, 47, 47, 0.14);
      }
      .input-wrap {
        position: relative;
        display: grid;
      }
      .input-wrap input {
        padding-right: 54px;
      }
      .icon-btn {
        position: absolute;
        top: 50%;
        right: 10px;
        transform: translateY(-50%);
        width: 40px;
        height: 40px;
        border-radius: 14px;
        border: 0;
        background: transparent;
        cursor: pointer;
        display: grid;
        place-items: center;
        color: #9ca3af;
      }
      .icon-btn:hover { background: rgba(17, 24, 39, 0.05); }
      .actions {
        display: grid;
        gap: 12px;
        margin-top: 6px;
      }
      .btn {
        height: 56px;
        padding: 0 18px;
        border-radius: 18px;
        border: 2px solid rgba(17, 24, 39, 0.1);
        background: #fff;
        color: #374151;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }
      .btn:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(17, 24, 39, 0.12); }
      .btn-primary {
        background: var(--brand);
        border-color: rgba(0, 0, 0, 0);
        color: #fff;
      }
      .btn-primary:hover { box-shadow: 0 16px 34px rgba(211, 47, 47, 0.35); }
      .btn-outline {
        border-color: rgba(211, 47, 47, 0.55);
        color: #b91c1c;
        background: #fff;
      }
      .btn-outline:hover { box-shadow: 0 18px 36px rgba(211, 47, 47, 0.18); }
      .btn[disabled] { opacity: 0.6; cursor: not-allowed; }
      .status {
        padding: 12px 14px;
        border-radius: 16px;
        background: rgba(17, 24, 39, 0.03);
        border: 1px solid rgba(17, 24, 39, 0.06);
        color: #6b7280;
        font-size: 13px;
        line-height: 1.6;
        min-height: 44px;
      }
      .status.error {
        color: #9f1c1c;
        border-color: rgba(211, 47, 47, 0.24);
        background: rgba(211, 47, 47, 0.08);
      }
      @media (max-width: 420px) {
        .mast { padding: 46px 16px 78px; }
        .mast-title { font-size: 30px; }
        .card { padding: 28px 20px; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <header class="mast" aria-label="品牌區塊">
      <div class="mast-inner">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" style="width:46px;height:46px;">
            <path id="brandMark" d="M12 2.6c1.2 5.3 2.2 6.5 9.4 9.4-7.2 2.9-8.2 4.1-9.4 9.4-1.2-5.3-2.2-6.5-9.4-9.4 7.2-2.9 8.2-4.1 9.4-9.4Z" fill="#D32F2F"/>
          </svg>
        </div>
        <div class="mast-title" id="brandName">西北守護星</div>
        <div class="mast-sub" id="brandSlogan">西北好用心 住戶更安心</div>
      </div>
    </header>

    <main class="wrap" aria-label="登入頁面">
      <section class="card">
        <div>
          <h2>登入</h2>
        </div>

        <form class="form" id="loginForm">
          <div class="field">
            <div class="field-label-row">
              <label for="email">電子郵件或手機號碼</label>
              <label class="remember">
                <input type="checkbox" id="rememberMe" checked />
                記住我
              </label>
            </div>
            <input id="email" type="text" autocomplete="username" placeholder="" required />
          </div>

          <div class="field">
            <label for="password">密碼</label>
            <div class="input-wrap">
              <input id="password" type="password" autocomplete="current-password" placeholder="" required />
              <button class="icon-btn" type="button" id="btnTogglePassword" aria-label="顯示或隱藏密碼">
                <svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px;">
                  <path d="M2.2 12s3.5-6.7 9.8-6.7S21.8 12 21.8 12s-3.5 6.7-9.8 6.7S2.2 12 2.2 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                  <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" stroke="currentColor" stroke-width="1.7"/>
                </svg>
              </button>
            </div>
          </div>

          <div id="status" class="status" role="status" aria-live="polite">請輸入帳號密碼後登入。</div>

          <div class="actions">
            <button class="btn btn-primary" type="submit" id="btnLogin">登入</button>
            <button class="btn btn-outline" type="button" id="btnApply">申請帳號</button>
          </div>
        </form>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCRvuSL6t3RS5_523CGd3gxJgdRDuDXFvQ",
        authDomain: "nw-app-v2.firebaseapp.com",
        projectId: "nw-app-v2",
        storageBucket: "nw-app-v2.firebasestorage.app",
        messagingSenderId: "448152056602",
        appId: "1:448152056602:web:3ed9e5d9ed04d541cf32a3",
        measurementId: "G-G2ZD312B6V",
      };

      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();

      const BRAND_STORAGE_KEY = "nw_brand_v1";
      const DEFAULT_BRAND = Object.freeze({
        name: "西北守護星",
        slogan: "西北好用心 住戶更安心",
        logoPathD: "M12 2.6c1.2 5.3 2.2 6.5 9.4 9.4-7.2 2.9-8.2 4.1-9.4 9.4-1.2-5.3-2.2-6.5-9.4-9.4 7.2-2.9 8.2-4.1 9.4-9.4Z",
      });

      function loadBrand() {
        try {
          const raw = localStorage.getItem(BRAND_STORAGE_KEY);
          if (!raw) return DEFAULT_BRAND;
          const parsed = JSON.parse(raw);
          const name = parsed && typeof parsed.name === "string" && parsed.name.trim() ? parsed.name.trim() : DEFAULT_BRAND.name;
          const slogan = parsed && typeof parsed.slogan === "string" && parsed.slogan.trim() ? parsed.slogan.trim() : DEFAULT_BRAND.slogan;
          const logoPathD =
            parsed && typeof parsed.logoPathD === "string" && parsed.logoPathD.trim()
              ? parsed.logoPathD.trim()
              : DEFAULT_BRAND.logoPathD;
          return { name, slogan, logoPathD };
        } catch {
          return DEFAULT_BRAND;
        }
      }

      function applyBrand() {
        const brand = loadBrand();
        const nameEl = document.getElementById("brandName");
        const sloganEl = document.getElementById("brandSlogan");
        const markEl = document.getElementById("brandMark");
        if (nameEl) nameEl.textContent = brand.name;
        if (sloganEl) sloganEl.textContent = brand.slogan;
        if (markEl) markEl.setAttribute("d", brand.logoPathD);

        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="white"/><path fill="#D32F2F" d="${brand.logoPathD}"/></svg>`;
        const href = `data:image/svg+xml,${encodeURIComponent(svg)}`;
        const iconEl = document.getElementById("appIcon");
        if (iconEl) iconEl.setAttribute("href", href);
      }

      window.setBrand = (next) => {
        localStorage.setItem(BRAND_STORAGE_KEY, JSON.stringify(next || {}));
        location.reload();
      };

      applyBrand();

      const routes = Object.freeze({
        admin: "system.html",
        community: "admin.html#community/community-dashboard",
        resident: "member.html",
      });

      const statusEl = document.getElementById("status");
      const loginForm = document.getElementById("loginForm");
      const btnLogin = document.getElementById("btnLogin");
      const rememberEl = document.getElementById("rememberMe");
      const btnApply = document.getElementById("btnApply");
      const btnTogglePassword = document.getElementById("btnTogglePassword");

      function setStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.classList.toggle("error", Boolean(isError));
      }

      function setBusy(isBusy) {
        btnLogin.disabled = Boolean(isBusy);
      }

      function goTo(url) {
        window.location.href = String(url || "index.html");
      }

      if (btnApply) {
        btnApply.addEventListener("click", () => {
          setStatus("請聯絡管理員申請帳號。", false);
        });
      }

      if (btnTogglePassword) {
        btnTogglePassword.addEventListener("click", () => {
          const input = document.getElementById("password");
          if (!input) return;
          input.type = input.type === "password" ? "text" : "password";
        });
      }

      function normalizeRole(input) {
        const r = String(input || "").trim().toLowerCase();
        if (r === "admin" || r === "community" || r === "resident") return r;
        return "";
      }

      function inferRoleFromEmail(email) {
        const e = String(email || "").trim().toLowerCase();
        if (!e) return "";
        if (e.includes("admin") || e.includes("system") || e.includes("sys")) return "admin";
        if (e.includes("community") || e.includes("comm")) return "community";
        if (e.includes("resident") || e.includes("member")) return "resident";
        return "resident";
      }

      async function resolveRole(user, emailHint) {
        try {
          const token = await user.getIdTokenResult();
          const claimRole = normalizeRole(token && token.claims ? token.claims.role : "");
          if (claimRole) return claimRole;
          const claimRoles = token && token.claims ? token.claims.roles : null;
          if (Array.isArray(claimRoles)) {
            const found = claimRoles.map(normalizeRole).find(Boolean);
            if (found) return found;
          }
        } catch {}
        return inferRoleFromEmail(emailHint || (user ? user.email : ""));
      }

      function adminPickDestination() {
        const raw = window.prompt(
          "系統管理員：請選擇要進入的頁面\n1) 系統設定（system）\n2) 社區後台（admin）\n3) 住戶前台（member）",
          "1"
        );
        const v = String(raw || "").trim();
        if (v === "2") return { role: "community", url: routes.community };
        if (v === "3") return { role: "resident", url: routes.resident };
        return { role: "admin", url: routes.admin };
      }

      let didAutoRedirect = false;

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        setBusy(true);
        setStatus("登入中...", false);

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
          const remember = Boolean(rememberEl && rememberEl.checked);
          const persistence = remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;
          await auth.setPersistence(persistence);
          const cred = await auth.signInWithEmailAndPassword(email, password);
          const user = cred && cred.user ? cred.user : auth.currentUser;
          const role = await resolveRole(user, email);

          if (role === "admin") {
            const picked = adminPickDestination();
            sessionStorage.setItem("csp_role", picked.role);
            setStatus("登入成功，導向中...", false);
            goTo(picked.url);
            return;
          }

          const url = routes[role] || routes.resident;
          sessionStorage.setItem("csp_role", role);
          setStatus("登入成功，導向中...", false);
          goTo(url);
        } catch (err) {
          const code = String(err && err.code ? err.code : "");
          const msg =
            code === "auth/invalid-credential" ? "帳號或密碼錯誤。" :
            code === "auth/user-not-found" ? "找不到此帳號。" :
            code === "auth/wrong-password" ? "密碼錯誤。" :
            code === "auth/too-many-requests" ? "嘗試次數過多，請稍後再試。" :
            "登入失敗，請確認帳號密碼。";
          setStatus(msg, true);
        } finally {
          setBusy(false);
        }
      });

      auth.onAuthStateChanged((user) => {
        const clock = document.getElementById("clock");
        const now = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        if (clock) clock.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
        if (!user || didAutoRedirect) return;
        didAutoRedirect = true;
        (async () => {
          const role = await resolveRole(user, user.email);
          if (role === "admin") {
            const picked = adminPickDestination();
            sessionStorage.setItem("csp_role", picked.role);
            goTo(picked.url);
            return;
          }
          const url = routes[role] || routes.resident;
          sessionStorage.setItem("csp_role", role);
          goTo(url);
        })();
      });
    </script>
  </body>
</html>
