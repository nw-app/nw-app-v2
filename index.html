<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>社區服務系統平台｜登入</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/pwa.css" />
  </head>
  <body>
    <main class="wrap" aria-label="登入頁面">
      <header class="mast" aria-label="品牌區塊">
        <div class="mast-inner">
          <div class="mark" aria-hidden="true">
            <img src="logo.svg" alt="" />
          </div>
          <div class="mast-title">Qai守護星</div>
          <div class="mast-sub">西北好用心 住戶更安心</div>
        </div>
      </header>
      <section class="card">
        <div>
          <h2>登入</h2>
        </div>

        <form class="form" id="loginForm">
          <div class="field">
            <div class="field-label-row">
              <label for="email">電子郵件或手機號碼</label>
              <label class="remember">
                <input type="checkbox" id="rememberMe" checked />
                記住我
              </label>
            </div>
            <input id="email" type="text" autocomplete="username" placeholder="" required />
          </div>

          <div class="field">
            <label for="password">密碼</label>
            <div class="input-wrap">
              <input id="password" type="password" autocomplete="current-password" placeholder="" required />
              <button class="icon-btn" type="button" id="btnTogglePassword" aria-label="顯示或隱藏密碼">
                <svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px;">
                  <path d="M2.2 12s3.5-6.7 9.8-6.7S21.8 12 21.8 12s-3.5 6.7-9.8 6.7S2.2 12 2.2 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                  <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" stroke="currentColor" stroke-width="1.7"/>
                </svg>
              </button>
            </div>
          </div>

          <div id="status" class="status" role="status" aria-live="polite">請輸入帳號密碼後登入。</div>

          <div class="actions">
            <button class="btn btn-primary" type="submit" id="btnLogin">登入</button>
            <button class="btn btn-outline" type="button" id="btnApply">申請帳號</button>
          </div>
        </form>
      </section>
    </main>
    <div class="modal-backdrop" id="adminModalBackdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-label="選擇登入頁面">
        <h3>選擇登入頁面</h3>
        <p>此帳號為系統管理員，請選擇要進入的介面。</p>
        <div class="modal-actions">
          <button class="btn btn-primary" type="button" data-admin-go="system">系統設定</button>
          <button class="btn btn-outline" type="button" data-admin-go="admin">社區後台</button>
          <button class="btn" type="button" data-admin-go="member">住戶前台</button>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/index.js?v=6"></script>
    <script src="js/pwa.js?v=3"></script>
  </body>
</html>
