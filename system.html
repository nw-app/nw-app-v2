<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>系統管理員｜系統社區設定</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="css/system.css" />
    <link rel="stylesheet" href="css/pwa.css" />
  </head>
  <body>
    <div class="layout">
      <header class="frame-hd">
        <div class="frame-hd-row">
          <div class="frame-brand">
            <img src="logo.svg" alt="" />
            <div class="meta">
              <div class="title">Qai守護星</div>
              <div class="sub" id="communityNameSub">系統管理員</div>
            </div>
          </div>
          <button class="user-avatar" type="button" id="btnUserMenu" aria-label="使用者選單" aria-haspopup="true" aria-expanded="false">
            <span class="user-greet" id="userGreeting">Hi~</span>
            <img class="user-avatar-img" id="userAvatarImg" alt="" />
            <span class="user-avatar-fallback" id="userAvatarFallback" aria-hidden="true">U</span>
          </button>
        </div>
      </header>

      <div class="frame-midtop" aria-label="頁中上">
        <div class="frame-title">
          <div id="pageTitle" class="page-title" role="heading" aria-level="1" hidden aria-hidden="true">帳號開通</div>
          <p id="pageSubtitle" hidden aria-hidden="true">管理社區與住戶的登入帳號開通狀態（示意）</p>
          <div class="area-filter" id="areaFilter" hidden></div>
        </div>
      </div>

      <main class="frame-bd">
        <section class="content" id="content" aria-live="polite"></section>
      </main>

      <footer class="frame-ft" aria-label="系統管理員選單">
        <nav class="nav" id="nav">
          <button type="button" data-page="accounts" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M8.5 12.2a3.2 3.2 0 1 0-3.2-3.2 3.2 3.2 0 0 0 3.2 3.2Z" stroke="rgba(31,41,55,0.85)" stroke-width="1.7"/>
              <path d="M18 11.3a2.8 2.8 0 1 0-2.8-2.8 2.8 2.8 0 0 0 2.8 2.8Z" stroke="rgba(31,41,55,0.85)" stroke-width="1.7" opacity="0.95"/>
              <path d="M3.5 20a6 6 0 0 1 10.5-3.8" stroke="rgba(31,41,55,0.85)" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M14 20a4.8 4.8 0 0 1 9.5-1.2" stroke="rgba(31,41,55,0.85)" stroke-width="1.7" stroke-linecap="round" opacity="0.95"/>
            </svg>
            <span class="label">帳號</span>
            <span class="hint">Auth</span>
          </button>
          <button type="button" data-page="community" aria-current="false">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4.5 10.3 12 5.7l7.5 4.6" stroke="rgba(31,41,55,0.85)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6.2 10.3V19h11.6v-8.7" stroke="rgba(31,41,55,0.85)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9 19v-5.3h6V19" stroke="rgba(31,41,55,0.85)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="label">社區</span>
            <span class="hint">App</span>
          </button>
          <button type="button" data-page="links" aria-current="false">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M10.5 13.5 8 16a3 3 0 0 1-4.2-4.2l2.5-2.5" stroke="rgba(31,41,55,0.85)" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M13.5 10.5 16 8a3 3 0 0 1 4.2 4.2l-2.5 2.5" stroke="rgba(31,41,55,0.85)" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M9.5 14.5 14.5 9.5" stroke="rgba(31,41,55,0.85)" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <span class="label">連結</span>
            <span class="hint">UI</span>
          </button>
        </nav>
      </footer>
    </div>

    <template id="tplLinks">
      <div class="grid">
        <section class="card">
          <div class="card-hd">
            <div>
              <h2>社區後台按鈕</h2>
              <p>控制社區後台入口（啟用/停用/連結）</p>
            </div>
            <span class="tag red">社區</span>
          </div>
          <div class="card-bd">
            <div class="form" id="communityLinks"></div>
          </div>
        </section>

        <section class="card">
          <div class="card-hd">
            <div>
              <h2>住戶前台按鈕</h2>
              <p>控制住戶前台入口（啟用/停用/連結）</p>
            </div>
            <span class="tag">住戶</span>
          </div>
          <div class="card-bd">
            <div class="form" id="residentLinks"></div>
          </div>
        </section>
      </div>

      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
        <button class="btn" type="button" id="btnSaveLinks">儲存設定</button>
      </div>

      <div class="status" id="linksStatus" style="margin-top:12px;">提示：連結支援 #community/parcel 或 #resident/resident-bulletin 或 https://...（示意）。</div>
    </template>

    <template id="tplAccounts">
      <div class="grid grid-1">
        <section class="card">
          <div class="card-hd">
            <div>
              <h2><span class="community-area-label" id="communityAreaName">全部</span><span>帳號列表</span></h2>
            </div>
            <button class="btn btn-primary" type="button" id="btnAddResident">新增帳號</button>
          </div>
          <div class="card-bd">
            <div class="field" id="field_accounts_community">
              <label for="r_community">所屬社區</label>
              <select id="r_community"></select>
            </div>
            <div class="list" id="residentList" style="margin-top:12px;"></div>

            <div class="modal" id="residentModal" hidden>
              <div class="modal-backdrop" data-modal-close="1"></div>
              <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="residentModalTitle">
                <div class="modal-hd">
                  <h3 class="modal-title" id="residentModalTitle">新增 <span class="community-area-label" id="residentRoleName">住戶</span> 帳號</h3>
                  <button class="modal-close" type="button" id="btnCloseResidentModal" aria-label="關閉">×</button>
                </div>
                <form id="residentModalForm">
                  <div class="modal-body">
                    <div class="image-uploader avatar-uploader" id="residentAvatarUploader" role="button" tabindex="0" aria-label="上傳大頭照">
                      <img class="image-preview avatar-preview" id="residentAvatarPreview" alt="" />
                      <div class="image-placeholder" id="residentAvatarPlaceholder">上傳大頭照</div>
                      <input id="residentAvatarInput" type="file" accept="image/*" hidden />
                    </div>
                    <div class="field" id="field_r_category">
                      <label for="modal_r_category">類別</label>
                      <select id="modal_r_category" required>
                        <option value="住戶" selected>住戶</option>
                        <option value="委員">委員</option>
                      </select>
                    </div>
                    <div class="field" id="field_r_community">
                      <label for="modal_r_community">所屬社區</label>
                      <select id="modal_r_community" required></select>
                    </div>
                    <div class="field" id="field_r_unit">
                      <label for="modal_r_unit">戶號</label>
                      <div class="input-wrap">
                        <input id="modal_r_unit" class="has-suffix" type="text" placeholder="例：A-1203" autocomplete="off" required />
                        <span class="input-suffix ok" id="unitMatchBadge" hidden aria-hidden="true" style="display:none;">
                          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M20 6.5 10 17.5 4 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                          </svg>
                          <span>有此戶號</span>
                        </span>
                      </div>
                    </div>
                    <div class="field">
                      <label for="modal_r_name">姓名</label>
                      <input id="modal_r_name" type="text" placeholder="例：林小姐" autocomplete="off" required />
                    </div>
                    <div class="field">
                      <label for="modal_r_email">電子郵件（登入帳號）</label>
                      <input id="modal_r_email" type="email" placeholder="例：a1203@example.com" autocomplete="username" required />
                    </div>
                    <div class="field">
                      <label for="modal_r_phone">手機號碼（登入帳號）</label>
                      <input id="modal_r_phone" type="tel" placeholder="例：0912345678" autocomplete="tel" required />
                    </div>
                    <div class="field">
                      <label for="modal_r_password">預設密碼（不填則使用手機號碼）</label>
                      <input id="modal_r_password" type="text" placeholder="例：0912345678" autocomplete="off" />
                    </div>
                    <div class="field" id="field_r_address">
                      <label for="modal_r_address">地址</label>
                      <input id="modal_r_address" type="text" placeholder="例：台北市..." autocomplete="street-address" />
                    </div>
                    <div class="field" id="field_r_roles">
                      <label>住戶角色</label>
                      <div class="check-grid" id="modal_r_roles">
                        <label class="check"><input type="checkbox" value="區權人" />區權人</label>
                        <label class="check"><input type="checkbox" value="區權人家屬" />區權人家屬</label>
                        <label class="check"><input type="checkbox" value="承租戶" />承租戶</label>
                        <label class="check"><input type="checkbox" value="其他" id="modal_r_role_other_chk" />其他</label>
                      </div>
                      <input id="modal_r_role_other_text" type="text" placeholder="自定義角色" autocomplete="off" hidden />
                    </div>
                    <div class="field">
                      <label for="modal_r_enabled">狀態</label>
                      <select id="modal_r_enabled" required>
                        <option value="true" selected>啟用</option>
                        <option value="false">停用</option>
                      </select>
                    </div>
                    <div class="status" id="residentModalStatus" hidden></div>
                  </div>
                  <div class="modal-ft">
                    <button class="btn" type="button" id="btnCancelResidentModal">取消</button>
                    <button class="btn btn-primary" type="submit" id="btnSubmitResidentModal">建立</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </section>
      </div>
    </template>

    <template id="tplCommunity">
      <div class="grid grid-1">
        <section class="card">
          <div class="card-hd">
            <div>
              <h2><span class="community-area-label" id="communityAreaName">全部</span><span>社區列表</span></h2>
            </div>
            <button class="btn btn-primary" type="button" id="btnAddCommunity">新增社區</button>
          </div>
          <div class="card-bd">
            <div class="list" id="communityList" style="margin-top:12px;"></div>

            <div class="modal" id="communityModal" hidden>
              <div class="modal-backdrop" data-modal-close="1"></div>
              <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="communityModalTitle">
                <div class="modal-hd">
                  <h3 class="modal-title" id="communityModalTitle">新增社區</h3>
                  <button class="modal-close" type="button" id="btnCloseCommunityModal" aria-label="關閉">×</button>
                </div>
                <form id="communityModalForm">
                  <div class="modal-body">
                    <div class="image-uploader" id="communityImageUploader" role="button" tabindex="0" aria-label="上傳社區圖片">
                      <img class="image-preview" id="communityImagePreview" alt="" />
                      <div class="image-placeholder" id="communityImagePlaceholder">上傳社區圖片（2:1）</div>
                      <input id="communityImageInput" type="file" accept="image/*" hidden />
                    </div>
                    <div class="field">
                      <label for="modal_c_name">社區名稱</label>
                      <input id="modal_c_name" type="text" placeholder="例：新社區" autocomplete="off" required />
                    </div>
                    <div class="field">
                      <label for="modal_c_code">社區代號</label>
                      <input id="modal_c_code" type="text" placeholder="例：c003" autocomplete="off" required />
                    </div>
                    <div class="field">
                      <label for="modal_c_level">社區級別</label>
                      <select id="modal_c_level" required>
                        <option value="金">金</option>
                        <option value="銀">銀</option>
                        <option value="銅" selected>銅</option>
                      </select>
                    </div>
                    <div class="field">
                      <label for="modal_c_area">區域</label>
                      <select id="modal_c_area" required>
                        <option value="台北">台北</option>
                        <option value="新北">新北</option>
                        <option value="桃園">桃園</option>
                      </select>
                    </div>
                    <div class="status" id="communityModalStatus" hidden></div>
                  </div>
                  <div class="modal-ft">
                    <button class="btn" type="button" id="btnCancelCommunityModal">取消</button>
                    <button class="btn btn-primary" type="submit" id="btnSubmitCommunityModal">建立</button>
                  </div>
                </form>
              </div>
            </div>

            <div class="modal" id="unitModal" hidden>
              <div class="modal-backdrop" data-modal-close="1"></div>
              <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="unitModalTitle">
                <div class="modal-hd">
                  <div class="unit-tabs" role="tablist" aria-label="社區設定">
                    <button class="unit-tab-btn" type="button" data-unit-tab="units" role="tab" aria-selected="true">戶號</button>
                    <button class="unit-tab-btn" type="button" data-unit-tab="features" role="tab" aria-selected="false">功能</button>
                    <button class="unit-tab-btn" type="button" data-unit-tab="row-a" role="tab" aria-selected="false">圖覽</button>
                    <button class="unit-tab-btn" type="button" data-unit-tab="row-b" role="tab" aria-selected="false">呼叫</button>
                    <button class="unit-tab-btn" type="button" data-unit-tab="row-d" role="tab" aria-selected="false">社紐</button>
                    <button class="unit-tab-btn" type="button" data-unit-tab="row-f" role="tab" aria-selected="false">生紐</button>
                    <button class="unit-tab-btn" type="button" data-unit-tab="service" role="tab" aria-selected="false">客服</button>
                  </div>
                  <button class="modal-close" type="button" id="btnCloseUnitModal" aria-label="關閉">×</button>
                </div>
                <form id="unitModalForm">
                  <div class="modal-body">
                    <div class="unit-modal-header-info">
                      <h3 class="modal-title" id="unitModalTitle"><span id="unitModalTitleText">戶號列表</span></h3>
                      <div class="unit-totals-summary" id="unitTotalsSummary">
                        <span id="totalUnitsCount">總戶數：0</span>
                        <span id="totalAreaSum">總坪數：0</span>
                        <span id="totalOwnershipSum">總比例：0%</span>
                      </div>
                    </div>
                    <div class="unit-tab-panel" data-unit-panel="units" role="tabpanel">
                      <div class="field" style="margin-bottom: 0;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                          <label style="margin-bottom: 0;">戶號資料列表</label>
                          <div style="display: flex; gap: 8px;">
                            <button class="btn btn-sm" type="button" id="btnExportUnits">匯出 Excel</button>
                            <button class="btn btn-sm" type="button" id="btnImportUnits">匯入 Excel</button>
                            <input type="file" id="inputImportUnits" accept=".xlsx, .xls, .csv" hidden />
                            <button class="btn btn-sm btn-primary" type="button" id="btnAddUnitRow">+ 新增行</button>
                          </div>
                        </div>
                        <div class="units-table-container">
                          <table class="units-table">
                            <thead>
                              <tr>
                                <th style="width: 100px;">戶號</th>
                                <th>地址</th>
                                <th style="width: 100px;">坪數</th>
                                <th style="width: 120px;">所有權人%</th>
                                <th style="width: 50px;"></th>
                              </tr>
                            </thead>
                            <tbody id="unitsTableBody"></tbody>
                          </table>
                        </div>
                      </div>
                    </div>

                    <div class="unit-tab-panel" data-unit-panel="features" role="tabpanel" hidden>
                      <div class="field">
                        <label>社區後台功能（勾選才會顯示與開放使用）</label>
                        <div class="feature-head">
                          <label class="check check-all"><input type="checkbox" id="unitFeatureAll" />全選</label>
                        </div>
                        <div class="check-grid" id="unitFeatureList"></div>
                      </div>
                    </div>

                    <div class="unit-tab-panel" data-unit-panel="row-a" role="tabpanel" hidden>
                      <div class="field">
                        <label>圖片瀏覽設定</label>
                        <div class="carousel-settings">
                          <div class="field">
                            <label for="modal_rowa_interval">輪播時間 (秒)</label>
                            <input id="modal_rowa_interval" type="number" min="1" max="60" placeholder="預設 5" />
                          </div>
                          <div id="rowAImageList" class="image-settings-list">
                            <!-- JS will generate 8 image slots here -->
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="unit-tab-panel" data-unit-panel="row-b" role="tabpanel" hidden>
                      <div class="field">
                        <label>SOS按鈕設定</label>
                        <p class="muted">設定緊急求助按鈕的對應窗口與功能（示意）</p>
                      </div>
                    </div>
                    <div class="unit-tab-panel" data-unit-panel="row-d" role="tabpanel" hidden>
                      <div class="field">
                        <label>社區服務按鈕設定 (8個)</label>
                        <div id="rowDButtonList" class="button-settings-list">
                          <!-- JS will generate 8 button slots here -->
                        </div>
                      </div>
                    </div>
                    <div class="unit-tab-panel" data-unit-panel="row-f" role="tabpanel" hidden>
                      <div class="field">
                        <label>生活服務按鈕設定 (8個)</label>
                        <div id="rowFButtonList" class="button-settings-list">
                          <!-- JS will generate 8 button slots here -->
                        </div>
                      </div>
                    </div>
                    <div class="unit-tab-panel" data-unit-panel="service" role="tabpanel" hidden>
                      <div class="field">
                        <label>客服連結設定</label>
                        <div class="field">
                          <label for="modal_service_url">客服中心網址</label>
                          <input id="modal_service_url" type="text" placeholder="https://..." />
                          <p class="muted">設定點擊頁尾「客服」按鈕時開啟的網頁連結</p>
                        </div>
                      </div>
                    </div>
                    <div class="status" id="unitModalStatus" hidden></div>
                  </div>
                  <div class="modal-ft">
                    <button class="btn" type="button" id="btnCancelUnitModal">取消</button>
                    <button class="btn btn-primary" type="submit" id="btnSubmitUnitModal">儲存</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </section>
      </div>
    </template>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/system.js"></script>
    <script src="js/pwa.js?v=3"></script>

    <div class="modal" id="profileModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
        <div class="modal-hd">
          <h3 class="modal-title" id="profileModalTitle">個人資訊</h3>
          <button class="modal-close" type="button" id="btnCloseProfileModal" aria-label="關閉">×</button>
        </div>
        <form id="profileForm">
          <div class="modal-body">
            <div class="profile-row" id="profileCommunityItem" hidden>
              <div class="profile-value community" id="profileCommunityText">—</div>
              <div class="profile-value" id="profileRole">—</div>
            </div>
            <div class="profile-item">
              <div class="profile-avatar">
                <img id="profileAvatarImg" alt="" />
                <span class="user-avatar-fallback" id="profileAvatarFallback" aria-hidden="true">U</span>
                <button type="button" class="avatar-edit-btn" id="btnEditAvatar" aria-label="更換大頭照" title="更換大頭照">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 20h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                  </svg>
                </button>
                <input type="file" id="profileAvatarFile" accept="image/*" hidden />
              </div>
            </div>
            <div class="profile-item">
              <div class="profile-label">姓名</div>
              <div class="profile-value" id="profileNameText">—</div>
            </div>
            <div class="profile-item" id="profileHouseNoItem">
              <div class="profile-label">戶號</div>
              <div class="profile-value" id="profileHouseNoText">—</div>
            </div>
            <div class="status" id="profileStatus" hidden></div>
          </div>
          <div class="modal-ft">
            <div class="profile-switch" id="profileSwitch" hidden></div>
            <button class="btn" type="button" id="btnCloseProfileModalFt">關閉</button>
            <button class="btn btn-primary" type="button" id="btnSignOut">登出</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
