<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>訪客登記｜社區系統</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=5" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />
    <link rel="stylesheet" href="css/parcel.css?v=3" />
    <link rel="stylesheet" href="css/ads-footer.css?v=16" />
    <link rel="stylesheet" href="css/pwa.css" />
    <style>
      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 999px;
        border: 0;
        outline: 0;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        flex: 0 0 auto;
        transition: background 140ms ease, transform 140ms ease, box-shadow 140ms ease;
        box-shadow: 0 6px 14px rgba(17, 24, 39, 0.08);
      }
      .icon-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(17, 24, 39, 0.12); }
      .icon-btn:active { transform: translateY(0); }
      .icon-btn svg { width: 18px; height: 18px; stroke-width: 2; fill: none; stroke: #fff; }
      .icon-btn--primary { background: rgba(46, 125, 50, 0.88); }
      .icon-btn--primary:hover { background: rgba(39, 103, 42, 0.95); }
      .icon-btn--danger { background: rgba(185, 28, 28, 0.9); }
      .icon-btn--danger:hover { background: rgba(153, 27, 27, 0.95); }
      .icon-btn--edit { background: rgba(37, 99, 235, 0.9); }
      .icon-btn--edit:hover { background: rgba(29, 78, 216, 0.95); }
      .icon-btn:disabled { opacity: 0.55; filter: saturate(0.7); cursor: not-allowed; box-shadow: 0 2px 6px rgba(17, 24, 39, 0.10); }
      .icon-btn:disabled:hover { transform: none; box-shadow: 0 2px 6px rgba(17, 24, 39, 0.10); }
      .status-pending { display:inline-flex; align-items:center; height:24px; padding:0 10px; border-radius:999px; font-size:12px; background:rgba(245, 158, 11, 0.12); color:#b45309; border:1px solid rgba(245, 158, 11, 0.25); }
      .status-approved { display:inline-flex; align-items:center; height:24px; padding:0 10px; border-radius:999px; font-size:12px; background:rgba(46, 125, 50, 0.12); color:#15803d; border:1px solid rgba(46, 125, 50, 0.25); }
      .status-inside { display:inline-flex; align-items:center; height:24px; padding:0 10px; border-radius:999px; font-size:12px; background:rgba(37, 99, 235, 0.12); color:#1d4ed8; border:1px solid rgba(37, 99, 235, 0.25); }
      .status-ended { display:inline-flex; align-items:center; height:24px; padding:0 10px; border-radius:999px; font-size:12px; background:rgba(107, 114, 128, 0.12); color:#4b5563; border:1px solid rgba(107, 114, 128, 0.25); }
      .status-rejected { display:inline-flex; align-items:center; height:24px; padding:0 10px; border-radius:999px; font-size:12px; background:rgba(185, 28, 28, 0.12); color:#b91c1c; border:1px solid rgba(185, 28, 28, 0.25); }
    </style>
  </head>
  <body>
    <div class="parcel-layout">
      <header class="parcel-hd" id="visitorHeader">
        <div class="parcel-hd-content">
          <div class="parcel-title" id="visitorTitle">訪客登記</div>
        </div>
      </header>

      <div class="parcel-midtop">
        <div class="parcel-tabs" id="visitorTabs">
          <button class="tab-btn active" type="button" data-tab="active">目前預約</button>
          <button class="tab-btn" type="button" data-tab="history">歷史預約</button>
        </div>
      </div>

      <main class="parcel-bd">
        <div class="parcel-list" id="activeList">
          <div class="parcel-filter-bar" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
            <div style="font-weight:900;">目前預約</div>
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
              <input id="activeSearch" type="text" placeholder="搜尋 姓名 / 手機 / 車牌" autocomplete="off" style="min-width:180px;" />
              <button class="icon-btn icon-btn--primary" type="button" id="btnNewVisitor" title="新增訪客預約" aria-label="新增訪客預約">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
              </button>
            </div>
          </div>
          <div id="activeContent">
            <div class="status">載入中...</div>
          </div>
        </div>

        <div class="parcel-list hidden" id="historyList">
          <div class="parcel-filter-bar" style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
            <div style="font-weight:900;">歷史預約</div>
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
              <input id="historySearch" type="text" placeholder="搜尋 姓名 / 手機 / 車牌" autocomplete="off" style="min-width:180px;" />
            </div>
          </div>
          <div id="historyContent">
            <div class="status">載入中...</div>
          </div>
        </div>
      </main>

      <footer class="parcel-ft"></footer>
    </div>

    <div class="modal" id="visitorFormModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="visitorFormModalTitle">
        <div class="modal-hd">
          <h3 class="modal-title" id="visitorFormModalTitle">新增訪客預約</h3>
          <button class="modal-close" type="button" data-modal-close="1" aria-label="關閉">×</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label for="v_name">訪客姓名</label>
            <input id="v_name" type="text" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="v_party">拜訪人數</label>
            <input id="v_party" type="text" inputmode="numeric" autocomplete="off" value="1" />
          </div>
          <div class="field">
            <label for="v_phone">手機</label>
            <input id="v_phone" type="text" inputmode="tel" autocomplete="tel" />
          </div>
          <div class="field">
            <label for="v_plate">車牌</label>
            <input id="v_plate" type="text" autocomplete="off" />
          </div>
          <div class="field">
            <label for="v_email">電子郵件</label>
            <input id="v_email" type="email" autocomplete="email" />
          </div>
          <div class="field">
            <label for="v_purposeType">到訪事由</label>
            <select id="v_purposeType">
              <option value="親友拜訪">親友拜訪</option>
              <option value="廠商施工">廠商施工</option>
              <option value="外送">外送</option>
              <option value="看房">看房</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="field" id="purposeOtherField" hidden>
            <label for="v_purposeOther">其他事由</label>
            <input id="v_purposeOther" type="text" autocomplete="off" />
          </div>
          <div class="field">
            <label for="v_note">備註</label>
            <textarea id="v_note" rows="3" style="min-height:80px;"></textarea>
          </div>
          <div class="status" id="visitorFormStatus" hidden></div>
        </div>
        <div class="modal-ft">
          <button class="btn" type="button" data-modal-close="1">取消</button>
          <button class="btn btn-primary" type="button" id="btnSaveVisitor">送出預約</button>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/visitor-resident.js?v=8"></script>
    <script src="js/ads-footer.js?v=16"></script>
    <script src="js/pwa.js?v=6"></script>
  </body>
</html>
