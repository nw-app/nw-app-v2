<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PDF 檢視</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #d32f2f;
        --text: #111827;
        --muted: #6b7280;
        --panel: #ffffff;
        --line: rgba(17, 24, 39, 0.12);
        --bg: #f3f4f6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
      }
      .viewer-hd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .viewer-title {
        min-width: 0;
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .viewer-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text);
        text-decoration: none;
        font-weight: 800;
        cursor: pointer;
      }
      .btn-primary {
        background: var(--brand);
        color: #fff;
        border-color: transparent;
      }
      .viewer-status {
        padding: 10px 14px;
        color: var(--muted);
        font-size: 14px;
      }
      .viewer-status.error { color: #b91c1c; }
      .viewer-bd {
        flex: 1 1 auto;
        display: flex;
        justify-content: center;
        padding: 16px 12px 32px;
      }
      .pdf-pages {
        width: min(100%, 960px);
        display: grid;
        gap: 16px;
      }
      .pdf-page {
        display: grid;
        gap: 8px;
        justify-items: center;
      }
      .pdf-page canvas {
        width: 100%;
        height: auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 28px rgba(17, 24, 39, 0.12);
      }
      .page-label {
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header class="viewer-hd">
      <div class="viewer-title" id="viewerTitle">PDF 檔案</div>
      <div class="viewer-actions">
        <a class="btn" id="btnDownloadPdf" href="#" download="附件.pdf">下載</a>
        <button class="btn btn-primary" type="button" id="btnClosePdfViewer">關閉</button>
      </div>
    </header>
    <div class="viewer-status" id="viewerStatus">載入中...</div>
    <main class="viewer-bd">
      <div class="pdf-pages" id="pdfPages"></div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="js/pdf-viewer.js?v=2"></script>
  </body>
</html>
