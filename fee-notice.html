<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>管理費催收通知函</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=4" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />
    <link rel="stylesheet" href="./css/index.css?v=3" />
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script defer src="./js/firebase-config.js"></script>
    <script defer src="./js/fee-notice.js?v=3"></script>
    <style>
      [hidden] { display: none !important; }
      body { background: var(--bg); }
      .fn-wrap {
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      .fn-top {
        padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
        display: grid;
        gap: 6px;
        border-bottom: 1px solid rgba(17, 24, 39, 0.08);
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
      }
      .fn-brand { display: flex; align-items: center; gap: 10px; font-weight: 900; }
      .fn-brand img { width: 28px; height: 28px; display: block; }
      .fn-top-title { font-size: 14px; font-weight: 900; color: rgba(31, 41, 55, 0.92); }
      .fn-top-sub { font-size: 13px; color: var(--muted); word-break: break-all; }
      .fn-main { padding: 0 0 calc(12px + env(safe-area-inset-bottom)); }
      .fn-actions {
        position: sticky;
        bottom: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-top: 1px solid rgba(17, 24, 39, 0.08);
      }
      .fn-btn {
        height: 42px;
        border-radius: 14px;
        border: 1px solid rgba(17, 24, 39, 0.12);
        background: #fff;
        color: var(--text);
        font-size: 13px;
        font-weight: 900;
        cursor: pointer;
        user-select: none;
        -webkit-touch-callout: none;
        padding: 0 6px;
      }
      .fn-btn:disabled { opacity: 0.5; cursor: default; }
      .fn-btn-line { background: #06c755; border-color: rgba(0, 0, 0, 0); color: #fff; }
      .fn-btn-primary { background: #d32f2f; border-color: rgba(0, 0, 0, 0); color: #fff; }
      @media (max-width: 420px) {
        .fn-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <main class="fn-wrap">
      <header class="fn-top">
        <div class="fn-brand">
          <img src="./logo.svg?v=4" alt="LOGO" />
          <div class="fn-top-title">QAi生活網 · 管理費催收通知函</div>
        </div>
        <div class="fn-top-sub" id="fnSub">—</div>
      </header>

      <section class="fn-main">
        <div class="status" id="fnStatus" hidden style="margin: 12px;"></div>
        <div id="feeNoticeApp"></div>
      </section>

      <footer class="fn-actions" id="fnActions" hidden>
        <button type="button" id="fnCopyLink" class="fn-btn">複製連結</button>
        <button type="button" id="fnShareLine" class="fn-btn fn-btn-line">轉發 LINE</button>
        <button type="button" id="fnDownloadImage" class="fn-btn">下載圖片</button>
        <button type="button" id="fnDownloadPdf" class="fn-btn fn-btn-primary">下載 PDF</button>
      </footer>
    </main>
  </body>
</html>
