<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>住戶｜社區前台</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="member.css" />
  </head>
  <body>
    <div class="layout">
      <header class="frame-hd">
        <div class="frame-hd-row">
          <div class="frame-brand">
            <img src="logo.svg" alt="" />
            <div class="meta">
              <div class="title">住戶前台</div>
              <div class="sub" id="loginInfo">—</div>
            </div>
          </div>
          <div class="frame-actions">
            <button class="btn" type="button" id="btnGoCommunity">社區後台</button>
            <button class="btn btn-primary" type="button" id="btnSignOut">登出</button>
          </div>
        </div>
        <div class="frame-title">
          <h1 id="pageTitle">首頁</h1>
          <p id="pageSubtitle">住戶前台頁面後續再規劃設計（示意）</p>
        </div>
      </header>

      <main class="frame-bd">
        <section class="content" id="content" aria-live="polite"></section>
      </main>

      <footer class="frame-ft" aria-label="住戶前台選單">
        <nav class="nav" id="nav"></nav>
      </footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="member.js"></script>
  </body>
</html>
