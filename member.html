<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>住戶｜社區前台</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=4" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />
    <link rel="stylesheet" href="css/member.css" />
    <link rel="stylesheet" href="css/pwa.css" />
  </head>
  <body>
    <div class="layout">
      <header class="frame-hd">
        <div class="frame-hd-row">
          <div class="frame-brand">
            <a href="https://qailifeweb-h9keujwr.manus.space/" target="_blank" rel="noopener noreferrer">
              <img src="logo.svg?v=4" alt="" style="cursor: pointer;" />
            </a>
            <div class="meta">
              <div class="title">生活網</div>
              <div class="sub" id="communityNameSub"></div>
            </div>
          </div>
          <div class="header-actions">
            <button class="btn-icon-only" type="button" id="btnNotification" aria-label="通話">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M6.9 3.9 9 6.3c.3.4.3.9.1 1.3l-1 1.9a13.5 13.5 0 0 0 6.4 6.4l1.9-1c.4-.2.9-.2 1.3.1l2.4 2.1c.5.4.5 1.2.1 1.7l-1.4 1.4c-.4.4-1 .6-1.6.5-3.3-.6-6.4-2.3-9.1-5a19.6 19.6 0 0 1-5-9.1c-.1-.6.1-1.2.5-1.6L5.2 4c.5-.4 1.3-.4 1.7-.1Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="badge-bubble" id="btnNotificationBadge" hidden>0</span>
            </button>
            <button class="user-avatar" type="button" id="btnUserMenu" aria-label="使用者選單" aria-haspopup="true" aria-expanded="false">
              <span class="user-greet" id="userGreeting">Hi~</span>
              <img class="user-avatar-img" id="userAvatarImg" alt="" />
              <span class="user-avatar-fallback" id="userAvatarFallback" aria-hidden="true">U</span>
            </button>
          </div>
        </div>
      </header>

      <div class="frame-midtop" aria-label="頁中上">
        <div class="frame-title">
          <div class="title-left">
            <h1 id="pageTitle"></h1>
            <p id="pageSubtitle"></p>
          </div>
          <div class="datetime-weather-inline">
            <div class="weather-section" id="weatherSection">
              <div class="weather-info">
                <div class="temperature" id="temperature">--°C</div>
                <div class="location" id="locationDisplay">定位中...</div>
                <div class="weather-desc" id="weatherDesc">獲取天氣中...</div>
              </div>
              <div class="weather-icon" id="weatherIcon">🌤️</div>
            </div>
            <div class="datetime-section">
              <div class="time-display" id="timeDisplay">--:--:--</div>
              <div class="date-display" id="dateDisplay">----年--月--日 星期--</div>
            </div>
          </div>
        </div>
      </div>

      <main class="frame-bd">
        <section class="content" id="content" aria-live="polite"></section>
      </main>

      <footer class="frame-ft" aria-label="住戶前台選單">
        <nav class="nav" id="nav"></nav>
      </footer>
    </div>

    <div class="modal" id="notificationModal" hidden>
      <div class="modal-backdrop" id="btnNotificationModalBackdrop"></div>
      <div class="modal-dialog trae-browser-inspect-draggable" role="dialog" aria-modal="true" aria-labelledby="notificationModalTitle" style="width:min(1200px,90vw);max-width:90vw;height:90vh;display:flex;flex-direction:column;">
        <div class="modal-hd">
          <h3 class="modal-title" id="notificationModalTitle">撥號</h3>
          <button class="modal-close" type="button" id="btnCloseNotificationModal" aria-label="關閉">×</button>
        </div>
        <div class="modal-body" style="padding:0;min-height:0;flex:1 1 auto;">
          <iframe id="notificationIframe" src="" frameborder="0" style="width:100%;height:100%;display:block;"></iframe>
        </div>
      </div>
    </div>

    <div class="modal" id="externalPageModal" hidden>
      <div class="modal-backdrop" id="btnExternalPageModalBackdrop"></div>
      <div class="modal-dialog full" role="dialog" aria-modal="true" aria-labelledby="externalPageModalTitle">
        <div class="modal-hd">
          <div class="modal-hd-left"></div>
          <div class="modal-hd-center">
            <span class="community-name" id="externalPageModalCommunityName">社區名稱</span>
            <h3 class="modal-title" id="externalPageModalTitle">頁面名稱</h3>
          </div>
          <div class="modal-hd-actions">
            <button class="modal-close" type="button" id="btnCloseExternalPageModal" aria-label="關閉">×</button>
          </div>
        </div>
        <div class="modal-body no-padding">
          <div id="externalPageError" class="iframe-error-container" hidden>
            <div class="iframe-error-content">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:64px;height:64px;margin-bottom:16px;opacity:0.5;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
              <h3>無法在此嵌入顯示</h3>
              <p>基於安全性考量，部分網站（如 Google、Gemini）不允許在小視窗中開啟。請點擊下方按鈕直接在瀏覽器分頁中瀏覽。</p>
              <a href="#" target="_blank" class="btn btn-primary" id="btnExternalPageErrorOpen">在新分頁開啟</a>
            </div>
          </div>
          <iframe id="externalPageIframe" src="" frameborder="0" style="width: 100%; height: 100%; display: block;"></iframe>
        </div>
      </div>
    </div>

    <div class="modal" id="profileModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
        <div class="modal-hd">
          <h3 class="modal-title" id="profileModalTitle">個人資訊</h3>
          <button class="modal-close" type="button" id="btnCloseProfileModal" aria-label="關閉">×</button>
        </div>
        <form id="profileForm">
          <div class="modal-body">
            <div class="profile-row" id="profileCommunityItem" hidden>
              <div class="profile-value community" id="profileCommunityText">—</div>
              <div class="profile-value" id="profileRole">—</div>
            </div>
            <div class="profile-item">
              <div class="profile-avatar">
                <img id="profileAvatarImg" alt="" />
                <span class="user-avatar-fallback" id="profileAvatarFallback" aria-hidden="true">U</span>
                <button type="button" class="avatar-edit-btn" id="btnEditAvatar" aria-label="更換大頭照" title="更換大頭照">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 20h9" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                  </svg>
                </button>
                <input type="file" id="profileAvatarFile" accept="image/*" hidden />
              </div>
            </div>
            <div class="profile-item">
              <div class="profile-label">姓名</div>
              <div class="profile-value" id="profileNameText">—</div>
            </div>
            <div class="profile-item" id="profileHouseNoItem">
              <div class="profile-label">戶號</div>
              <div class="profile-value" id="profileHouseNoText">—</div>
            </div>
            <div class="status" id="profileStatus" hidden></div>
          </div>
          <div class="modal-ft">
            <div class="profile-switch" id="profileSwitch" hidden></div>
            <button class="btn" type="button" id="btnCloseProfileModalFt">關閉</button>
            <button class="btn btn-primary" type="button" id="btnSignOut">登出</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-messaging-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/member.js?v=21"></script>
    <script src="js/pwa.js?v=4"></script>
  </body>
</html>
