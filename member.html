<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>住戶｜社區前台</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="css/member.css" />
    <link rel="stylesheet" href="css/pwa.css" />
  </head>
  <body>
    <div class="layout">
      <header class="frame-hd">
        <div class="frame-hd-row">
          <div class="frame-brand">
            <img src="logo.svg" alt="" />
            <div class="meta">
              <div class="title">西北守護星</div>
            </div>
          </div>
          <button class="user-avatar" type="button" id="btnUserMenu" aria-label="使用者選單" aria-haspopup="true" aria-expanded="false">
            <span class="user-avatar-fallback" id="userAvatarFallback" aria-hidden="true">U</span>
          </button>
        </div>
      </header>

      <div class="frame-midtop" aria-label="頁中上">
        <div class="frame-title">
          <h1 id="pageTitle">首頁</h1>
          <p id="pageSubtitle">住戶前台頁面後續再規劃設計（示意）</p>
        </div>
      </div>

      <main class="frame-bd">
        <section class="content" id="content" aria-live="polite"></section>
      </main>

      <footer class="frame-ft" aria-label="住戶前台選單">
        <nav class="nav" id="nav"></nav>
      </footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/member.js"></script>
    <script src="js/pwa.js"></script>

    <div class="modal" id="profileModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
        <div class="modal-hd">
          <h3 class="modal-title" id="profileModalTitle">個人資訊</h3>
          <button class="modal-close" type="button" id="btnCloseProfileModal" aria-label="關閉">×</button>
        </div>
        <form id="profileForm">
          <div class="modal-body">
            <div class="profile-item">
              <div class="profile-label">角色名稱</div>
              <div class="profile-value" id="profileRole">—</div>
            </div>
            <div class="profile-item">
              <div class="profile-label">大頭照</div>
              <div class="profile-avatar">
                <img id="profileAvatarImg" alt="" />
                <span class="user-avatar-fallback" id="profileAvatarFallback" aria-hidden="true">U</span>
              </div>
            </div>
            <div class="profile-item">
              <div class="profile-label">姓名</div>
              <div class="profile-value" id="profileNameText">—</div>
            </div>
            <div class="status" id="profileStatus" hidden></div>
          </div>
          <div class="modal-ft">
            <button class="btn" type="button" id="btnCloseProfileModalFt">關閉</button>
            <button class="btn btn-primary" type="button" id="btnSignOut">登出</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
