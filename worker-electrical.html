<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>機電｜社區系統</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=4" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />
    <link rel="stylesheet" href="css/worker-clean.css?v=4" />
    <link rel="stylesheet" href="css/pwa.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body data-duty-role="electrical">
    <!-- 橫屏鎖定提示 -->
    <div class="wc-rotate-lock" id="rotateLock">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="7" y="2.5" width="10" height="19" rx="2.2" stroke="currentColor" stroke-width="1.8"/>
        <path d="M10.5 5.5h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M4 8.5A7.2 7.2 0 0 1 3.2 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M20 8.5a7.2 7.2 0 0 1 .8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <div class="t">請將手機轉為直式</div>
      <div class="s">本頁面僅支援直屏使用，以確保操作正確</div>
    </div>

    <div class="wc-layout">
      <header class="wc-hd">
        <div class="wc-hd-row">
          <div class="wc-brand">
            <img src="logo.svg?v=4" alt="" />
            <div class="meta">
              <div class="title">機電</div>
              <div class="sub" id="wcCommunityName">社區智慧系統平台</div>
            </div>
          </div>
          <div class="header-actions">
            <button class="user-avatar" type="button" id="btnUserChip" aria-label="使用者選單" aria-haspopup="true" aria-expanded="false">
              <span class="user-greet" id="wcUserName">未登入</span>
              <img class="user-avatar-img" id="wcAvatarImg" alt="" />
              <span class="user-avatar-fallback" id="wcAvatar" aria-hidden="true">機</span>
            </button>
          </div>
        </div>
      </header>

      <main class="wc-bd" id="wdBody">
        <div class="wc-empty">載入中…</div>
      </main>

      <nav class="wc-ft" id="wdNav">
        <button class="wc-nav-btn" type="button" data-wd-tab="punch" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 7.6V12l3 1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>打卡</span>
        </button>
        <button class="wc-nav-btn" type="button" data-wd-tab="schedule">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M3.5 9.5h17" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 3.5v3M16 3.5v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>班表</span>
        </button>
        <button class="wc-nav-btn" type="button" data-wd-tab="leave">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6.5 3.5h7l4 4v13a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M13 3.5V8h4.5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M12 12.5v4M10 14.5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>請假補卡</span>
        </button>
        <button class="wc-nav-btn" type="button" data-wd-tab="setting">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 3.5v2M12 18.5v2M20.5 12h-2M5.5 12h-2M18 6l-1.4 1.4M7.4 16.6 6 18M18 18l-1.4-1.4M7.4 7.4 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>設定</span>
        </button>
      </nav>
    </div>

    <!-- 個人資訊（與社區前台相同格式） -->
    <div class="modal" id="profileModal" hidden>
      <div class="modal-backdrop" data-wc-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
        <div class="modal-hd">
          <h3 class="modal-title" id="profileModalTitle">個人資訊</h3>
          <button class="modal-close" type="button" id="wcProfileClose" aria-label="關閉">×</button>
        </div>
        <form id="wcProfileForm">
          <div class="modal-body">
            <div class="profile-row" id="profileCommunityItem">
              <div class="profile-value community" id="profileCommunityText">—</div>
              <div class="profile-value" id="profileRole">—</div>
            </div>
            <div class="profile-item">
              <div class="profile-avatar">
                <img id="profileAvatarImg" alt="" />
                <span class="user-avatar-fallback" id="profileAvatarFallback" aria-hidden="true">機</span>
              </div>
            </div>
            <div class="profile-item">
              <div class="profile-label">姓名</div>
              <div class="profile-value" id="profileNameText">—</div>
            </div>
            <div class="profile-item" id="profileHouseNoItem" hidden>
              <div class="profile-label">戶號</div>
              <div class="profile-value" id="profileHouseNoText">—</div>
            </div>
            <div class="status" id="profileStatus" hidden></div>
          </div>
          <div class="modal-ft">
            <button class="btn" type="button" id="wcProfileCloseFt">關閉</button>
            <button class="btn btn-primary" type="button" id="wcProfileSignOut">登出</button>
          </div>
        </form>
      </div>
    </div>

    <div class="wc-toast" id="wcToast" role="status" aria-live="polite"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/punch-flow.js?v=2"></script>
    <script src="js/worker-duty.js?v=6"></script>
    <script src="js/pwa.js?v=12"></script>
  </body>
</html>
