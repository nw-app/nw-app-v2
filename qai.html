    <script>
      var ua = (navigator && navigator.userAgent) ? navigator.userAgent : "";
      var isLineBrowser = /\bLine\//i.test(ua);
      function showLineGuide() {
        var el = document.getElementById("qaiLineGuide");
        if (!el) return;
        el.classList.add("is-open");
        if (document.body) {
          document.body.style.overflow = "hidden";
        }
        var closeBtn = el.querySelector(".qai-line-guide-close");
        if (closeBtn) {
          setTimeout(function () { try { closeBtn.focus(); } catch (_) {} }, 80);
        }
      }
      function hideLineGuide() {
        var el = document.getElementById("qaiLineGuide");
        if (!el) return;
        el.classList.remove("is-open");
        if (document.body) {
          document.body.style.overflow = "";
        }
      }
      function doAnchorClick(href, filename, target) {
        var link = document.createElement("a");
        link.href = href;
        if (filename) link.download = filename;
        link.target = target || "_blank";
        link.rel = "noopener noreferrer";
        link.style.display = "none";
        document.body.appendChild(link);
        try { link.click(); } catch (_) {}
        setTimeout(function () {
          if (link && link.parentNode) link.parentNode.removeChild(link);
        }, 500);
      }
      function forceDownload(e) {
        if (isLineBrowser) {
          e.preventDefault();
          try { showLineGuide(); } catch (_) {}
          return false;
        }
        var a = e.currentTarget;
        var url = a.getAttribute("href");
        var filename = a.getAttribute("download") || "qai_pdf.pdf";
        e.preventDefault();
        var tried = false;
        var onFailed = function () {
          if (tried) return;
          tried = true;
          try {
            doAnchorClick(url, filename, "_blank");
          } catch (_) {
            try { window.open(url, "_blank", "noopener"); } catch (__) {}
          }
        };
        try {
          fetch(url, { mode: "cors" })
            .then(function (res) {
              if (!res.ok) throw new Error("net");
              return res.blob();
            })
            .then(function (blob) {
              var objUrl = URL.createObjectURL(blob);
              var link = document.createElement("a");
              link.href = objUrl;
              link.download = filename;
              link.style.display = "none";
              document.body.appendChild(link);
              try { link.click(); } catch (_) { onFailed(); return; }
              setTimeout(function () {
                try { URL.revokeObjectURL(objUrl); } catch (_) {}
                if (link && link.parentNode) link.parentNode.removeChild(link);
              }, 500);
            })
            .catch(onFailed);
        } catch (_) {
          onFailed();
        }
        return false;
      }
    </script>
  </body>
</html>
