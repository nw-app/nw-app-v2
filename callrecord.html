<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>來電｜通話紀錄</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=4" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />
    <link rel="stylesheet" href="css/member.css" />
    <link rel="stylesheet" href="css/pwa.css" />
    <style>
      html, body { height: 100%; }
      body { overflow: hidden; }
      .callrecord-page { height: 100dvh; display: flex; flex-direction: column; }
      .callrecord-bd {
        flex: 1 1 auto;
        min-height: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      .callrecord-content {
        flex: 1 1 auto;
        min-height: 0;
        padding: 0;
      }
      .callrecord-head {
        position: sticky;
        top: 0;
        z-index: 15;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(17, 24, 39, 0.08);
      }
      .callrecord-tabs {
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
        position: relative;
        z-index: 2;
      }
      .cr-tab {
        appearance: none;
        border: 1px solid rgba(17, 24, 39, 0.1);
        background: #fff;
        color: #111827;
        padding: 12px 12px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 800;
        line-height: 1;
        cursor: pointer;
        user-select: none;
        flex: 1 1 0;
        min-width: 0;
        text-align: center;
        pointer-events: auto;
      }
      .cr-tab.active {
        border-color: rgba(211, 47, 47, 0.28);
        background: rgba(211, 47, 47, 0.08);
        color: #b71c1c;
      }
      .callrecord-filters {
        --filter-columns: 5;
        display: grid;
        grid-template-columns: repeat(var(--filter-columns), minmax(0, 1fr));
        gap: 8px;
        align-items: stretch;
        min-height: 40px;
        position: relative;
        z-index: 1;
      }
      .callrecord-filters-empty {
        grid-column: 1 / -1;
        width: 100%;
        font-size: 13px;
        color: var(--muted);
        padding: 2px 2px 0;
      }
      .selection-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding-top: 2px;
      }
      .selection-toolbar[hidden] {
        display: none !important;
      }
      .selection-summary {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 0 12px;
        border-radius: 999px;
        background: rgba(17, 24, 39, 0.06);
        color: #111827;
        font-size: 13px;
        font-weight: 800;
      }
      .selection-action {
        appearance: none;
        border: 1px solid rgba(17, 24, 39, 0.12);
        background: #fff;
        color: #111827;
        min-height: 36px;
        padding: 0 14px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 800;
        line-height: 1;
        cursor: pointer;
      }
      .selection-action.danger {
        border-color: rgba(220, 38, 38, 0.22);
        background: rgba(220, 38, 38, 0.08);
        color: #b91c1c;
      }
      .selection-action:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .cr-filter {
        appearance: none;
        border: 1px solid rgba(17, 24, 39, 0.1);
        background: #fff;
        color: #111827;
        padding: 7px 6px;
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 100%;
        min-width: 0;
        font-size: 12px;
        font-weight: 800;
        line-height: 1;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
        overflow: hidden;
      }
      .cr-filter .mini {
        width: 14px;
        height: 14px;
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
      }
      .cr-filter .mini svg { width: 14px; height: 14px; }
      .cr-filter .label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cr-filter .num {
        font-weight: 900;
        flex: 0 0 auto;
      }
      .cr-filter.active {
        border-color: rgba(17, 24, 39, 0.18);
        box-shadow: 0 6px 16px rgba(17, 24, 39, 0.08);
      }
      .cr-filter[data-cat="incoming_answered"] { border-color: rgba(16, 185, 129, 0.38); background: rgba(16, 185, 129, 0.08); color: #047857; }
      .cr-filter[data-cat="incoming_missed"] { border-color: rgba(220, 38, 38, 0.38); background: rgba(220, 38, 38, 0.08); color: #b91c1c; }
      .cr-filter[data-cat="outgoing_answered"] { border-color: rgba(16, 185, 129, 0.38); background: rgba(16, 185, 129, 0.08); color: #047857; }
      .cr-filter[data-cat="outgoing_missed"] { border-color: rgba(220, 38, 38, 0.38); background: rgba(220, 38, 38, 0.08); color: #b91c1c; }
      .callrecord-card {
        height: 100%;
        border-radius: 0;
        border: 0;
        box-shadow: none;
      }
      .callrecord-list {
        height: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 14px;
      }
      .callrecord-item {
        position: relative;
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border-radius: var(--radius-sm);
        background: #fff;
        border: 1px solid rgba(17, 24, 39, 0.1);
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, transform 0.18s ease;
      }
      .callrecord-item.selecting {
        padding-right: 44px;
      }
      .callrecord-item.selected {
        border-color: rgba(211, 47, 47, 0.35);
        background: rgba(211, 47, 47, 0.06);
        box-shadow: 0 8px 20px rgba(211, 47, 47, 0.12);
      }
      .callrecord-item-select {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 2px solid rgba(17, 24, 39, 0.18);
        background: #fff;
        color: transparent;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 900;
        line-height: 1;
        box-sizing: border-box;
      }
      .callrecord-item.selecting .callrecord-item-select {
        display: inline-flex;
      }
      .callrecord-item.selected .callrecord-item-select {
        border-color: #d32f2f;
        background: #d32f2f;
        color: #fff;
      }
      .callrecord-icon {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: rgba(17, 24, 39, 0.06);
        color: #111827;
      }
      .callrecord-icon.cat-incoming-answered { background: rgba(16, 185, 129, 0.12); color: #047857; }
      .callrecord-icon.cat-incoming-missed { background: rgba(220, 38, 38, 0.12); color: #b91c1c; }
      .callrecord-icon.cat-outgoing-answered { background: rgba(16, 185, 129, 0.12); color: #047857; }
      .callrecord-icon.cat-outgoing-missed { background: rgba(220, 38, 38, 0.12); color: #b91c1c; }
      .callrecord-icon svg {
        width: 22px;
        height: 22px;
        overflow: visible;
      }
      .callrecord-main {
        min-width: 0;
      }
      .callrecord-name {
        font-size: 15px;
        font-weight: 900;
        line-height: 1.35;
        word-break: break-word;
      }
      .callrecord-meta {
        margin-top: 6px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .callrecord-time {
        font-size: 12px;
        color: var(--muted);
      }
      .callrecord-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
      .callrecord-err { color: #9f1c1c; font-size: 13px; padding: 8px 0; }
    </style>
  </head>
  <body>
    <div class="callrecord-page">
      <main class="callrecord-bd">
        <section class="content callrecord-content" aria-live="polite">
          <div class="card callrecord-card">
            <div class="card-bd callrecord-list">
              <div class="callrecord-head" id="historyHead">
                <div class="callrecord-tabs" role="tablist" aria-label="通話紀錄分頁">
                  <button class="cr-tab active" type="button" data-tab="all" aria-selected="true">全部</button>
                  <button class="cr-tab" type="button" data-tab="incoming" aria-selected="false">來電</button>
                  <button class="cr-tab" type="button" data-tab="outgoing" aria-selected="false">撥出</button>
                </div>
                <div class="callrecord-filters" id="categoryFilters" aria-label="通話分類">
                  <div class="callrecord-filters-empty">載入中...</div>
                </div>
                <div class="selection-toolbar" id="selectionToolbar" hidden>
                  <div class="selection-summary" id="selectionSummary">已選取 0 筆</div>
                  <button class="selection-action" id="btnSelectAllCalls" type="button">全選</button>
                  <button class="selection-action" id="btnCancelSelection" type="button">取消</button>
                  <button class="selection-action danger" id="btnDeleteSelectedCalls" type="button">刪除</button>
                </div>
              </div>
              <div class="list" id="historyList"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/pwa.js?v=4"></script>
    <script>
      (function () {
        "use strict";

        const firebaseConfig = window.FIREBASE_CONFIG;
        if (!firebaseConfig) throw new Error("Missing FIREBASE_CONFIG");

        try { firebase.initializeApp(firebaseConfig); } catch {}
        const auth = firebase.auth();
        const db = firebase.firestore();
        const FieldValue = firebase.firestore.FieldValue;
        try {
          db.settings({
            experimentalAutoDetectLongPolling: true,
            experimentalForceLongPolling: true,
            useFetchStreams: false,
            ignoreUndefinedProperties: true,
          });
        } catch {}

        const historyListEl = document.getElementById("historyList");
        const categoryFiltersEl = document.getElementById("categoryFilters");
        const tabButtons = Array.from(document.querySelectorAll(".cr-tab"));
        const selectionToolbarEl = document.getElementById("selectionToolbar");
        const selectionSummaryEl = document.getElementById("selectionSummary");
        const btnSelectAllCallsEl = document.getElementById("btnSelectAllCalls");
        const btnCancelSelectionEl = document.getElementById("btnCancelSelection");
        const btnDeleteSelectedCallsEl = document.getElementById("btnDeleteSelectedCalls");

        const params = new URLSearchParams(location.search || "");
        const community = String(params.get("c") || "").trim();
        const peerUid = String(params.get("peer") || "").trim();
        const toRoleHint = String(params.get("toRole") || "").trim();
        let currentUserId = "";
        let currentItems = [];
        let currentAllItems = [];
        let hiddenCallIdSet = new Set();
        let _unsubHistory = null;
        let viewTab = "all";
        let viewFilter = "all";
        let selectionMode = false;
        let deletingSelection = false;
        let selectedCallIdSet = new Set();
        let pressTimer = 0;
        let pressPointerId = null;
        let pressTargetId = "";
        let pressStartX = 0;
        let pressStartY = 0;
        let suppressNextClick = false;
        const LONG_PRESS_MS = 420;
        const LONG_PRESS_MOVE_PX = 10;

        function esc(s) {
          return String(s ?? "").replace(/[&<>"']/g, (ch) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "\"": "&quot;",
            "'": "&#39;",
          }[ch] || ch));
        }

        function fmtTime(ms) {
          const n = Number(ms || 0);
          if (!Number.isFinite(n) || n <= 0) return "";
          try {
            const d = new Date(n);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            const hh = String(d.getHours()).padStart(2, "0");
            const mm = String(d.getMinutes()).padStart(2, "0");
            const ss = String(d.getSeconds()).padStart(2, "0");
            return `${y}-${m}-${day} ${hh}:${mm}:${ss}`;
          } catch {
            return "";
          }
        }

        function normalizeCallRole(raw) {
          const v = String(raw || "").trim().toLowerCase();
          if (v === "resident" || v === "住戶") return "resident";
          if (v === "admin" || v === "community" || v === "system" || v === "系統管理員" || v === "系統管理者" || v === "社區") return "admin";
          return "";
        }

        function formatPeerName(name, role) {
          const normalizedRole = normalizeCallRole(role);
          if (normalizedRole === "admin") return "社區後台";
          return String(name || "").trim() || "通話對象";
        }

        function isAdminPeerScopedView() {
          return toRoleHint === "admin" && !!peerUid;
        }

        function pickPeerInfo(data, currentUid) {
          const d = data && typeof data === "object" ? data : {};
          const uid = String(currentUid || "").trim();
          const fromUid = String(d.fromUid || "").trim();
          const toUid = String(d.toUid || "").trim();
          if (isAdminPeerScopedView()) {
            const peerId = String(peerUid || "").trim();
            if (peerId) {
              if (fromUid === peerId) {
                return {
                  direction: "incoming",
                  name: formatPeerName(d.fromName, d.fromRole),
                  unit: [String(d.fromHouseNo || "").trim(), String(d.fromSubUnit || "").trim()].filter(Boolean).join("-"),
                };
              }
              if (toUid === peerId) {
                return {
                  direction: "outgoing",
                  name: formatPeerName(d.toName, d.toRole),
                  unit: [String(d.toHouseNo || "").trim(), String(d.toSubUnit || "").trim()].filter(Boolean).join("-"),
                };
              }
            }
          }
          const outgoing = !!uid && fromUid === uid && toUid !== uid;
          const incoming = !!uid && toUid === uid && fromUid !== uid;
          if (outgoing) {
            return {
              direction: "outgoing",
              name: formatPeerName(d.toName, d.toRole),
              unit: [String(d.toHouseNo || "").trim(), String(d.toSubUnit || "").trim()].filter(Boolean).join("-"),
            };
          }
          if (incoming) {
            return {
              direction: "incoming",
              name: formatPeerName(d.fromName, d.fromRole),
              unit: String(d.fromHouseNo || "").trim(),
            };
          }
          const fallbackIsOutgoing = normalizeCallRole(d.fromRole) === "resident";
          return {
            direction: fallbackIsOutgoing ? "outgoing" : "incoming",
            name: fallbackIsOutgoing
              ? formatPeerName(d.toName, d.toRole)
              : formatPeerName(d.fromName, d.fromRole),
            unit: fallbackIsOutgoing
              ? [String(d.toHouseNo || "").trim(), String(d.toSubUnit || "").trim()].filter(Boolean).join("-")
              : String(d.fromHouseNo || "").trim(),
          };
        }

        function classifyCategory(data, currentUid) {
          const d = data && typeof data === "object" ? data : {};
          const uid = String(currentUid || "").trim();
          const peer = pickPeerInfo(d, uid);
          const direction = peer && peer.direction === "incoming" ? "incoming" : "outgoing";
          const answered = isAnsweredCall(d);
          const key = `${direction}_${answered ? "answered" : "missed"}`;
          const label = direction === "incoming"
            ? (answered ? "來電已接" : "來電未接")
            : (answered ? "撥出已接" : "撥出未接");
          const cls = `cat-${direction}-${answered ? "answered" : "missed"}`;
          return { key, label, cls, direction, answered };
        }

        function renderHandsetSvg() {
          return `<path d="M7.5 4.7c.47-.44 1.18-.53 1.75-.21l2.35 1.31c.68.38.99 1.18.75 1.91l-.62 1.85a12.65 12.65 0 0 0 2.69 2.69l1.85-.62c.73-.24 1.53.07 1.91.75l1.31 2.35c.32.57.23 1.28-.21 1.75l-1.08 1.13c-.83.87-2.09 1.18-3.23.82-2.48-.78-4.79-2.36-6.82-4.39S5.55 9.67 4.77 7.19c-.36-1.14-.05-2.4.82-3.23l1.13-1.08Z" fill="currentColor"/>`;
        }

        function renderCategoryIconSvg(categoryKey) {
          const key = String(categoryKey || "").trim();
          if (key === "incoming_answered") return `${renderHandsetSvg()}<path d="M18.2 7.4h-4.9v4.9" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.2 7.4 10.6 15" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><path d="m10 16 1.4 1.4 2.5-2.5" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>`;
          if (key === "incoming_missed") return `${renderHandsetSvg()}<path d="M18.2 7.4h-4.9v4.9" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.2 7.4 10.6 15" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><path d="m10.4 10.4 4.6 4.6" stroke="#ffffff" stroke-width="2.05" stroke-linecap="round"/><path d="m15 10.4-4.6 4.6" stroke="#ffffff" stroke-width="2.05" stroke-linecap="round"/>`;
          if (key === "outgoing_answered") return `${renderHandsetSvg()}<path d="M7 16.6h4.9v-4.9" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 16.6 14.6 9" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><path d="m10 16 1.4 1.4 2.5-2.5" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>`;
          return `${renderHandsetSvg()}<path d="M7 16.6h4.9v-4.9" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 16.6 14.6 9" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><path d="m10.4 10.4 4.6 4.6" stroke="#ffffff" stroke-width="2.05" stroke-linecap="round"/><path d="m15 10.4-4.6 4.6" stroke="#ffffff" stroke-width="2.05" stroke-linecap="round"/>`;
        }

        function renderCategoryIcon(categoryKey, label) {
          const key = String(categoryKey || "").trim();
          const cls = key ? `cat-${key.replace("_", "-")}` : "";
          return `
            <div class="callrecord-icon ${cls}" aria-label="${esc(label || "")}" title="${esc(label || "")}">
              <svg viewBox="0 0 24 24" fill="none">
                ${renderCategoryIconSvg(key)}
              </svg>
            </div>
          `;
        }

        function isAnsweredCall(data) {
          const d = data && typeof data === "object" ? data : {};
          const st = String(d.status || "").trim();
          if (st === "accepted") return true;
          const ans = d.answer && typeof d.answer === "object" ? d.answer : null;
          if (ans && ans.sdp) return true;
          return false;
        }

        function isMissedCall(data) {
          const d = data && typeof data === "object" ? data : {};
          if (isAnsweredCall(d)) return false;
          const st = String(d.status || "").trim();
          if (st === "missed" || st === "rejected" || st === "busy") return true;
          if (st === "ended") return true;
          return false;
        }

        function displayStatusText(data) {
          const d = data && typeof data === "object" ? data : {};
          if (isAnsweredCall(d)) return "已接";
          if (isMissedCall(d)) return "未接";
          return "已撥";
        }

        function displayStatusTagClass(data) {
          return isMissedCall(data) ? "red" : "";
        }

        function computeCategoryCounts(items, currentUid) {
          const uid = String(currentUid || "").trim();
          const counts = {
            total: 0,
            incoming_total: 0,
            outgoing_total: 0,
            incoming_answered: 0,
            incoming_missed: 0,
            outgoing_answered: 0,
            outgoing_missed: 0,
          };
          (Array.isArray(items) ? items : []).forEach((it) => {
            const cat = classifyCategory(it, uid);
            counts.total += 1;
            if (cat.direction === "incoming") counts.incoming_total += 1;
            if (cat.direction === "outgoing") counts.outgoing_total += 1;
            if (counts[cat.key] != null) counts[cat.key] += 1;
          });
          return counts;
        }

        function sortCallItems(items) {
          return (Array.isArray(items) ? items : []).slice().sort((a, b) => {
            const am = Number(a && a.createdAtMs || 0);
            const bm = Number(b && b.createdAtMs || 0);
            if (bm !== am) return bm - am;
            return String(b && b.id || "").localeCompare(String(a && a.id || ""), "en");
          });
        }

        function getVisibleCallIds() {
          return currentItems
            .map((it) => String(it && it.id || "").trim())
            .filter(Boolean);
        }

        function clearLongPressTimer() {
          if (pressTimer) {
            try { window.clearTimeout(pressTimer); } catch {}
          }
          pressTimer = 0;
          pressPointerId = null;
          pressTargetId = "";
        }

        function setSelectionMode(nextMode, { clearSelection = false } = {}) {
          selectionMode = !!nextMode;
          if (!selectionMode || clearSelection) {
            selectedCallIdSet = new Set();
          }
          updateSelectionUi();
        }

        function toggleSelectCallId(id, forceSelected) {
          const callId = String(id || "").trim();
          if (!callId) return;
          if (!selectionMode) selectionMode = true;
          const shouldSelect = forceSelected == null ? !selectedCallIdSet.has(callId) : !!forceSelected;
          if (shouldSelect) selectedCallIdSet.add(callId);
          else selectedCallIdSet.delete(callId);
          if (!selectedCallIdSet.size) {
            selectionMode = false;
          }
          updateSelectionUi();
        }

        function updateSelectionUi() {
          const visibleIdSet = new Set(getVisibleCallIds());
          selectedCallIdSet = new Set(Array.from(selectedCallIdSet).filter((id) => visibleIdSet.has(id)));
          if (!selectedCallIdSet.size && selectionMode && !visibleIdSet.size) {
            selectionMode = false;
          }
          if (!selectedCallIdSet.size && selectionMode && !deletingSelection && visibleIdSet.size === 0) {
            selectionMode = false;
          }
          if (!selectedCallIdSet.size && selectionMode && visibleIdSet.size > 0 && !deletingSelection) {
            // Keep selection mode active after long press until the user cancels.
          }
          if (selectionToolbarEl) selectionToolbarEl.hidden = !selectionMode;
          if (selectionSummaryEl) selectionSummaryEl.textContent = `已選取 ${selectedCallIdSet.size} 筆`;
          if (btnSelectAllCallsEl) {
            btnSelectAllCallsEl.disabled = deletingSelection || !visibleIdSet.size || selectedCallIdSet.size === visibleIdSet.size;
          }
          if (btnCancelSelectionEl) btnCancelSelectionEl.disabled = deletingSelection;
          if (btnDeleteSelectedCallsEl) btnDeleteSelectedCallsEl.disabled = deletingSelection || !selectedCallIdSet.size;
          if (!historyListEl) return;
          Array.from(historyListEl.querySelectorAll(".callrecord-item")).forEach((itemEl) => {
            const id = String(itemEl.getAttribute("data-id") || "").trim();
            const isSelected = !!id && selectedCallIdSet.has(id);
            itemEl.classList.toggle("selecting", selectionMode);
            itemEl.classList.toggle("selected", isSelected);
            itemEl.setAttribute("aria-selected", isSelected ? "true" : "false");
          });
        }

        async function hideSelectedCalls() {
          const ids = Array.from(selectedCallIdSet).filter(Boolean);
          if (!currentUserId || !ids.length || deletingSelection) return;
          const ok = window.confirm(`確定要刪除 ${ids.length} 筆通話紀錄嗎？\n此操作只會隱藏你自己的紀錄顯示。`);
          if (!ok) return;
          deletingSelection = true;
          updateSelectionUi();
          try {
            await db.collection("users").doc(currentUserId).set({
              hiddenCallIds: FieldValue.arrayUnion(...ids),
            }, { merge: true });
            ids.forEach((id) => hiddenCallIdSet.add(String(id || "").trim()));
            setSelectionMode(false, { clearSelection: true });
            renderHistory(currentAllItems, currentUserId);
          } catch (err) {
            console.error(err);
            window.alert("刪除失敗，請稍後再試。");
          } finally {
            deletingSelection = false;
            updateSelectionUi();
          }
        }

        function setActiveTab(nextTab) {
          const t = String(nextTab || "").trim();
          if (!t) return;
          viewTab = t;
          viewFilter = t === "incoming" ? "incoming_all" : (t === "outgoing" ? "outgoing_all" : "all");
          tabButtons.forEach((b) => {
            const isActive = String(b.getAttribute("data-tab") || "") === viewTab;
            b.classList.toggle("active", isActive);
            b.setAttribute("aria-selected", isActive ? "true" : "false");
          });
        }

        function renderCategoryFilters(items, currentUid) {
          if (!categoryFiltersEl) return;
          const c = computeCategoryCounts(items, currentUid);
          let buttonCount = 0;
          const makeBtn = (key, label, count, iconKey) => {
            buttonCount += 1;
            const active = viewFilter === key;
            const catAttr = iconKey ? ` data-cat="${esc(iconKey)}"` : "";
            return `<button class="cr-filter${active ? " active" : ""}" type="button" data-filter="${esc(key)}"${catAttr}>
              <span class="mini"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">${renderCategoryIconSvg(iconKey || "outgoing_missed")}</svg></span>
              <span class="label">${esc(label)}</span>
              <span class="num">${esc(String(count))}</span>
            </button>`;
          };

          let html = "";
          if (viewTab === "incoming") {
            html += makeBtn("incoming_all", "全部來電", c.incoming_total, "incoming_answered");
            html += makeBtn("incoming_answered", "來電已接", c.incoming_answered, "incoming_answered");
            html += makeBtn("incoming_missed", "來電未接", c.incoming_missed, "incoming_missed");
          } else if (viewTab === "outgoing") {
            html += makeBtn("outgoing_all", "全部撥出", c.outgoing_total, "outgoing_answered");
            html += makeBtn("outgoing_answered", "撥出已接", c.outgoing_answered, "outgoing_answered");
            html += makeBtn("outgoing_missed", "撥出未接", c.outgoing_missed, "outgoing_missed");
          } else {
            html += makeBtn("all", "全部", c.total, "outgoing_answered");
            html += makeBtn("incoming_answered", "來電已接", c.incoming_answered, "incoming_answered");
            html += makeBtn("incoming_missed", "來電未接", c.incoming_missed, "incoming_missed");
            html += makeBtn("outgoing_answered", "撥出已接", c.outgoing_answered, "outgoing_answered");
            html += makeBtn("outgoing_missed", "撥出未接", c.outgoing_missed, "outgoing_missed");
          }
          if (!c.total) {
            html += `<div class="callrecord-filters-empty">${esc("目前沒有可分類的通話紀錄")}</div>`;
          }
          categoryFiltersEl.style.setProperty("--filter-columns", String(Math.max(buttonCount, 1)));
          categoryFiltersEl.innerHTML = html;
        }

        function applyViewFilter(items, currentUid) {
          const uid = String(currentUid || "").trim();
          const filter = String(viewFilter || "").trim();
          if (filter === "all") return items;
          if (filter === "incoming_all") return items.filter((d) => classifyCategory(d, uid).direction === "incoming");
          if (filter === "outgoing_all") return items.filter((d) => classifyCategory(d, uid).direction === "outgoing");
          return items.filter((d) => classifyCategory(d, uid).key === filter);
        }

        function renderHistory(items, currentUid) {
          const arr = Array.isArray(items)
            ? items.filter((d) => !hiddenCallIdSet.has(String(d && d.id || "").trim()))
            : [];
          const uid = String(currentUid || "").trim();
          const sorted = sortCallItems(arr);
          currentAllItems = sorted.slice();
          renderCategoryFilters(currentAllItems, uid);
          const viewItems = applyViewFilter(currentAllItems, uid);
          currentItems = viewItems.slice();
          selectedCallIdSet = new Set(Array.from(selectedCallIdSet).filter((id) => getVisibleCallIds().includes(id)));
          if (selectionMode && !currentItems.length) {
            selectionMode = false;
            selectedCallIdSet = new Set();
          }
          if (!currentItems.length) {
            historyListEl.innerHTML = `<p class="callrecord-empty">${esc(peerUid ? "目前沒有此對象的通話紀錄" : "目前沒有通話紀錄")}</p>`;
            updateSelectionUi();
            return;
          }
          historyListEl.innerHTML = currentItems.map((it) => {
            const d = it && typeof it === "object" ? it : {};
            const peer = pickPeerInfo(d, uid);
            const cat = classifyCategory(d, uid);
            const t = fmtTime(Number(d.createdAtMs || 0)) || "";
            const title = [peer.name, peer.unit].filter(Boolean).join("｜") || "通話對象";
            const statusText = cat.label;
            const callId = String(d.id || "").trim();
            const isSelected = selectionMode && selectedCallIdSet.has(callId);
            return `
              <div class="callrecord-item${selectionMode ? " selecting" : ""}${isSelected ? " selected" : ""}" data-id="${esc(callId)}" aria-selected="${isSelected ? "true" : "false"}">
                <div class="callrecord-item-select" aria-hidden="true">✓</div>
                ${renderCategoryIcon(cat.key, cat.label)}
                <div class="callrecord-main">
                  <div class="callrecord-name">${esc(title)}</div>
                  <div class="callrecord-meta">
                    <span class="tag ${esc(displayStatusTagClass(d))}">${esc(statusText)}</span>
                    <div class="callrecord-time">${esc(t || "—")}</div>
                  </div>
                </div>
              </div>
            `;
          }).join("");
          updateSelectionUi();
        }

        async function loadHiddenCallIds(user) {
          const uid = user && user.uid ? String(user.uid).trim() : "";
          hiddenCallIdSet = new Set();
          if (!uid) return;
          try {
            const snap = await db.collection("users").doc(uid).get();
            const data = snap && snap.exists ? (snap.data() || {}) : {};
            const raw = Array.isArray(data.hiddenCallIds) ? data.hiddenCallIds : [];
            hiddenCallIdSet = new Set(raw.map((x) => String(x || "").trim()).filter(Boolean));
          } catch {
            hiddenCallIdSet = new Set();
          }
        }

        async function loadHistory(user) {
          const u = user && user.uid ? String(user.uid).trim() : "";
          currentUserId = u;
          setSelectionMode(false, { clearSelection: true });
          if (_unsubHistory) {
            try { _unsubHistory(); } catch {}
            _unsubHistory = null;
          }
          if (!u) {
            if (categoryFiltersEl) categoryFiltersEl.innerHTML = `<div class="callrecord-filters-empty">${esc("請先登入後查看分類")}</div>`;
            historyListEl.innerHTML = `<p class="callrecord-empty">${esc("請先登入後查看通話紀錄")}</p>`;
            return;
          }
          await loadHiddenCallIds(user);
          if (categoryFiltersEl) categoryFiltersEl.innerHTML = `<div class="callrecord-filters-empty">${esc("載入分類中...")}</div>`;
          historyListEl.innerHTML = `<p class="callrecord-empty">${esc("載入中...")}</p>`;

          try {
            const isAdminHint = toRoleHint === "admin";
            if (isAdminHint && community) {
              if (peerUid) {
                const byId = new Map();
                const emit = () => {
                  const out = sortCallItems(Array.from(byId.values()));
                  renderHistory(out, u);
                };
                const onError = () => {
                  if (categoryFiltersEl) categoryFiltersEl.innerHTML = `<div class="callrecord-filters-empty">${esc("分類載入失敗")}</div>`;
                  historyListEl.innerHTML = `<p class="callrecord-err">${esc("載入通話紀錄失敗（權限不足或網路異常）")}</p>`;
                };
                const unsub1 = db.collection("calls").where("fromUid", "==", u).limit(500).onSnapshot((snap) => {
                  (snap && snap.docs ? snap.docs : []).forEach((doc) => {
                    const d = { id: doc.id, ...(doc.data() || {}) };
                    if (String(d && d.community || "").trim() !== community) return;
                    if (String(d && d.toUid || "").trim() !== peerUid) return;
                    byId.set(doc.id, d);
                  });
                  emit();
                }, onError);
                const unsub2 = db.collection("calls").where("toUid", "==", u).limit(500).onSnapshot((snap) => {
                  (snap && snap.docs ? snap.docs : []).forEach((doc) => {
                    const d = { id: doc.id, ...(doc.data() || {}) };
                    if (String(d && d.community || "").trim() !== community) return;
                    if (String(d && d.fromUid || "").trim() !== peerUid) return;
                    byId.set(doc.id, d);
                  });
                  emit();
                }, onError);
                _unsubHistory = () => { try { unsub1(); } catch {} try { unsub2(); } catch {} };
                return;
              }

              const byId = new Map();
              const emit = () => {
                const out = sortCallItems(Array.from(byId.values()));
                renderHistory(out, u);
              };

              const unsub1 = db.collection("calls").where("fromUid", "==", u).limit(500).onSnapshot((snap) => {
                (snap && snap.docs ? snap.docs : []).forEach((doc) => {
                  const d = { id: doc.id, ...(doc.data() || {}) };
                  if (String(d.community || "").trim() !== community) return;
                  byId.set(doc.id, d);
                });
                emit();
              });
              const unsub2 = db.collection("calls").where("toUid", "==", u).limit(500).onSnapshot((snap) => {
                (snap && snap.docs ? snap.docs : []).forEach((doc) => {
                  const d = { id: doc.id, ...(doc.data() || {}) };
                  if (String(d.community || "").trim() !== community) return;
                  byId.set(doc.id, d);
                });
                emit();
              });
              _unsubHistory = () => { try { unsub1(); } catch {} try { unsub2(); } catch {} };
              return;
            } else {
              const map = new Map();
              const q1 = await db.collection("calls").where("toUid", "==", u).limit(80).get();
              const q2 = await db.collection("calls").where("fromUid", "==", u).limit(80).get();
              (q1 && q1.docs ? q1.docs : []).forEach((doc) => map.set(doc.id, { id: doc.id, ...(doc.data() || {}) }));
              (q2 && q2.docs ? q2.docs : []).forEach((doc) => map.set(doc.id, { id: doc.id, ...(doc.data() || {}) }));

              const filtered = peerUid
                ? Array.from(map.values()).filter((d) => {
                    const fromUid = String(d && d.fromUid || "").trim();
                    const toUid = String(d && d.toUid || "").trim();
                    return fromUid === peerUid || toUid === peerUid;
                  })
                : Array.from(map.values());

              const out = sortCallItems(filtered);

              renderHistory(out, u);
              return;
            }

          } catch {
            if (categoryFiltersEl) categoryFiltersEl.innerHTML = `<div class="callrecord-filters-empty">${esc("分類載入失敗")}</div>`;
            historyListEl.innerHTML = `<p class="callrecord-err">${esc("載入通話紀錄失敗（權限不足或網路異常）")}</p>`;
          }
        }

        tabButtons.forEach((btn) => {
          btn.addEventListener("click", () => {
            const next = String(btn.getAttribute("data-tab") || "").trim();
            setActiveTab(next);
            renderHistory(currentAllItems, currentUserId);
          });
        });

        if (categoryFiltersEl) {
          categoryFiltersEl.addEventListener("click", (ev) => {
            const btn = ev.target && ev.target.closest ? ev.target.closest(".cr-filter") : null;
            if (!btn) return;
            const next = String(btn.getAttribute("data-filter") || "").trim();
            if (!next) return;
            viewFilter = next;
            renderHistory(currentAllItems, currentUserId);
          });
        }

        if (btnSelectAllCallsEl) {
          btnSelectAllCallsEl.addEventListener("click", () => {
            if (!selectionMode) selectionMode = true;
            selectedCallIdSet = new Set(getVisibleCallIds());
            updateSelectionUi();
          });
        }

        if (btnCancelSelectionEl) {
          btnCancelSelectionEl.addEventListener("click", () => {
            setSelectionMode(false, { clearSelection: true });
          });
        }

        if (btnDeleteSelectedCallsEl) {
          btnDeleteSelectedCallsEl.addEventListener("click", () => {
            hideSelectedCalls().catch(() => {});
          });
        }

        if (historyListEl) {
          historyListEl.addEventListener("pointerdown", (ev) => {
            const itemEl = ev.target && ev.target.closest ? ev.target.closest(".callrecord-item") : null;
            if (!itemEl) return;
            clearLongPressTimer();
            pressPointerId = ev.pointerId;
            pressTargetId = String(itemEl.getAttribute("data-id") || "").trim();
            pressStartX = Number(ev.clientX || 0);
            pressStartY = Number(ev.clientY || 0);
            pressTimer = window.setTimeout(() => {
              const id = String(pressTargetId || "").trim();
              if (!id) return;
              selectionMode = true;
              selectedCallIdSet = new Set([id]);
              suppressNextClick = true;
              updateSelectionUi();
              clearLongPressTimer();
            }, LONG_PRESS_MS);
          });

          historyListEl.addEventListener("pointermove", (ev) => {
            if (!pressTimer || pressPointerId !== ev.pointerId) return;
            const dx = Math.abs(Number(ev.clientX || 0) - pressStartX);
            const dy = Math.abs(Number(ev.clientY || 0) - pressStartY);
            if (dx > LONG_PRESS_MOVE_PX || dy > LONG_PRESS_MOVE_PX) clearLongPressTimer();
          });

          ["pointerup", "pointercancel", "pointerleave"].forEach((eventName) => {
            historyListEl.addEventListener(eventName, (ev) => {
              if (pressPointerId != null && ev.pointerId != null && pressPointerId !== ev.pointerId) return;
              clearLongPressTimer();
            });
          });

          historyListEl.addEventListener("contextmenu", (ev) => {
            const itemEl = ev.target && ev.target.closest ? ev.target.closest(".callrecord-item") : null;
            if (!itemEl) return;
            ev.preventDefault();
          });

          historyListEl.addEventListener("click", (ev) => {
            const itemEl = ev.target && ev.target.closest ? ev.target.closest(".callrecord-item") : null;
            if (!itemEl) return;
            if (suppressNextClick) {
              suppressNextClick = false;
              ev.preventDefault();
              return;
            }
            if (!selectionMode) return;
            ev.preventDefault();
            toggleSelectCallId(itemEl.getAttribute("data-id"));
          });
        }

        auth.onAuthStateChanged((user) => {
          loadHistory(user).catch(() => {});
        });
      })();
    </script>
  </body>
</html>
