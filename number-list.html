<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>抄錶紀錄申報｜社區系統</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=5" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />
    <link rel="stylesheet" href="css/parcel.css?v=3" />
    <link rel="stylesheet" href="css/meter-reading.css?v=1" />
    <link rel="stylesheet" href="css/ads-footer.css?v=16" />
    <link rel="stylesheet" href="css/pwa.css" />
    <style>
      .nl-meter-card {
        display: grid;
        gap: 10px;
        padding: 14px;
        border-radius: 14px;
        background: #fff;
        border: 1px solid rgba(17, 24, 39, 0.10);
        box-shadow: 0 8px 22px rgba(17, 24, 39, 0.06);
      }
      .nl-meter-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .nl-meter-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 900;
        font-size: 15px;
      }
      .nl-meter-title .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
      }
      .nl-meter-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      @media (max-width: 560px) {
        .nl-meter-fields { grid-template-columns: 1fr; }
      }
      .nl-preview-box {
        margin-top: 4px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(37, 99, 235, 0.08);
        border: 1px dashed rgba(37, 99, 235, 0.35);
        color: #1e40af;
        font-weight: 800;
        font-size: 13px;
        display: grid;
        gap: 4px;
      }
      .nl-preview-box .fee-total { font-size: 17px; color: #9f1c1c; }
      .nl-fee-card {
        display: grid;
        gap: 10px;
        padding: 14px;
        border-radius: 14px;
        background: #fff;
        border: 1px solid rgba(17, 24, 39, 0.10);
        box-shadow: 0 8px 22px rgba(17, 24, 39, 0.06);
      }
      .nl-fee-total {
        font-size: 26px;
        font-weight: 900;
        color: #9f1c1c;
      }
      .nl-fee-row {
        display: grid;
        grid-template-columns: 80px 1fr auto auto;
        gap: 10px;
        align-items: center;
        padding: 8px 0;
        border-top: 1px solid rgba(17, 24, 39, 0.08);
      }
      .nl-fee-row:first-of-type { border-top: 0; }
      .nl-empty {
        padding: 18px;
        border-radius: 14px;
        background: rgba(107, 114, 128, 0.06);
        color: #6b7280;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
      }
      .btn-submit {
        min-width: 160px;
        min-height: 44px;
        padding: 10px 22px;
        border-radius: 999px;
        font-weight: 900;
        font-size: 15px;
        letter-spacing: 0.04em;
        background: linear-gradient(135deg, #d32f2f 0%, #c2185b 100%);
        box-shadow: 0 10px 22px rgba(194, 24, 91, 0.24), inset 0 1px 0 rgba(255,255,255,0.18);
        border: 1px solid rgba(17, 24, 39, 0.08);
        transition: transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
        color: #fff;
      }
      .btn-submit:hover { box-shadow: 0 14px 28px rgba(194, 24, 91, 0.28), inset 0 1px 0 rgba(255,255,255,0.18); }
      .btn-submit:active { transform: translateY(1px); box-shadow: 0 6px 14px rgba(194, 24, 91, 0.22), inset 0 1px 0 rgba(255,255,255,0.18); }
      .btn-submit[disabled], .btn-submit:disabled { opacity: 0.58; cursor: not-allowed; filter: grayscale(0.1); }
      .nl-meta {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(243, 244, 246, 0.85);
        border: 1px solid rgba(17, 24, 39, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="parcel-layout">
      <header class="parcel-hd" id="nlHeader">
        <div class="parcel-hd-content">
          <div class="parcel-title" id="nlTitle">戶號 姓名</div>
        </div>
      </header>

      <div class="parcel-midtop">
        <div class="parcel-tabs" id="nlTabs">
          <button class="tab-btn active" type="button" data-tab="submit">本期申報</button>
          <button class="tab-btn" type="button" data-tab="history">歷史申報</button>
          <button class="tab-btn" type="button" data-tab="fee">繳費通知</button>
        </div>
      </div>

      <main class="parcel-bd">
        <div class="parcel-list" id="submitTab">
          <div style="display:grid; gap:10px;">
            <div class="parcel-filter-bar" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
              <div style="font-weight:900; display:flex; flex-direction:column; gap:4px;">
                <div>本期申報</div>
                <div id="nlLastEdited" class="nl-meta" style="font-weight:700; color:#6b7280; font-size:12px;">尚未輸入資料</div>
              </div>
              <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <label for="nlPeriod" style="font-size:13px; color:#374151; font-weight:800;">月份</label>
                <input id="nlPeriod" type="month" style="min-width:160px;" />
                <label for="nlReadDate" style="font-size:13px; color:#374151; font-weight:800;">抄見日</label>
                <input id="nlReadDate" type="date" style="min-width:160px;" />
              </div>
            </div>

            <div id="nlMeterArea" style="display:grid; gap:12px;">
              <div class="nl-empty">載入中，請稍候...</div>
            </div>

            <div class="status" id="nlSubmitStatus" hidden></div>
          </div>
        </div>

        <div class="parcel-list hidden" id="historyTab">
          <div style="display:grid; gap:10px;">
            <div class="parcel-filter-bar" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
              <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                <button class="tab-btn active" type="button" data-meter-filter="all" style="min-width:64px; flex:0 0 auto; padding:0 14px;">全部</button>
                <button class="tab-btn" type="button" data-meter-filter="electric" style="min-width:80px; flex:0 0 auto; padding:0 14px;">⚡ 電錶</button>
                <button class="tab-btn" type="button" data-meter-filter="water" style="min-width:96px; flex:0 0 auto; padding:0 14px;">💧 自來水</button>
                <button class="tab-btn" type="button" data-meter-filter="gas" style="min-width:80px; flex:0 0 auto; padding:0 14px;">🔥 瓦斯</button>
              </div>
              <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <label for="nlHistMonth" style="font-size:13px; color:#374151; font-weight:800;">月份篩選</label>
                <input id="nlHistMonth" type="month" style="min-width:160px;" />
                <button class="btn" type="button" id="btnHistMonthReset">清除月份</button>
                <button class="btn" type="button" id="btnHistReset">重置</button>
              </div>
            </div>
            <div id="nlHistoryList"><div class="nl-empty">尚未有申報紀錄</div></div>
          </div>
        </div>

        <div class="parcel-list hidden" id="feeTab">
          <div style="display:grid; gap:12px;">
            <div class="parcel-filter-bar" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
              <div style="font-weight:900;">繳費通知</div>
              <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <input id="nlFeePeriod" type="month" style="min-width:160px;" />
              </div>
            </div>
            <div id="nlFeeArea"><div class="nl-empty">尚無本期繳費資訊</div></div>
          </div>
        </div>
      </main>

      <footer class="parcel-ft"></footer>
    </div>

    <div class="modal" id="nlDetailModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="nlDetailModalTitle">
        <div class="modal-hd">
          <h3 class="modal-title" id="nlDetailModalTitle">抄表明細</h3>
          <button class="modal-close" type="button" data-modal-close="1" aria-label="關閉">×</button>
        </div>
        <div class="modal-body" id="nlDetailBody"></div>
        <div class="modal-ft">
          <button class="btn" type="button" data-modal-close="1">關閉</button>
          <button class="btn btn-primary" type="button" id="btnFileDispute">申報核異</button>
        </div>
      </div>
    </div>

    <div class="modal" id="nlDisputeModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="nlDisputeModalTitle">
        <div class="modal-hd">
          <h3 class="modal-title" id="nlDisputeModalTitle">核異申請</h3>
          <button class="modal-close" type="button" data-modal-close="1" aria-label="關閉">×</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label for="nlDisputeReason">核異說明</label>
            <textarea id="nlDisputeReason" rows="3" required placeholder="請簡述資料異常原因，例如數字抄錯、儀表故障等"></textarea>
          </div>
          <div class="field">
            <label for="nlDisputePhoto">現場照片（可多選）</label>
            <input id="nlDisputePhoto" type="file" accept="image/*" multiple />
          </div>
          <div id="nlDisputePreview" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
          <div class="status" id="nlDisputeStatus" hidden></div>
        </div>
        <div class="modal-ft">
          <button class="btn" type="button" data-modal-close="1">取消</button>
          <button class="btn btn-primary" type="button" id="btnDisputeSubmit">送出核異</button>
        </div>
      </div>
    </div>

    <div class="modal" id="nlConfirmSubmitModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="nlConfirmSubmitTitle" style="width:80vw; max-width:720px;">
        <div class="modal-hd">
          <h3 class="modal-title" id="nlConfirmSubmitTitle">確認送出申報</h3>
          <button class="modal-close" type="button" data-modal-close="1" aria-label="關閉">×</button>
        </div>
        <div class="modal-body">
          <div id="nlConfirmSubmitBody" style="display:grid; gap:12px;"></div>
          <div id="nlConfirmSubmitNote" style="margin-top:14px; padding:12px 14px; border-radius:14px; background:rgba(194,24,91,0.08); border:1.5px solid rgba(194,24,91,0.22); color:#9f1c1c; font-size:13px; font-weight:900; line-height:1.6;">
            ※ 按下「確認送出」後，本期資料即送交後台管理員進行審核，<b>無法再自行修改或刪除</b>。<br/>
            ※ 若事後發現數值有誤或需要調整，請<b>洽管理中心協助處理</b>。
          </div>
          <div class="status" id="nlConfirmSubmitStatus" hidden></div>
        </div>
        <div class="modal-ft">
          <button class="btn" type="button" data-modal-close="1">取消</button>
          <button class="btn btn-primary btn-submit" type="button" id="btnConfirmSubmitOk">確認送出</button>
        </div>
      </div>
    </div>

    <div class="modal" id="nlDeleteConfirmModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="nlDeleteConfirmTitle" style="width:80vw; max-width:680px;">
        <div class="modal-hd">
          <h3 class="modal-title" id="nlDeleteConfirmTitle">確認刪除 / 作廢抄錶紀錄</h3>
          <button class="modal-close" type="button" data-modal-close="1" aria-label="關閉">×</button>
        </div>
        <div class="modal-body">
          <div id="nlDeleteConfirmBody" style="display:grid; gap:12px;"></div>
          <div id="nlDeleteConfirmNote" style="margin-top:14px; padding:12px 14px; border-radius:14px; background:rgba(211,47,47,0.08); border:1.5px solid rgba(211,47,47,0.22); color:#9f1c1c; font-size:13px; font-weight:900; line-height:1.6;">
            ※ 按下「確認刪除」後，此筆抄錶申報將<b>作廢並移出本期用量 / 費用統計</b>，<b>無法恢復</b>。<br/>
            ※ 若本期刪除後需要重新申報，可回到「申報」頁籤再次輸入即可。
          </div>
          <div class="status" id="nlDeleteConfirmStatus" hidden></div>
        </div>
        <div class="modal-ft">
          <button class="btn" type="button" data-modal-close="1">取消</button>
          <button class="btn btn-danger btn-submit" type="button" id="btnConfirmDeleteOk">確認刪除</button>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/meter-reading.js?v=17"></script>
    <script src="js/number-list.js?v=22"></script>
    <script src="js/ads-footer.js?v=16"></script>
    <script src="js/pwa.js?v=6"></script>
  </body>
</html>
