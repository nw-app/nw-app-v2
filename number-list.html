<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>抄錶紀錄申報｜社區系統</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=5" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />
    <link rel="stylesheet" href="css/parcel.css?v=3" />
    <link rel="stylesheet" href="css/meter-reading.css?v=1" />
    <link rel="stylesheet" href="css/ads-footer.css?v=16" />
    <link rel="stylesheet" href="css/pwa.css" />
    <style>
      .nl-meter-card {
        display: grid;
        gap: 10px;
        padding: 14px;
        border-radius: 14px;
        background: #fff;
        border: 1px solid rgba(17, 24, 39, 0.10);
        box-shadow: 0 8px 22px rgba(17, 24, 39, 0.06);
      }
      .nl-meter-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .nl-meter-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 900;
        font-size: 15px;
      }
      .nl-meter-title .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
      }
      .nl-meter-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      @media (max-width: 560px) {
        .nl-meter-fields { grid-template-columns: 1fr; }
      }
      .nl-preview-box {
        margin-top: 4px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(37, 99, 235, 0.08);
        border: 1px dashed rgba(37, 99, 235, 0.35);
        color: #1e40af;
        font-weight: 800;
        font-size: 13px;
        display: grid;
        gap: 4px;
      }
      .nl-preview-box .fee-total { font-size: 17px; color: #9f1c1c; }
      .nl-fee-card {
        display: grid;
        gap: 10px;
        padding: 14px;
        border-radius: 14px;
        background: #fff;
        border: 1px solid rgba(17, 24, 39, 0.10);
        box-shadow: 0 8px 22px rgba(17, 24, 39, 0.06);
      }
      .nl-fee-total {
        font-size: 26px;
        font-weight: 900;
        color: #9f1c1c;
      }
      .nl-fee-row {
        display: grid;
        grid-template-columns: 80px 1fr auto auto;
        gap: 10px;
        align-items: center;
        padding: 8px 0;
        border-top: 1px solid rgba(17, 24, 39, 0.08);
      }
      .nl-fee-row:first-of-type { border-top: 0; }
      .nl-empty {
        padding: 18px;
        border-radius: 14px;
        background: rgba(107, 114, 128, 0.06);
        color: #6b7280;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="parcel-layout">
      <header class="parcel-hd" id="nlHeader">
        <div class="parcel-hd-content">
          <div class="parcel-title" id="nlTitle">抄錶紀錄申報</div>
        </div>
      </header>

      <div class="parcel-midtop">
        <div class="parcel-tabs" id="nlTabs">
          <button class="tab-btn active" type="button" data-tab="submit">本期申報</button>
          <button class="tab-btn" type="button" data-tab="history">歷史申報</button>
          <button class="tab-btn" type="button" data-tab="fee">繳費通知</button>
        </div>
      </div>

      <main class="parcel-bd">
        <div class="parcel-list" id="submitTab">
          <div style="display:grid; gap:10px;">
            <div class="parcel-filter-bar" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
              <div style="font-weight:900;">本期申報</div>
              <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <input id="nlPeriod" type="month" style="min-width:160px;" />
                <input id="nlReadDate" type="date" style="min-width:160px;" />
              </div>
            </div>

            <div id="nlMeterArea" style="display:grid; gap:12px;">
              <div class="nl-empty">載入中，請稍候...</div>
            </div>

            <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;">
              <button class="btn" type="button" id="btnPreviewFee">預覽計算</button>
              <button class="btn btn-primary" type="button" id="btnSubmitReadings">送出申報</button>
            </div>
            <div class="status" id="nlSubmitStatus" hidden></div>
          </div>
        </div>

        <div class="parcel-list hidden" id="historyTab">
          <div style="display:grid; gap:10px;">
            <div class="parcel-filter-bar" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
              <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                <button class="tab-btn active" type="button" data-meter-filter="all" style="min-width:64px; flex:0 0 auto; padding:0 14px;">全部</button>
                <button class="tab-btn" type="button" data-meter-filter="electric" style="min-width:80px; flex:0 0 auto; padding:0 14px;">⚡ 電錶</button>
                <button class="tab-btn" type="button" data-meter-filter="water" style="min-width:96px; flex:0 0 auto; padding:0 14px;">💧 自來水</button>
                <button class="tab-btn" type="button" data-meter-filter="gas" style="min-width:80px; flex:0 0 auto; padding:0 14px;">🔥 瓦斯</button>
              </div>
              <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <input id="nlHistFrom" type="month" style="min-width:160px;" />
                <input id="nlHistTo" type="month" style="min-width:160px;" />
                <button class="btn" type="button" id="btnHistReset">重置</button>
              </div>
            </div>
            <div id="nlHistoryList"><div class="nl-empty">尚未有申報紀錄</div></div>
          </div>
        </div>

        <div class="parcel-list hidden" id="feeTab">
          <div style="display:grid; gap:12px;">
            <div class="parcel-filter-bar" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
              <div style="font-weight:900;">繳費通知</div>
              <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <input id="nlFeePeriod" type="month" style="min-width:160px;" />
              </div>
            </div>
            <div id="nlFeeArea"><div class="nl-empty">尚無本期繳費資訊</div></div>
          </div>
        </div>
      </main>

      <footer class="parcel-ft"></footer>
    </div>

    <div class="modal" id="nlDetailModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="nlDetailModalTitle">
        <div class="modal-hd">
          <h3 class="modal-title" id="nlDetailModalTitle">抄表明細</h3>
          <button class="modal-close" type="button" data-modal-close="1" aria-label="關閉">×</button>
        </div>
        <div class="modal-body" id="nlDetailBody"></div>
        <div class="modal-ft">
          <button class="btn" type="button" data-modal-close="1">關閉</button>
          <button class="btn btn-primary" type="button" id="btnFileDispute">申報核異</button>
        </div>
      </div>
    </div>

    <div class="modal" id="nlDisputeModal" hidden>
      <div class="modal-backdrop" data-modal-close="1"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="nlDisputeModalTitle">
        <div class="modal-hd">
          <h3 class="modal-title" id="nlDisputeModalTitle">核異申請</h3>
          <button class="modal-close" type="button" data-modal-close="1" aria-label="關閉">×</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label for="nlDisputeReason">核異說明</label>
            <textarea id="nlDisputeReason" rows="3" required placeholder="請簡述資料異常原因，例如數字抄錯、儀表故障等"></textarea>
          </div>
          <div class="field">
            <label for="nlDisputePhoto">現場照片（可多選）</label>
            <input id="nlDisputePhoto" type="file" accept="image/*" multiple />
          </div>
          <div id="nlDisputePreview" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
          <div class="status" id="nlDisputeStatus" hidden></div>
        </div>
        <div class="modal-ft">
          <button class="btn" type="button" data-modal-close="1">取消</button>
          <button class="btn btn-primary" type="button" id="btnDisputeSubmit">送出核異</button>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/meter-reading.js?v=2"></script>
    <script src="js/number-list.js?v=2"></script>
    <script src="js/ads-footer.js?v=16"></script>
    <script src="js/pwa.js?v=6"></script>
  </body>
</html>
